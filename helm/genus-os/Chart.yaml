apiVersion: v2
name: genus-os
description: Genus OS — agent engine, bridge, orchestrator, the Helm dashboard, optional NATS, and toggleable in-cluster PostgreSQL + Redis subcharts (groundhog2k).
type: application
# Chart version + appVersion bumped by semantic-release via @semantic-release/exec.
version: 1.115.0
appVersion: "1.115.0"
kubeVersion: ">=1.28.0-0"
home: https://github.com/Ironsail-llc/genus-os
sources:
  - https://github.com/Ironsail-llc/genus-os
maintainers:
  - name: Ironsail Platform
    email: platform@ironsail.ai
keywords:
  - agent-engine
  - genus-os
  - ironsail
annotations:
  category: AIPlatform

# In-cluster Postgres + Redis come from upstream community charts.
# Bitnami and operator-based options were deliberately rejected; these are
# small, plain-StatefulSet implementations that match what
# infra/docker-compose.yml provides today.
#
# For staging/prod we set postgres.enabled = redis.enabled = false and point
# database.host / redis.host at managed alternatives (RDS, ElastiCache,
# CloudNativePG, etc).
dependencies:
  - name: postgres
    version: "1.6.3"
    repository: "https://groundhog2k.github.io/helm-charts/"
    condition: postgres.enabled
  # Valkey, never Redis, and never Bitnami (org policy). Official valkey-io
  # chart. Pinned to a cut release: the chart's `main` carries unreleased 1.0
  # breaking renames (valkeyConfig -> extraConfig, dataStorage -> persistence,
  # env -> extraEnv) that hard-fail at render, plus unreleased Sentinel HA.
  # Re-pin only together with a values migration per the chart's UPGRADE.md.
  - name: valkey
    version: "0.12.0"
    repository: "https://valkey.io/valkey-helm/"
    # Two paths, first-existing wins (Helm semantics). `valkey.enabled` is
    # canonical; `redis.enabled` is kept working so values files written against
    # the Redis subchart keep their meaning — the toggle still means "deploy the
    # cache this chart ships", it is just Valkey now. values.yaml therefore does
    # NOT define valkey.enabled: defining it would make the first path always
    # exist and the alias dead.
    condition: valkey.enabled,redis.enabled
