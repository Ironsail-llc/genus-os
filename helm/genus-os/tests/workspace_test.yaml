suite: workspace persistence
release:
  name: gos
  namespace: genus
tests:
  - it: creates a PVC when persistence is enabled
    template: workspace-pvc.yaml
    set:
      workspace.persistence.enabled: true
      workspace.persistence.size: 50Gi
    asserts:
      - isKind:
          of: PersistentVolumeClaim
      - equal:
          path: metadata.name
          value: gos-genus-os-workspace
      - equal:
          path: spec.resources.requests.storage
          value: 50Gi

  - it: does not create a PVC for an existing claim
    template: workspace-pvc.yaml
    set:
      workspace.persistence.enabled: true
      workspace.persistence.existingClaim: shared-workspace
    asserts:
      - hasDocuments:
          count: 0

  - it: mounts an immutable ConfigMap workspace
    template: engine/workload.yaml
    set:
      workspace.configMap.name: genus-workspace
      workspace.configMap.items:
        - key: main.yaml
          path: docs/agents/main.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: spec.template.spec.volumes[0].configMap.name
          value: genus-workspace
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].readOnly
          value: true
      - equal:
          path: spec.template.spec.volumes[0].configMap.items[0].path
          value: docs/agents/main.yaml
