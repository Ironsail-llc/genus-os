suite: the Valkey ACL secret follows the release name
# The server reads its ACL password from this chart's `cache` Secret, so the
# name the subchart mounts must equal the name this chart creates. A literal is
# only right for one release name: under any other the pod mounts a Secret that
# does not exist and sits in CreateContainerConfigError, which neither helm lint
# nor helm unittest can see. values.yaml therefore derives it, and
# templates/validate.yaml fails the render if the derivation stops matching.
release:
  name: gos
  namespace: genus
tests:
  - it: the subchart mounts the Secret this chart creates, under a release name that is not the chart name
    # `gos` does not contain `genus-os`, so fullname is `gos-genus-os` and the
    # Secret is `gos-genus-os-cache` — not the `genus-os-cache` a literal gave.
    template: charts/valkey/templates/deploy_valkey.yaml
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: valkey-users-secret
            secret:
              defaultMode: 256
              secretName: gos-genus-os-cache
          any: true

  - it: the password is read from the shared key, not a per-user one
    template: charts/valkey/templates/init_config.yaml
    asserts:
      - matchRegex:
          path: data["init.sh"]
          pattern: ROBOTHOR_REDIS_PASSWORD

  - it: the cache Secret this chart creates carries the same name
    template: vaultstaticsecret.yaml
    asserts:
      - exists:
          path: metadata.name
      - matchRegex:
          path: metadata.name
          pattern: ^gos-genus-os-(database|cache|auth-signing|bridge-sso|bridge-oidc|dashboard-auth|engine-providers|bridge-integrations|orchestrator-providers)$

  - it: fullnameOverride is rejected rather than silently breaking the mount
    # The derived expression cannot see fullnameOverride, so the guard is what
    # stops this rendering into a pod that never starts.
    set:
      fullnameOverride: custom
    asserts:
      - failedTemplate:
          errorPattern: 'resolves to "gos-genus-os-cache" but this chart creates the cache Secret as "custom-cache"'

  - it: a hand-written literal that does not match is rejected
    set:
      valkey.auth.usersExistingSecret: some-other-secret
    asserts:
      - failedTemplate:
          errorPattern: 'resolves to "some-other-secret" but this chart creates the cache Secret as "gos-genus-os-cache"'

  - it: the guard is silent when valkey auth is off, since nothing is mounted
    set:
      valkey.auth.enabled: false
      valkey.auth.usersExistingSecret: ""
    template: vaultstaticsecret.yaml
    asserts:
      - exists:
          path: metadata.name

  - it: the legacy redis.enabled toggle still turns the cache off
    # Values files written against the Redis subchart keep their meaning: the
    # toggle still means "deploy the cache this chart ships", now Valkey. The
    # Chart.yaml condition is `valkey.enabled,redis.enabled` and values.yaml
    # deliberately leaves valkey.enabled unset so this fallback stays live.
    template: engine/workload.yaml
    set:
      redis.enabled: false
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: ROBOTHOR_REDIS_HOST
          any: true

  - it: the canonical valkey.enabled wins over the legacy key
    template: engine/workload.yaml
    set:
      redis.enabled: false
      valkey.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ROBOTHOR_REDIS_HOST
            value: gos-valkey
        documentIndex: 0

  - it: and the other way round
    template: engine/workload.yaml
    set:
      redis.enabled: true
      valkey.enabled: false
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: ROBOTHOR_REDIS_HOST
          any: true
