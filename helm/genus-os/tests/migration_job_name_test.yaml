suite: migration Job name follows everything immutable in the Job
release:
  name: gos
  namespace: genus
# Pinned: the chart and app versions land in the pod template's labels, so the
# baseline below must not move with every release's version bump.
chart:
  version: 1.0.0
  appVersion: 1.0.0
# A Job's pod template is immutable. If any of it changes while the name stays
# the same, the upgrade fails with "field is immutable" and the release is left
# half-applied. The name therefore hashes the whole rendered pod template, so
# every such change produces a new Job that runs once.
tests:
  - it: name is not derived from the image tag alone
    template: migrations/job.yaml
    set:
      global.imageTag: v1.4.0
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: "^gos-genus-os-migrate-[a-f0-9]{8}$"
      # sha256("v1.4.0")[:8] -- the old, image-only name.
      - notEqual:
          path: metadata.name
          value: gos-genus-os-migrate-63556338

  # The pairs below pin every input except the one under test. The cache is
  # pinned off under both of its toggles so the baseline does not move with
  # the cache wiring the shared environment renders.
  - it: baseline name for the pinned values
    template: migrations/job.yaml
    set: &baseline
      global.imageTag: v1.4.0
      global.authEnforce: true
      global.deployedAt: ""
      database.sslMode: prefer
      redis.enabled: false
      valkey.enabled: false
    asserts:
      - equal:
          path: metadata.name
          value: &baselineName gos-genus-os-migrate-021eda63

  - it: changing an auth flag renames the Job
    template: migrations/job.yaml
    set:
      <<: *baseline
      global.authEnforce: false
    asserts:
      - notEqual: &notBaseline
          path: metadata.name
          value: *baselineName

  - it: changing database.sslMode renames the Job
    template: migrations/job.yaml
    set:
      <<: *baseline
      database.sslMode: verify-full
    asserts:
      - notEqual: *notBaseline

  - it: adding a database CA bundle renames the Job
    template: migrations/job.yaml
    set:
      <<: *baseline
      database.tls.caConfigMap: db-ca-bundle
    asserts:
      - notEqual: *notBaseline

  - it: changing a deploy breadcrumb renames the Job
    template: migrations/job.yaml
    set:
      <<: *baseline
      global.deployedAt: "2026-01-01T00:00:00Z"
    asserts:
      - notEqual: *notBaseline

  - it: changing the migration command renames the Job
    template: migrations/job.yaml
    set:
      <<: *baseline
      migrations.command: ["python", "-m", "robothor.cli", "migrate", "--check"]
    asserts:
      - notEqual: *notBaseline

  - it: a chart version bump renames the Job (helm.sh/chart label)
    template: migrations/job.yaml
    chart:
      version: 1.0.1
    set:
      <<: *baseline
    asserts:
      - notEqual: *notBaseline

  - it: an app version bump renames the Job (app.kubernetes.io/version label)
    template: migrations/job.yaml
    chart:
      appVersion: 1.0.1
    set:
      <<: *baseline
    asserts:
      - notEqual: *notBaseline

  - it: changing the ServiceAccount renames the Job
    template: migrations/job.yaml
    set:
      <<: *baseline
      serviceAccount.create: false
      serviceAccount.names.migrations: migrations-sa
    asserts:
      - notEqual: *notBaseline

  - it: changing the container security context renames the Job
    template: migrations/job.yaml
    set:
      <<: *baseline
      global.securityContext.runAsUser: 12345
    asserts:
      - notEqual: *notBaseline

  - it: changing a node selector renames the Job
    template: migrations/job.yaml
    set:
      <<: *baseline
      global.nodeSelector.pool: migrations
    asserts:
      - notEqual: *notBaseline

  - it: changing tolerations renames the Job
    template: migrations/job.yaml
    set:
      <<: *baseline
      migrations.tolerations:
        - key: dedicated
          operator: Exists
          effect: NoSchedule
    asserts:
      - notEqual: *notBaseline

  - it: changing pull secrets renames the Job
    template: migrations/job.yaml
    set:
      <<: *baseline
      global.imagePullSecrets: []
    asserts:
      - notEqual: *notBaseline

  - it: an unchanged release keeps its name, so a completed Job is not re-run
    template: migrations/job.yaml
    set:
      <<: *baseline
      # Fields outside the Job's pod template do not rename it.
      dashboard.replicaCount: 5
    asserts:
      - equal:
          path: metadata.name
          value: *baselineName

  - it: watchers and RBAC follow the renamed Job
    template: migrations/rbac.yaml
    documentIndex: 0
    set:
      global.imageTag: v1.4.0
      global.authEnforce: false
    asserts:
      - notEqual:
          path: rules[0].resourceNames[0]
          value: gos-genus-os-migrate-63556338
      - matchRegex:
          path: rules[0].resourceNames[0]
          pattern: "^gos-genus-os-migrate-[a-f0-9]{8}$"
