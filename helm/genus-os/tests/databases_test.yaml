suite: subchart toggles
release:
  name: gos
  namespace: genus
tests:
  - it: postgres-host helper points at the subchart Service name by default
    template: engine/workload.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ROBOTHOR_DB_HOST
            value: gos-postgres
        documentIndex: 0

  - it: cache-host helper points at the valkey subchart Service name by default
    template: engine/workload.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ROBOTHOR_REDIS_HOST
            value: gos-valkey
        documentIndex: 0

  - it: ROBOTHOR_DB_* not in explicit env when postgres.enabled=false
    # External RDS — chart drops the explicit env block so the VSO-
    # materialized envFrom Secret can supply HOST/PORT/NAME/USER/PASSWORD
    # without being shadowed (explicit `env:` wins over `envFrom:` in k8s).
    template: engine/workload.yaml
    set:
      postgres.enabled: false
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: ROBOTHOR_DB_HOST
          any: true
        documentIndex: 0
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ROBOTHOR_DB_SSLMODE
            value: prefer
        documentIndex: 0
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: ROBOTHOR_DB_USER
          any: true
        documentIndex: 0

  - it: ROBOTHOR_REDIS_* not in explicit env when valkey.enabled=false
    # External cache — chart drops the explicit env block so the VSO-
    # materialized `cache` Secret can supply HOST/PORT/PASSWORD without being
    # shadowed (explicit `env:` wins over `envFrom:` in k8s).
    template: engine/workload.yaml
    set:
      valkey.enabled: false
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: ROBOTHOR_REDIS_HOST
          any: true
        documentIndex: 0
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: ROBOTHOR_REDIS_PORT
          any: true
        documentIndex: 0

  - it: migrations job pulls the postgres image from the configured registry/repo/tag
    template: migrations/job.yaml
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].image
          value: docker.io/pgvector/pgvector:pg16

  - it: migrations job drops wait-for-postgres init when postgres.enabled=false
    template: migrations/job.yaml
    set:
      postgres.enabled: false
      database.host: rds.example.com
    asserts:
      - notExists:
          path: spec.template.spec.initContainers

  - it: explicit redis.host overrides the derived valkey Service name
    template: engine/workload.yaml
    set:
      redis.host: cache.example.internal
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ROBOTHOR_REDIS_HOST
            value: cache.example.internal
        documentIndex: 0
