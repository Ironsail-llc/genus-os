suite: in-cluster databases
release:
  name: gos
  namespace: genus
tests:
  - it: postgres StatefulSet renders by default
    template: postgres/statefulset.yaml
    asserts:
      - isKind:
          of: StatefulSet
      - equal:
          path: spec.template.spec.containers[0].image
          value: pgvector/pgvector:pg16
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_USER
            value: robothor

  - it: postgres can be disabled
    template: postgres/statefulset.yaml
    set:
      postgres.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: redis StatefulSet renders by default
    template: redis/statefulset.yaml
    asserts:
      - isKind:
          of: StatefulSet
      - equal:
          path: spec.template.spec.containers[0].image
          value: redis:7-alpine

  - it: redis can be disabled
    template: redis/statefulset.yaml
    set:
      redisInCluster.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: postgres headless service has no ClusterIP
    template: postgres/service.yaml
    asserts:
      - equal:
          path: spec.clusterIP
          value: None
