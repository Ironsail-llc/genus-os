suite: migrations job + RBAC + wait-for-migrations init
release:
  name: gos
  namespace: genus
tests:
  # ─── Job is a normal resource (no helm hooks) ──────────────────────────────
  - it: migration Job is not a helm hook
    template: migrations/job.yaml
    asserts:
      - isKind:
          of: Job
      - notExists:
          path: metadata.annotations["helm.sh/hook"]
      - notExists:
          path: metadata.annotations["helm.sh/hook-weight"]
      - notExists:
          path: metadata.annotations["helm.sh/hook-delete-policy"]

  - it: Job name is content-addressed on imageTag
    template: migrations/job.yaml
    set:
      global.imageTag: v1.4.0
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: "^gos-genus-os-migrate-[a-f0-9]{8}$"

  - it: Job receives only the database secret class
    template: migrations/job.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: gos-genus-os-database
      - notContains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: gos-genus-os-auth-signing
      - notContains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: gos-genus-os-engine-providers

  - it: Job rejects any non-database secret class
    template: migrations/job.yaml
    set:
      migrations.secretRefs: [database, auth-signing]
    asserts:
      - failedTemplate:
          errorMessage: 'migrations.secretRefs is DB-only and forbids secret class "auth-signing"'

  - it: Job has wait-for-postgres initContainer when postgres.enabled
    template: migrations/job.yaml
    asserts:
      - contains:
          path: spec.template.spec.initContainers
          content:
            name: wait-for-postgres
          any: true

  - it: Job drops wait-for-postgres when postgres.enabled=false (cloud env)
    template: migrations/job.yaml
    set:
      postgres.enabled: false
      database.host: rds.example.com
    asserts:
      - notExists:
          path: spec.template.spec.initContainers

  - it: Job pod does not mount an API token
    template: migrations/job.yaml
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
      - equal:
          path: spec.template.spec.serviceAccountName
          value: gos-genus-os-migrations

  - it: Job propagates global.imagePullSecrets (private GHCR image)
    template: migrations/job.yaml
    set:
      global.imagePullSecrets:
        - name: ghcr-pull-secret
    asserts:
      - contains:
          path: spec.template.spec.imagePullSecrets
          content:
            name: ghcr-pull-secret
          any: true

  - it: Job omits imagePullSecrets when global.imagePullSecrets is empty
    template: migrations/job.yaml
    set:
      global.imagePullSecrets: []
    asserts:
      - notExists:
          path: spec.template.spec.imagePullSecrets

  - it: Job references ghcr-credentials pull secret by default
    template: migrations/job.yaml
    asserts:
      - contains:
          path: spec.template.spec.imagePullSecrets
          content:
            name: ghcr-credentials
          any: true

  # ─── RBAC is scoped via resourceNames ──────────────────────────────────────
  - it: Role permits only get on the release migration Job
    template: migrations/rbac.yaml
    documentIndex: 0
    asserts:
      - isKind:
          of: Role
      - contains:
          path: rules
          content:
            apiGroups: ["batch"]
            resources: ["jobs"]
            verbs: ["get"]
            resourceNames:
              - gos-genus-os-migrate-908f5ee7

  - it: RoleBinding targets separate Python ServiceAccounts
    template: migrations/rbac.yaml
    documentIndex: 1
    asserts:
      - isKind:
          of: RoleBinding
      - equal:
          path: subjects[0].name
          value: gos-genus-os-engine
      - equal:
          path: subjects[1].name
          value: gos-genus-os-bridge
      - equal:
          path: subjects[2].name
          value: gos-genus-os-orchestrator
      - equal:
          path: roleRef.name
          value: gos-genus-os-migration-watcher

  # ─── migrations.enabled: false disables EVERYTHING ─────────────────────────
  - it: Job is not rendered when migrations disabled
    template: migrations/job.yaml
    set:
      migrations.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: RBAC is not rendered when migrations disabled
    template: migrations/rbac.yaml
    set:
      migrations.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: RBAC is not rendered when no workload watches migrations
    template: migrations/rbac.yaml
    set:
      engine.enabled: false
      bridge.enabled: false
      orchestrator.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  # ─── wait-for-migrations initContainer on app pods ─────────────────────────
  - it: engine pod has wait-for-migrations initContainer
    template: engine/workload.yaml
    documentIndex: 0
    asserts:
      - contains:
          path: spec.template.spec.initContainers
          content:
            name: wait-for-migrations
          any: true

  - it: engine projects a short-lived API token only into migration watcher
    template: engine/workload.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
      - contains:
          path: spec.template.spec.initContainers[0].volumeMounts
          content:
            name: migration-api-token
            mountPath: /var/run/secrets/kubernetes.io/serviceaccount
            readOnly: true
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: migration-api-token
          any: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: migration-api-token
            projected:
              defaultMode: 256
              sources:
                - serviceAccountToken:
                    path: token
                    expirationSeconds: 600
                - configMap:
                    name: kube-root-ca.crt
                    items:
                      - key: ca.crt
                        path: ca.crt
                - downwardAPI:
                    items:
                      - path: namespace
                        fieldRef:
                          fieldPath: metadata.namespace

  - it: engine pod does NOT mount SA token when migrations disabled
    template: engine/workload.yaml
    documentIndex: 0
    set:
      migrations.enabled: false
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false

  - it: engine pod has no wait-for-migrations initContainer when migrations disabled
    template: engine/workload.yaml
    documentIndex: 0
    set:
      migrations.enabled: false
    asserts:
      - notExists:
          path: spec.template.spec.initContainers
