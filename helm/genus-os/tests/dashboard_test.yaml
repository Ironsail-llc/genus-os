suite: dashboard workload
release:
  name: gos
  namespace: genus
tests:
  - it: dashboard deployment renders with HPA disabled
    template: dashboard/deployment.yaml
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.replicas
          value: 2

  - it: dashboard wires internal backends and same-origin browser proxy
    template: dashboard/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NEXT_PUBLIC_BRIDGE_URL
            value: /api/bridge
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: BRIDGE_URL
            value: http://gos-genus-os-bridge:9100
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ORCHESTRATOR_URL
            value: http://gos-genus-os-orchestrator:9099
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ROBOTHOR_ENGINE_URL
            value: http://gos-genus-os-engine:18800
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NEXT_PUBLIC_OWNER_NAME
            value: "there"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NEXT_PUBLIC_AI_NAME
            value: "Robothor"
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: gos-genus-os-dashboard-auth
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: gos-genus-os-bridge-sso
      - notContains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: gos-genus-os-database
      - notContains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: gos-genus-os-auth-signing
      - notContains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: gos-genus-os-engine-providers

  - it: dashboard fails rendering if a privileged secret is requested
    template: dashboard/deployment.yaml
    set:
      dashboard.secretRefs: [dashboard-auth, bridge-sso, engine-providers]
    asserts:
      - failedTemplate:
          errorMessage: 'dashboard.secretRefs forbids privileged secret class "engine-providers"; only dashboard-auth and bridge-sso are allowed'

  - it: dashboard never mounts a Kubernetes API token
    template: dashboard/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
      - equal:
          path: spec.template.spec.serviceAccountName
          value: gos-genus-os-dashboard

  - it: dashboard probes separate liveness and readiness
    template: dashboard/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /api/live
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /api/ready

  - it: HPA renders when autoscaling enabled
    template: dashboard/hpa.yaml
    set:
      dashboard.autoscaling.enabled: true
      dashboard.autoscaling.minReplicas: 3
      dashboard.autoscaling.maxReplicas: 12
    asserts:
      - isKind:
          of: HorizontalPodAutoscaler
      - equal:
          path: spec.minReplicas
          value: 3
      - equal:
          path: spec.maxReplicas
          value: 12

  - it: HPA does not render when autoscaling disabled
    template: dashboard/hpa.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: ingress requires host when enabled
    template: dashboard/ingress.yaml
    set:
      dashboard.ingress.enabled: true
      dashboard.ingress.host: ""
    asserts:
      - failedTemplate:
          errorMessage: "dashboard.ingress.host is required when dashboard.ingress.enabled"

  - it: ingress renders the configured host + className
    template: dashboard/ingress.yaml
    set:
      dashboard.ingress.enabled: true
      dashboard.ingress.host: genus-os.example.com
      dashboard.ingress.className: traefik-public
    asserts:
      - isKind:
          of: Ingress
      - equal:
          path: spec.ingressClassName
          value: traefik-public
      - equal:
          path: spec.rules[0].host
          value: genus-os.example.com
