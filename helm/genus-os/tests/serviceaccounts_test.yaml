suite: per-component service accounts
release:
  name: gos
  namespace: genus
tests:
  - it: creates a distinct account for each enabled workload and Helm test
    template: serviceaccount.yaml
    asserts:
      - hasDocuments:
          count: 6

  - it: Engine account is component-scoped with token mount denied by default
    template: serviceaccount.yaml
    documentSelector:
      path: metadata.name
      value: gos-genus-os-engine
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: engine
      - equal:
          path: automountServiceAccountToken
          value: false

  - it: enabling NATS creates its own account
    template: serviceaccount.yaml
    set:
      nats.enabled: true
    documentSelector:
      path: metadata.name
      value: gos-genus-os-nats
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: automountServiceAccountToken
          value: false

  - it: externally managed accounts can be mapped per component
    template: engine/workload.yaml
    documentIndex: 0
    set:
      serviceAccount.create: false
      serviceAccount.names.engine: external-engine
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: external-engine

  - it: disabling account creation renders no chart accounts
    template: serviceaccount.yaml
    set:
      serviceAccount.create: false
    asserts:
      - hasDocuments:
          count: 0
