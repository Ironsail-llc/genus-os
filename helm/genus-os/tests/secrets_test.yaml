suite: vault static secret
release:
  name: gos
  namespace: genus
templates:
  - vaultstaticsecret.yaml
tests:
  - it: VaultStaticSecret renders with the configured mount + path
    set:
      vault.mount: cluster-is
      vault.path: genus-os/production
    asserts:
      - isKind:
          of: VaultStaticSecret
      - equal:
          path: apiVersion
          value: secrets.hashicorp.com/v1beta1
      - equal:
          path: spec.mount
          value: cluster-is
      - equal:
          path: spec.path
          value: genus-os/production
      - equal:
          path: spec.destination.name
          value: gos-genus-os-credentials
      - equal:
          path: spec.destination.create
          value: true

  - it: rolloutRestartTargets covers every enabled Deployment
    asserts:
      - contains:
          path: spec.rolloutRestartTargets
          content:
            kind: Deployment
            name: gos-genus-os-engine
      - contains:
          path: spec.rolloutRestartTargets
          content:
            kind: Deployment
            name: gos-genus-os-bridge
      - contains:
          path: spec.rolloutRestartTargets
          content:
            kind: Deployment
            name: gos-genus-os-orchestrator
      - contains:
          path: spec.rolloutRestartTargets
          content:
            kind: Deployment
            name: gos-genus-os-dashboard

  - it: disabled components are excluded from rolloutRestartTargets
    set:
      orchestrator.enabled: false
      dashboard.enabled: false
    asserts:
      - notContains:
          path: spec.rolloutRestartTargets
          content:
            kind: Deployment
            name: gos-genus-os-orchestrator
          any: true
      - notContains:
          path: spec.rolloutRestartTargets
          content:
            kind: Deployment
            name: gos-genus-os-dashboard
          any: true

  - it: not rendered when vault.enabled=false (local dev)
    set:
      vault.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: defaults — kv-v2 type, vault-auth ref, 1m refresh
    asserts:
      - equal:
          path: spec.type
          value: kv-v2
      - equal:
          path: spec.vaultAuthRef
          value: vault-auth
      - equal:
          path: spec.refreshAfter
          value: 1m

  - it: vault.mount is required
    set:
      vault.mount: ""
    asserts:
      - failedTemplate:
          errorMessage: "vault.mount is required (cluster KV mount, e.g. cluster-is)"

  - it: vault.path is required
    set:
      vault.path: ""
    asserts:
      - failedTemplate:
          errorMessage: "vault.path is required (e.g. genus-os/staging)"
