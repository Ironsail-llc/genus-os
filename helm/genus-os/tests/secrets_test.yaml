suite: per-component Vault secret isolation
release:
  name: gos
  namespace: genus
templates:
  - vaultstaticsecret.yaml
tests:
  - it: database class renders from its independently configured path
    set:
      vault.mount: cluster-is
      vault.secrets.database.path: genus-os/production/database
    documentSelector:
      path: metadata.name
      value: gos-genus-os-database
    asserts:
      - isKind:
          of: VaultStaticSecret
      - equal:
          path: apiVersion
          value: secrets.hashicorp.com/v1beta1
      - equal:
          path: spec.mount
          value: cluster-is
      - equal:
          path: spec.path
          value: genus-os/production/database
      - equal:
          path: spec.destination.name
          value: gos-genus-os-database

  - it: database rotation restarts Python services but never dashboard
    documentSelector:
      path: metadata.name
      value: gos-genus-os-database
    asserts:
      - contains:
          path: spec.rolloutRestartTargets
          content:
            kind: Deployment
            name: gos-genus-os-engine
      - contains:
          path: spec.rolloutRestartTargets
          content:
            kind: Deployment
            name: gos-genus-os-bridge
      - contains:
          path: spec.rolloutRestartTargets
          content:
            kind: Deployment
            name: gos-genus-os-orchestrator
      - notContains:
          path: spec.rolloutRestartTargets
          content:
            kind: Deployment
            name: gos-genus-os-dashboard

  - it: dashboard auth rotation restarts dashboard only
    documentSelector:
      path: metadata.name
      value: gos-genus-os-dashboard-auth
    asserts:
      - equal:
          path: spec.rolloutRestartTargets
          value:
            - kind: Deployment
              name: gos-genus-os-dashboard

  - it: bridge exchange secret is the only cross-boundary dashboard secret
    documentSelector:
      path: metadata.name
      value: gos-genus-os-bridge-sso
    asserts:
      - contains:
          path: spec.rolloutRestartTargets
          content:
            kind: Deployment
            name: gos-genus-os-bridge
      - contains:
          path: spec.rolloutRestartTargets
          content:
            kind: Deployment
            name: gos-genus-os-dashboard
      - notContains:
          path: spec.rolloutRestartTargets
          content:
            kind: Deployment
            name: gos-genus-os-engine

  - it: engine provider rotation never restarts dashboard or Bridge
    documentSelector:
      path: metadata.name
      value: gos-genus-os-engine-providers
    asserts:
      - equal:
          path: spec.rolloutRestartTargets
          value:
            - kind: Deployment
              name: gos-genus-os-engine

  - it: disabled consumers are omitted from rollout targets
    set:
      engine.enabled: false
    documentSelector:
      path: metadata.name
      value: gos-genus-os-engine-providers
    asserts:
      - notExists:
          path: spec.rolloutRestartTargets

  - it: not rendered when Vault is disabled
    set:
      vault.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: defaults use kv-v2 auth ref and short refresh
    documentSelector:
      path: metadata.name
      value: gos-genus-os-database
    asserts:
      - equal:
          path: spec.type
          value: kv-v2
      - equal:
          path: spec.vaultAuthRef
          value: vault-auth
      - equal:
          path: spec.refreshAfter
          value: 1m

  - it: vault mount is required
    set:
      vault.mount: ""
    asserts:
      - failedTemplate:
          errorMessage: "vault.mount is required (cluster KV mount, e.g. cluster-is)"

  - it: every named secret path is required
    set:
      vault.secrets.database.path: ""
    asserts:
      - failedTemplate:
          errorMessage: vault.secrets.database.path is required
