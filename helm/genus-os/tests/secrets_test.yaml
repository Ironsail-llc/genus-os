suite: external secrets
release:
  name: gos
  namespace: genus
tests:
  - it: ExternalSecret renders with the configured remote path
    template: externalsecret.yaml
    set:
      externalSecrets.remoteRef: secret/data/genus-os/production
    asserts:
      - isKind:
          of: ExternalSecret
      - equal:
          path: spec.target.name
          value: gos-genus-os-credentials
      - equal:
          path: spec.data[0].remoteRef.key
          value: secret/data/genus-os/production

  - it: ExternalSecret has one data entry per configured key
    template: externalsecret.yaml
    asserts:
      - equal:
          path: spec.data[0].secretKey
          value: ROBOTHOR_DB_PASSWORD
      - contains:
          path: spec.data
          content:
            secretKey: ANTHROPIC_API_KEY
            remoteRef:
              key: secret/data/genus-os/staging
              property: anthropic_api_key

  - it: not rendered when externalSecrets disabled
    template: externalsecret.yaml
    set:
      externalSecrets.enabled: false
    asserts:
      - hasDocuments:
          count: 0
