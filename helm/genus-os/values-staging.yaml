# Layer 2 — staging environment.
# Org pattern: env-specific config (ingress, vault path, replicas, resources,
# DB host) lives in this file in the APP REPO. Single ArgoCD source.
#
# `global.imageTag` and breadcrumbs are mutated by the deploy-staging
# workflow on PR labeling (`pr-N-sha-<short>`) and reset to the latest
# released `vX.Y.Z` on PR close / unlabel.

global:
  imageTag: "v1.117.0"
  environment: staging
  authEnforce: true
  deployedFromPR: ""
  deployedAt: ""
# Cloud env — never run the in-cluster subcharts. RDS supplies Postgres.
postgres:
  enabled: false
# Cache: in-cluster Valkey from the chart's own subchart, one per deployment.
# Deliberately not a managed cache service: the pinned chart has no Sentinel,
# so a single managed node would buy failover the chart cannot yet express
# anyway, and a dedicated instance keeps the ACL grant and the memory budget
# scoped to this release. Host is derived as {release}-valkey; the ACL password
# is the same ROBOTHOR_REDIS_PASSWORD the clients read.
valkey:
  enabled: true
database:
  sslMode: verify-full
  tls:
    # verify-full needs the CA that signs the managed database's certificate.
    # The deployment supplies this ConfigMap in the release namespace; the
    # chart refuses to render verify-full here without it.
    caConfigMap: genus-os-db-ca
workspace:
  allowEmptyFleet: false
  minAgentCount: 1
  requiredAgentIds: [main]
  persistence:
    enabled: true
    size: 20Gi
# Vault Secrets Operator wiring. Secret classes remain independently rotatable
# and are projected only into the components that need them.
vault:
  enabled: true
  mount: cluster-is
  type: kv-v2
  refreshAfter: 1m
  authRef: vault-auth
  secrets:
    database:
      path: ironsail-staging/genus-os/database
    cache:
      path: ironsail-staging/genus-os/cache
    auth-signing:
      path: ironsail-staging/genus-os/auth-signing
    bridge-sso:
      path: ironsail-staging/genus-os/bridge-sso
    bridge-oidc:
      path: ironsail-staging/genus-os/bridge-oidc
    dashboard-auth:
      path: ironsail-staging/genus-os/dashboard-auth
    engine-providers:
      path: ironsail-staging/genus-os/engine-providers
    bridge-integrations:
      path: ironsail-staging/genus-os/bridge-integrations
    orchestrator-providers:
      path: ironsail-staging/genus-os/orchestrator-providers
# Dashboard ingress — internal-only for now (Cloudflare Access can be
# layered later via traefik-public if/when an external surface is needed).
dashboard:
  enabled: true
  replicaCount: 2
  ingress:
    enabled: true
    className: traefik-private
    host: genus-os.staging.internal.ironsail.ai
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
    tls:
      - secretName: genus-os-staging-tls
        hosts:
          - genus-os.staging.internal.ironsail.ai
# Engine is single-writer (Recreate). Keep 1 replica in staging too.
engine:
  enabled: true
  replicaCount: 1
bridge:
  enabled: true
  replicaCount: 2
orchestrator:
  enabled: true
  replicaCount: 2
networkPolicy:
  enabled: true
  egress:
    enabled: true
    # Fail closed until Layer 3 declares exact managed-service/API CIDRs.
