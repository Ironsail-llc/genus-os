{{- /* External and managed destinations: one policy per destination class. */}}
{{- if .Values.networkPolicy.egress.enabled }}
{{- range $destinationName, $destination := .Values.networkPolicy.egress.destinations }}
{{- if $destination.cidrs }}
{{- if not $destination.components }}{{ fail (printf "networkPolicy.egress.destinations.%s.components is required" $destinationName) }}{{ end }}
{{- if not $destination.ports }}{{ fail (printf "networkPolicy.egress.destinations.%s.ports is required" $destinationName) }}{{ end }}
{{- range $component := $destination.components }}
{{- if not (has $component (list "engine" "bridge" "orchestrator" "dashboard" "migrations" "helm-test")) }}{{ fail (printf "networkPolicy egress destination %s contains unknown component %s" $destinationName $component) }}{{ end }}
{{- if and (eq $component "dashboard") (ne $destinationName "identity") }}{{ fail (printf "dashboard external egress is restricted to the identity destination; remove it from %s" $destinationName) }}{{ end }}
{{- if and (eq $destinationName "identity") (ne $component "dashboard") }}{{ fail (printf "identity destination is dashboard-only; remove component %s" $component) }}{{ end }}
{{- end }}
{{- range $cidr := $destination.cidrs }}
{{- if or (eq $cidr "0.0.0.0/0") (eq $cidr "::/0") }}{{ fail (printf "networkPolicy egress destination %s rejects unrestricted CIDR %s" $destinationName $cidr) }}{{ end }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "genus-os.fullname" $root }}-{{ $destinationName }}-egress
  labels:
    {{- include "genus-os.labels" (dict "root" $root "component" "shared") | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [{{ include "genus-os.name" $root }}]
      - key: app.kubernetes.io/instance
        operator: In
        values: [{{ $root.Release.Name }}]
      - key: app.kubernetes.io/component
        operator: In
        values:
          {{- range $component := $destination.components }}
          - {{ $component }}
          {{- end }}
  policyTypes: [Egress]
  egress:
    {{- range $cidr := $destination.cidrs }}
    - to:
        - ipBlock:
            cidr: {{ $cidr }}
      ports:
        {{- toYaml $destination.ports | nindent 8 }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}

{{- /* Traefik ingress is component and port scoped. */}}
{{- range $component := list "engine" "bridge" "orchestrator" "dashboard" }}
{{- $cv := index $root.Values $component }}
{{- if and $cv.enabled $cv.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "genus-os.fullname" $root }}-allow-traefik-{{ $component }}
  labels:
    {{- include "genus-os.labels" (dict "root" $root "component" $component) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "genus-os.selectorLabels" (dict "root" $root "component" $component) | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $root.Values.networkPolicy.traefikNamespace | default "traefik" }}
          podSelector:
            matchLabels:
              {{- toYaml $root.Values.networkPolicy.traefikPodSelector | nindent 14 }}
      ports:
        - {protocol: TCP, port: {{ $cv.service.port }}}
{{- end }}
{{- end }}
{{- end }}
