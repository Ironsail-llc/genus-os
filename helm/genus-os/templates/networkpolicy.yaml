{{- if .Values.networkPolicy.enabled -}}
# Default deny + explicit allow rules. Cilium honors standard NetworkPolicy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "genus-os.fullname" . }}-default-deny
  labels:
    {{- include "genus-os.labels" (dict "root" . "component" "shared") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: genus-os
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress]
---
# Allow pod-to-pod traffic within the chart.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "genus-os.fullname" . }}-allow-intra-chart
  labels:
    {{- include "genus-os.labels" (dict "root" . "component" "shared") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: genus-os
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: genus-os
              app.kubernetes.io/instance: {{ .Release.Name }}
{{- if .Values.dashboard.enabled }}
---
# Allow Traefik to reach the dashboard on its service port only.
# Scoped to the dashboard component (was previously to all chart pods)
# and constrained to the dashboard's container port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "genus-os.fullname" . }}-allow-traefik-dashboard
  labels:
    {{- include "genus-os.labels" (dict "root" . "component" "shared") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "genus-os.selectorLabels" (dict "root" . "component" "dashboard") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.traefikNamespace | default "traefik" }}
      ports:
        - protocol: TCP
          port: {{ .Values.dashboard.service.port }}
{{- end }}
{{- range $component := list "engine" "bridge" "orchestrator" }}
{{- $cv := index $.Values $component }}
{{- if and $cv.enabled $cv.ingress.enabled }}
---
# Allow Traefik to reach {{ $component }} on its service port (ingress enabled).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "genus-os.fullname" $ }}-allow-traefik-{{ $component }}
  labels:
    {{- include "genus-os.labels" (dict "root" $ "component" "shared") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "genus-os.selectorLabels" (dict "root" $ "component" $component) | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $.Values.networkPolicy.traefikNamespace | default "traefik" }}
      ports:
        - protocol: TCP
          port: {{ $cv.service.port }}
{{- end }}
{{- end }}
{{- end }}
