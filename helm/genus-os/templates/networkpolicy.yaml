    {{- include "genus-os.labels" (dict "root" . "component" "database") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- range $component := list "engine" "bridge" "orchestrator" "migrations" }}
        {{- if (index $root.Values $component).enabled }}
        - podSelector:
            matchLabels:
              {{- include "genus-os.selectorLabels" (dict "root" $root "component" $component) | nindent 14 }}
        {{- end }}
        {{- end }}
      ports: [{protocol: TCP, port: {{ .Values.database.port }}}]
{{- end }}

