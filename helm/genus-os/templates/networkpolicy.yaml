{{- $hardenedEnvironment := has .Values.global.environment (list "production" "prod" "staging") -}}
{{- if and $hardenedEnvironment (not .Values.networkPolicy.enabled) -}}
{{- fail "networkPolicy.enabled must be true in staging/production" -}}
{{- end -}}
{{- if and $hardenedEnvironment (not .Values.networkPolicy.egress.enabled) -}}
{{- fail "networkPolicy.egress.enabled must be true in staging/production" -}}
{{- end -}}
{{- if .Values.networkPolicy.enabled -}}
{{- $root := . -}}
# Default deny for every pod owned by this release, including enabled database
# subcharts. Connectivity is rebuilt below from the actual component graph.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "genus-os.fullname" . }}-default-deny
  labels:
    {{- include "genus-os.labels" (dict "root" . "component" "shared") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: genus-os
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
    {{- if .Values.networkPolicy.egress.enabled }}
    - Egress
    {{- end }}
{{- if and .Values.networkPolicy.egress.enabled .Values.networkPolicy.egress.allowDNS }}
---
# DNS is the only release-wide egress exception and is limited to the
# configured DNS pods, not every pod in kube-system.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "genus-os.fullname" . }}-allow-dns
  labels:
    {{- include "genus-os.labels" (dict "root" . "component" "shared") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "genus-os.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.egress.dnsNamespace | default "kube-system" }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.egress.dnsPodSelector | nindent 14 }}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
{{- end }}

{{- /* Dashboard may call only its three internal backends. */}}
{{- if and .Values.networkPolicy.egress.enabled .Values.dashboard.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "genus-os.fullname" . }}-dashboard-internal-egress
  labels:
    {{- include "genus-os.labels" (dict "root" . "component" "dashboard") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "genus-os.selectorLabels" (dict "root" . "component" "dashboard") | nindent 6 }}
  policyTypes: [Egress]
  egress:
    {{- range $component := list "engine" "bridge" "orchestrator" }}
    {{- $cv := index $root.Values $component }}
    {{- if $cv.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "genus-os.selectorLabels" (dict "root" $root "component" $component) | nindent 14 }}
      ports:
        - {protocol: TCP, port: {{ $cv.service.port }}}
    {{- end }}
    {{- end }}
{{- end }}

{{- /* Engine calls Bridge, Orchestrator, in-chart data services, and NATS. */}}
{{- if and .Values.networkPolicy.egress.enabled .Values.engine.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "genus-os.fullname" . }}-engine-internal-egress
  labels:
    {{- include "genus-os.labels" (dict "root" . "component" "engine") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "genus-os.selectorLabels" (dict "root" . "component" "engine") | nindent 6 }}
  policyTypes: [Egress]
  egress:
    {{- range $component := list "bridge" "orchestrator" }}
    {{- $cv := index $root.Values $component }}
    {{- if $cv.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "genus-os.selectorLabels" (dict "root" $root "component" $component) | nindent 14 }}
      ports:
        - {protocol: TCP, port: {{ $cv.service.port }}}
    {{- end }}
    {{- end }}
    {{- if .Values.postgres.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports: [{protocol: TCP, port: {{ .Values.database.port }}}]
    {{- end }}
    {{- if .Values.redis.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports: [{protocol: TCP, port: {{ .Values.redis.port }}}]
    {{- end }}
    {{- if .Values.nats.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "genus-os.selectorLabels" (dict "root" . "component" "nats") | nindent 14 }}
      ports: [{protocol: TCP, port: {{ .Values.nats.clientPort }}}]
    {{- end }}
{{- end }}

{{- /* Bridge calls Orchestrator and the in-chart data services only. */}}
{{- if and .Values.networkPolicy.egress.enabled .Values.bridge.enabled }}
