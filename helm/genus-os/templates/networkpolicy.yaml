metadata:
  name: {{ include "genus-os.fullname" . }}-helm-test-egress
  labels:
    {{- include "genus-os.labels" (dict "root" . "component" "helm-test") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "genus-os.selectorLabels" (dict "root" . "component" "helm-test") | nindent 6 }}
  policyTypes: [Egress]
  egress:
    {{- range $component := list "engine" "bridge" "orchestrator" "dashboard" }}
    {{- $cv := index $root.Values $component }}
    {{- if $cv.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "genus-os.selectorLabels" (dict "root" $root "component" $component) | nindent 14 }}
      ports: [{protocol: TCP, port: {{ $cv.service.port }}}]
