{{- /* Backend ingress mirrors the callers above and the Helm smoke pod. */}}
{{- range $component := list "engine" "bridge" "orchestrator" "dashboard" }}
{{- $cv := index $root.Values $component }}
{{- if $cv.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "genus-os.fullname" $root }}-{{ $component }}-internal-ingress
  labels:
    {{- include "genus-os.labels" (dict "root" $root "component" $component) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "genus-os.selectorLabels" (dict "root" $root "component" $component) | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "genus-os.selectorLabels" (dict "root" $root "component" "helm-test") | nindent 14 }}
        {{- if eq $component "engine" }}
        {{- if $root.Values.dashboard.enabled }}
        - podSelector:
            matchLabels:
              {{- include "genus-os.selectorLabels" (dict "root" $root "component" "dashboard") | nindent 14 }}
        {{- end }}
        {{- else if eq $component "bridge" }}
        {{- range $source := list "dashboard" "engine" }}
        {{- if (index $root.Values $source).enabled }}
        - podSelector:
            matchLabels:
              {{- include "genus-os.selectorLabels" (dict "root" $root "component" $source) | nindent 14 }}
        {{- end }}
        {{- end }}
        {{- else if eq $component "orchestrator" }}
        {{- range $source := list "dashboard" "engine" "bridge" }}
        {{- if (index $root.Values $source).enabled }}
        - podSelector:
            matchLabels:
              {{- include "genus-os.selectorLabels" (dict "root" $root "component" $source) | nindent 14 }}
        {{- end }}
        {{- end }}
        {{- end }}
      ports:
        - {protocol: TCP, port: {{ $cv.service.port }}}
{{- end }}
{{- end }}

{{- if .Values.postgres.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "genus-os.fullname" . }}-postgres-ingress
