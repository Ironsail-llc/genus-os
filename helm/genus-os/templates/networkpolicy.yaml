spec:
  podSelector:
    matchLabels:
      {{- include "genus-os.selectorLabels" (dict "root" . "component" "bridge") | nindent 6 }}
  policyTypes: [Egress]
  egress:
    {{- if .Values.orchestrator.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "genus-os.selectorLabels" (dict "root" . "component" "orchestrator") | nindent 14 }}
      ports: [{protocol: TCP, port: {{ .Values.orchestrator.service.port }}}]
    {{- end }}
    {{- if .Values.postgres.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports: [{protocol: TCP, port: {{ .Values.database.port }}}]
    {{- end }}
    {{- if .Values.redis.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports: [{protocol: TCP, port: {{ .Values.redis.port }}}]
    {{- end }}
{{- end }}

{{- if and .Values.networkPolicy.egress.enabled .Values.orchestrator.enabled (or .Values.postgres.enabled .Values.redis.enabled) }}
---
