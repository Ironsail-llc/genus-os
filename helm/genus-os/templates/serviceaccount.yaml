{{- if .Values.serviceAccount.create -}}
{{- $root := . -}}
{{- $components := list "engine" "bridge" "orchestrator" "dashboard" "migrations" "nats" "helm-test" -}}
{{- $rendered := 0 -}}
{{- range $component := $components -}}
{{- $enabled := true -}}
{{- if ne $component "helm-test" -}}
{{- $enabled = (index $root.Values $component).enabled -}}
{{- end -}}
{{- if $enabled -}}
{{- if gt $rendered 0 }}
---
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "genus-os.serviceAccountName" (dict "root" $root "component" $component) }}
  labels:
    {{- include "genus-os.labels" (dict "root" $root "component" $component) | nindent 4 }}
  {{- with $root.Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Tokens are disabled at the identity boundary. Python pods explicitly project
# a short-lived token into only their migration-watcher init container.
automountServiceAccountToken: false
{{- $rendered = add1 $rendered -}}
{{- end -}}
{{- end -}}
{{- end -}}
