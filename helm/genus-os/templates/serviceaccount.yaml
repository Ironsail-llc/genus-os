{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "genus-os.serviceAccountName" . }}
  labels:
    {{- include "genus-os.labels" (dict "root" . "component" "shared") | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Default-deny token mount at SA level. Pods that need API access opt in via
# pod.spec.automountServiceAccountToken: true — currently only the migration
# Job (wait-for-credentials initContainer) and the python services (when
# migrations.enabled, for the wait-for-migrations initContainer). When
# migrations.enabled is false, no pod mounts the token.
automountServiceAccountToken: false
{{- end }}
