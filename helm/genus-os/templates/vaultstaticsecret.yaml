{{- if .Values.vault.enabled -}}
# Sourced by HashiCorp Vault Secrets Operator (VSO).
# VSO mirrors every key under `vault.path` into the destination K8s Secret
# 1:1 — store keys in Vault using the env-var names the containers expect
# (e.g. ROBOTHOR_DB_PASSWORD, ANTHROPIC_API_KEY). No per-key mapping needed.
#
# `rolloutRestartTargets` is VSO's solution to "pods don't roll on secret
# rotation" — VSO triggers a rollout on each listed Deployment when the
# underlying Vault data changes.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ include "genus-os.fullname" . }}-credentials
  labels:
    {{- include "genus-os.labels" (dict "root" . "component" "shared") | nindent 4 }}
spec:
  type: {{ .Values.vault.type | default "kv-v2" }}
  mount: {{ required "vault.mount is required (cluster KV mount, e.g. cluster-is)" .Values.vault.mount }}
  path: {{ required "vault.path is required (e.g. genus-os/staging)" .Values.vault.path }}
  refreshAfter: {{ .Values.vault.refreshAfter | default "1m" }}
  vaultAuthRef: {{ .Values.vault.authRef | default "vault-auth" }}
  destination:
    name: {{ include "genus-os.fullname" . }}-credentials
    create: true
  rolloutRestartTargets:
    {{- range $component := list "engine" "bridge" "orchestrator" }}
    {{- $cv := index $.Values $component }}
    {{- if $cv.enabled }}
    - kind: Deployment
      name: {{ include "genus-os.fullname" $ }}-{{ $component }}
    {{- end }}
    {{- end }}
    {{- if .Values.dashboard.enabled }}
    - kind: Deployment
      name: {{ include "genus-os.fullname" . }}-dashboard
    {{- end }}
{{- end }}
