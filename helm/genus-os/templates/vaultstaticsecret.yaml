{{- if .Values.vault.enabled -}}
{{- $root := . -}}
{{- $rendered := 0 -}}
{{- range $secretName, $secret := .Values.vault.secrets -}}
{{- $targets := list -}}
{{- range $component := list "engine" "bridge" "orchestrator" "dashboard" -}}
{{- $cv := index $root.Values $component -}}
{{- if and $cv.enabled (has $secretName ($cv.secretRefs | default list)) -}}
{{- $targets = append $targets $component -}}
{{- end -}}
{{- end -}}
{{- if gt $rendered 0 }}
---
{{- end }}
# Independently scoped Vault path. Workloads must explicitly name this class in
# their secretRefs; no chart-wide secret fan-out is permitted.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ include "genus-os.fullname" $root }}-{{ $secretName }}
  labels:
    {{- include "genus-os.labels" (dict "root" $root "component" "shared") | nindent 4 }}
spec:
  type: {{ $root.Values.vault.type | default "kv-v2" }}
  mount: {{ required "vault.mount is required (cluster KV mount, e.g. cluster-is)" $root.Values.vault.mount }}
  path: {{ required (printf "vault.secrets.%s.path is required" $secretName) $secret.path }}
  refreshAfter: {{ $root.Values.vault.refreshAfter | default "1m" }}
  vaultAuthRef: {{ $root.Values.vault.authRef | default "vault-auth" }}
  destination:
    name: {{ include "genus-os.fullname" $root }}-{{ $secretName }}
    create: true
  {{- if $targets }}
  rolloutRestartTargets:
    {{- range $component := $targets }}
    - kind: Deployment
      name: {{ include "genus-os.fullname" $root }}-{{ $component }}
    {{- end }}
  {{- end }}
{{- $rendered = add1 $rendered -}}
{{- end -}}
{{- end -}}
