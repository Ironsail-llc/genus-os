{{- if .Values.vault.enabled -}}
{{- $root := . -}}
{{- $rendered := 0 -}}
{{- range $secretName, $secret := .Values.vault.secrets -}}
{{- $targets := list -}}
{{- range $component := list "engine" "bridge" "orchestrator" "dashboard" -}}
{{- $cv := index $root.Values $component -}}
{{- if and $cv.enabled (has $secretName ($cv.secretRefs | default list)) -}}
{{- $targets = append $targets $component -}}
{{- end -}}
{{- end -}}
{{- /* Mounted as a file, not through secretRefs, so it is not covered above. */ -}}
{{- if and (eq $secretName "engine-google") $root.Values.engine.enabled ($root.Values.engine.googleWorkspace | default dict).enabled -}}
{{- $targets = append $targets "engine" -}}
{{- end -}}
{{- $vaultKeyClass := and (eq $secretName "vault-key") ($root.Values.vaultKey | default dict).enabled -}}
{{- if $vaultKeyClass -}}
{{- range $component := list "engine" "bridge" -}}
{{- if (index $root.Values $component).enabled -}}{{- $targets = append $targets $component -}}{{- end -}}
{{- end -}}
{{- end -}}
{{- /* Tenant cells read the engine's classes too; restart them with it. */ -}}
{{- if has "engine" $targets -}}
{{- range $t := $root.Values.tenants | default list -}}
{{- $targets = append $targets (printf "engine-%s" (toString $t.id)) -}}
{{- end -}}
{{- end -}}
{{- /* The dashboard reads one key of the cache class (genus-os.dashboardCacheEnv),
       not through secretRefs, so it is not covered above either. Its env is
       fixed at container start: without a restart a rotation leaves it on the
       old password. Same conditions as the helper that wires the key. */ -}}
{{- if and (eq $secretName "cache") $root.Values.dashboard.enabled (eq (include "genus-os.cacheEnabled" $root) "true") ((($root.Values.valkey | default dict).auth | default dict).enabled) (not (has "dashboard" $targets)) -}}
{{- $targets = append $targets "dashboard" -}}
{{- end -}}
{{- if gt $rendered 0 }}
---
{{- end }}
# Independently scoped Vault path. Workloads must explicitly name this class in
# their secretRefs; no chart-wide secret fan-out is permitted.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ include "genus-os.fullname" $root }}-{{ $secretName }}
  labels:
    {{- include "genus-os.labels" (dict "root" $root "component" "shared") | nindent 4 }}
spec:
  type: {{ $root.Values.vault.type | default "kv-v2" }}
  mount: {{ required "vault.mount is required (cluster KV mount, e.g. cluster-is)" $root.Values.vault.mount }}
  path: {{ required (printf "vault.secrets.%s.path is required" $secretName) $secret.path }}
  refreshAfter: {{ $root.Values.vault.refreshAfter | default "1m" }}
  vaultAuthRef: {{ $root.Values.vault.authRef | default "vault-auth" }}
  destination:
    name: {{ include "genus-os.fullname" $root }}-{{ $secretName }}
    create: true
    {{- if $vaultKeyClass }}
    # Vault KV holds strings, so the key and salt are stored base64-encoded;
    # the files must hold the raw 32 bytes the code reads.
    transformation:
      excludeRaw: true
      templates:
        {{- range $field := list "key" "fingerprint-salt" }}
        {{ $field }}:
          text: {{ printf "{{- get .Secrets %q | b64dec -}}" $field | squote }}
        {{- end }}
    {{- end }}
  {{- if $targets }}
  rolloutRestartTargets:
    {{- range $component := $targets }}
    - kind: Deployment
      name: {{ include "genus-os.fullname" $root }}-{{ $component }}
    {{- end }}
  {{- end }}
{{- $rendered = add1 $rendered -}}
{{- end -}}
{{- end -}}
