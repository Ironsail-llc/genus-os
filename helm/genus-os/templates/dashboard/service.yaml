{{- if .Values.dashboard.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "genus-os.fullname" . }}-dashboard
  labels:
    {{- include "genus-os.labels" (dict "root" . "component" "dashboard") | nindent 4 }}
  {{- with .Values.dashboard.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.dashboard.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "genus-os.selectorLabels" (dict "root" . "component" "dashboard") | nindent 4 }}
{{- end }}
