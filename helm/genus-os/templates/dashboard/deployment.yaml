{{- if .Values.dashboard.enabled -}}
{{- $cv := .Values.dashboard -}}
{{- $fullName := printf "%s-dashboard" (include "genus-os.fullname" .) | trunc 63 | trimSuffix "-" -}}
{{- $serviceEnv := dict
      "BRIDGE_URL" (printf "http://%s-bridge:%v" (include "genus-os.fullname" .) .Values.bridge.service.port)
      "ORCHESTRATOR_URL" (printf "http://%s-orchestrator:%v" (include "genus-os.fullname" .) .Values.orchestrator.service.port)
      "ROBOTHOR_ENGINE_URL" (printf "http://%s-engine:%v" (include "genus-os.fullname" .) .Values.engine.service.port)
      "NEXT_PUBLIC_BRIDGE_URL" "/api/bridge"
      "GENUS_ENVIRONMENT" .Values.global.environment
      "GENUS_AUTH_ENFORCE" (toString .Values.global.authEnforce)
    -}}
{{- $dashboardEnv := mergeOverwrite $serviceEnv ($cv.env | default dict) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "genus-os.labels" (dict "root" . "component" "dashboard") | nindent 4 }}
spec:
  {{- if not $cv.autoscaling.enabled }}
  replicas: {{ $cv.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "genus-os.selectorLabels" (dict "root" . "component" "dashboard") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "genus-os.labels" (dict "root" . "component" "dashboard") | nindent 8 }}
        {{- with .Values.global.podLabels }}{{- toYaml . | nindent 8 }}{{- end }}
      annotations:
        checksum/config: {{ .Values.global.imageTag | sha256sum }}
        {{- with .Values.global.podAnnotations }}{{- toYaml . | nindent 8 }}{{- end }}
    spec:
      serviceAccountName: {{ include "genus-os.serviceAccountName" (dict "root" . "component" "dashboard") }}
      automountServiceAccountToken: false
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.global.podSecurityContext | nindent 8 }}
      {{- $ns := include "genus-os.nodeSelector" (dict "root" . "component" "dashboard") }}
      {{- if $ns | trim }}
      nodeSelector:
        {{- $ns | nindent 8 }}
      {{- end }}
      {{- $tols := include "genus-os.tolerations" (dict "root" . "component" "dashboard") }}
      {{- if $tols | trim }}
      tolerations:
        {{- $tols | nindent 8 }}
      {{- end }}
      {{- $aff := include "genus-os.affinity" (dict "root" . "component" "dashboard") }}
      {{- if $aff | trim }}
      affinity:
        {{- $aff | nindent 8 }}
      {{- end }}
      containers:
        - name: dashboard
          image: {{ include "genus-os.image" (dict "root" . "component" "dashboard") }}
          imagePullPolicy: {{ include "genus-os.imagePullPolicy" (dict "root" . "component" "dashboard") }}
          securityContext:
            {{- toYaml .Values.global.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ $cv.service.port }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ $cv.service.port | quote }}
            - name: HOSTNAME
              value: "0.0.0.0"
            {{- range $k, $v := $dashboardEnv }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          envFrom:
            {{- include "genus-os.envFromSecret" (dict "root" . "component" "dashboard") | nindent 12 }}
          {{- $liveness := include "genus-os.httpProbe" (dict "root" . "component" "dashboard" "probe" "liveness" "port" "http") }}
          {{- if $liveness | trim }}
          livenessProbe:
            {{- $liveness | nindent 12 }}
          {{- end }}
          {{- $readiness := include "genus-os.httpProbe" (dict "root" . "component" "dashboard" "probe" "readiness" "port" "http") }}
          {{- if $readiness | trim }}
          readinessProbe:
            {{- $readiness | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/.next/cache
          resources:
            {{- toYaml $cv.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: next-cache
          emptyDir: {}
{{- end }}
