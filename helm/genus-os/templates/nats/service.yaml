{{- if .Values.nats.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "genus-os.fullname" . }}-nats
  labels:
    {{- include "genus-os.labels" (dict "root" . "component" "nats") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: client
      port: {{ .Values.nats.clientPort }}
      targetPort: client
    - name: leaf
      port: {{ .Values.nats.leafPort }}
      targetPort: leaf
    - name: monitor
      port: {{ .Values.nats.monitorPort }}
      targetPort: monitor
  selector:
    {{- include "genus-os.selectorLabels" (dict "root" . "component" "nats") | nindent 4 }}
{{- end }}
