{{- /*
The engine as the BRIDGE reaches it. Same pod and port as the engine's own
Service, but it keeps the pod in its endpoints while /ready answers 503.

The engine reports not-ready as soon as one manifest fails to load, and the
bridge's agent builder is how an operator sees and repairs that manifest.
Behind the readiness-gated Service the builder went dark in exactly the state
it exists for, so the bridge's control calls use this one. Traffic that should
follow readiness keeps using the engine's own Service.
*/ -}}
{{- if .Values.engine.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "genus-os.fullname" . }}-engine-control
  labels:
    {{- include "genus-os.labels" (dict "root" . "component" "engine") | nindent 4 }}
spec:
  type: ClusterIP
  publishNotReadyAddresses: true
  ports:
    - name: http
      port: {{ .Values.engine.service.port }}
      targetPort: http
      protocol: TCP
  {{- /* Narrowed to the root tenant's pod once tenant cells exist, exactly as
         the root engine's own Service is: every cell's pod is component=engine
         too, and the bridge's root control calls must not reach a child. */}}
  {{- $selectTenant := "" }}
  {{- if gt (len (.Values.tenants | default list)) 0 }}
  {{- $selectTenant = include "genus-os.rootTenant" . }}
  {{- end }}
  selector:
    {{- include "genus-os.selectorLabels" (dict "root" . "component" "engine" "tenant" $selectTenant) | nindent 4 }}
{{- end }}
