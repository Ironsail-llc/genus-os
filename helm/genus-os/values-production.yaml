# Layer 2 — production environment.
# `global.imageTag` is bumped by semantic-release via @semantic-release/exec →
# scripts/update-helm-values.sh on each release on main.

global:
  # Union: main ships the release tag; this branch ships the hardening flags.
  # Dropping either side is a silent regression — the tag rolls production
  # backwards, the flags disable auth. Keep both.
  imageTag: "v1.47.0"
  environment: production
  authEnforce: true
# Cloud env — never run the in-cluster subcharts. Fail-closed defaults.
postgres:
  enabled: false
redis:
  enabled: false
database:
  sslMode: verify-full
workspace:
  allowEmptyFleet: false
  minAgentCount: 1
  requiredAgentIds: [main]
  persistence:
    enabled: true
    size: 20Gi
# Vault Secrets Operator wiring. Every secret class has its own path and is
# projected only into its declared component. Layer 3 may change paths, but
# must preserve the separation documented in the chart README.
vault:
  enabled: true
  mount: cluster-is
  type: kv-v2
  refreshAfter: 1m
  authRef: vault-auth
  secrets:
    database:
      path: ironsail-production/genus-os/database
    cache:
      path: ironsail-production/genus-os/cache
    auth-signing:
      path: ironsail-production/genus-os/auth-signing
    bridge-sso:
      path: ironsail-production/genus-os/bridge-sso
    bridge-oidc:
      path: ironsail-production/genus-os/bridge-oidc
    dashboard-auth:
      path: ironsail-production/genus-os/dashboard-auth
    engine-providers:
      path: ironsail-production/genus-os/engine-providers
    bridge-integrations:
      path: ironsail-production/genus-os/bridge-integrations
    orchestrator-providers:
      path: ironsail-production/genus-os/orchestrator-providers
dashboard:
  enabled: true
  replicaCount: 2
  ingress:
    enabled: true
    className: traefik-private
    host: genus-os.internal.ironsail.ai
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
    tls:
      - secretName: genus-os-production-tls
        hosts:
          - genus-os.internal.ironsail.ai
engine:
  enabled: true
  replicaCount: 1
bridge:
  enabled: true
  replicaCount: 3
orchestrator:
  enabled: true
  replicaCount: 3
networkPolicy:
  enabled: true
  egress:
    enabled: true
    # Fail closed until the production Layer-3 values declare exact managed
    # database/cache and approved API or egress-proxy CIDRs.
