# Layer 2 — production environment.
# `global.imageTag` is bumped by semantic-release via @semantic-release/exec →
# scripts/update-helm-values.sh on each release on main.

global:
  # Union: main ships the release tag; this branch ships the hardening flags.
  # Dropping either side is a silent regression — the tag rolls production
  # backwards, the flags disable auth. Keep both.
  imageTag: "v1.116.1"
  environment: production
  authEnforce: true
# Cloud env — never run the in-cluster subcharts. Fail-closed defaults.
postgres:
  enabled: false
# Cache: in-cluster Valkey from the chart's own subchart, one per deployment.
# Deliberately not a managed cache service: the pinned chart has no Sentinel,
# so a single managed node would buy failover the chart cannot yet express
# anyway, and a dedicated instance keeps the ACL grant and the memory budget
# scoped to this release. Host is derived as {release}-valkey; the ACL password
# is the same ROBOTHOR_REDIS_PASSWORD the clients read.
valkey:
  enabled: true
database:
  sslMode: verify-full
  tls:
    # verify-full needs the CA that signs the managed database's certificate.
    # The deployment supplies this ConfigMap in the release namespace; the
    # chart refuses to render verify-full here without it.
    caConfigMap: genus-os-db-ca
workspace:
  allowEmptyFleet: false
  minAgentCount: 1
  requiredAgentIds: [main]
  persistence:
    enabled: true
    size: 20Gi
# Vault Secrets Operator wiring. Every secret class has its own path and is
# projected only into its declared component. Layer 3 may change paths, but
# must preserve the separation documented in the chart README.
vault:
  enabled: true
  mount: cluster-is
  type: kv-v2
  refreshAfter: 1m
  authRef: vault-auth
  secrets:
    database:
      path: ironsail-production/genus-os/database
    cache:
      path: ironsail-production/genus-os/cache
    auth-signing:
      path: ironsail-production/genus-os/auth-signing
    bridge-sso:
      path: ironsail-production/genus-os/bridge-sso
    bridge-oidc:
      path: ironsail-production/genus-os/bridge-oidc
    dashboard-auth:
      path: ironsail-production/genus-os/dashboard-auth
    engine-providers:
      path: ironsail-production/genus-os/engine-providers
    bridge-integrations:
      path: ironsail-production/genus-os/bridge-integrations
    orchestrator-providers:
      path: ironsail-production/genus-os/orchestrator-providers
    # Mounted as a file by engine.googleWorkspace, never through secretRefs.
    engine-google:
      path: ironsail-production/genus-os/engine-google
dashboard:
  enabled: true
  replicaCount: 2
  ingress:
    enabled: true
    className: traefik-private
    host: genus-os.internal.ironsail.ai
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
    tls:
      - secretName: genus-os-production-tls
        hosts:
          - genus-os.internal.ironsail.ai
engine:
  enabled: true
  replicaCount: 1
  # The assistant's mailbox for the gws_* tools. The mount is optional, so the
  # engine starts even before the engine-google path is written.
  googleWorkspace:
    enabled: true
bridge:
  enabled: true
  replicaCount: 3
orchestrator:
  enabled: true
  replicaCount: 3
networkPolicy:
  enabled: true
  egress:
    enabled: true
    # Fail closed until the production Layer-3 values declare exact managed
    # database/cache and approved API or egress-proxy CIDRs.
