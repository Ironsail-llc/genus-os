# Email Classifier — template setup
agent_id: email-classifier
version: "2026-03-09"
instruction_file_path: brain/EMAIL_CLASSIFIER.md

variables:
  model_primary:
    type: string
    default: "ollama/qwen3.5:122b"
    description: Primary LLM model (local Qwen 3.5 122B)
  model_fallbacks:
    type: list
    default:
      - "openrouter/anthropic/claude-sonnet-4.6"
      - "openrouter/moonshotai/kimi-k2.5"
      - "gemini/gemini-2.5-pro"
    description: Fallback model chain (cloud if local fails)
  timezone:
    type: string
    default: "UTC"
    description: Schedule timezone
  cron_expr:
    type: string
    default: "0 6-22/2 * * *"
    description: Cron schedule (every 2h, 6 AM-10 PM)
    prompt: "Cron schedule for email classification"
  reports_to:
    type: string
    default: "main"
    description: Agent to report to
  escalates_to:
    type: string
    default: "main"
    description: Agent to escalate to
  delivery_mode:
    type: string
    default: "none"
    description: Delivery mode (none for workers)