# Email Responder — template setup
agent_id: email-responder
version: "2026-03-09"
instruction_file_path: brain/RESPONDER.md

variables:
  model_primary:
    type: string
    default: "openrouter/xiaomi/mimo-v2-pro"
    description: Primary LLM model
  model_fallbacks:
    type: list
    default:
      - "openrouter/anthropic/claude-sonnet-4-6"
      - "gemini/gemini-2.5-pro"
    description: Fallback model chain
  timezone:
    type: string
    default: "UTC"
    description: Schedule timezone
  cron_expr:
    type: string
    default: "15 8-20/2 * * *"
    description: "Cron schedule (every 2h, 8:15 AM-8:15 PM)"
    prompt: "Cron schedule for email responses"
  reports_to:
    type: string
    default: "main"
    description: Agent to report to
  escalates_to:
    type: string
    default: "main"
    description: Agent to escalate to
  delivery_mode:
    type: string
    default: "none"
    description: Delivery mode (none for workers)
