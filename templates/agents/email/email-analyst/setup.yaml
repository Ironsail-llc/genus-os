# Email Analyst — template setup
agent_id: email-analyst
version: "2026-03-09"
instruction_file_path: brain/EMAIL_ANALYST.md

variables:
  model_primary:
    type: string
    default: "ollama_chat/qwen3.5:122b"
    description: Primary LLM model (local Qwen 3.5 122B)
  model_fallbacks:
    type: list
    default:
      - "openrouter/anthropic/claude-sonnet-4-6"
      - "gemini/gemini-2.5-pro"
    description: Fallback model chain
  timezone:
    type: string
    default: "UTC"
    description: Schedule timezone
  cron_expr:
    type: string
    default: "30 8-20/6 * * *"
    description: "Cron schedule (every 6h, 8:30 AM-8:30 PM)"
    prompt: "Cron schedule for email analysis"
  reports_to:
    type: string
    default: "main"
    description: Agent to report to
  escalates_to:
    type: string
    default: "main"
    description: Agent to escalate to
  delivery_mode:
    type: string
    default: "none"
    description: Delivery mode (none for workers)
