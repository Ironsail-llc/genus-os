# Morning Briefing — template setup
agent_id: morning-briefing
version: "2026-03-09"
instruction_file_path: brain/agents/morning-briefing.md

variables:
  model_primary:
    type: string
    default: "ollama/qwen3.5:122b"
    description: Primary LLM model (local Qwen 3.5 122B)
  model_fallbacks:
    type: list
    default:
      - "openrouter/anthropic/claude-sonnet-4.6"
      - "openrouter/moonshotai/kimi-k2.5"
      - "gemini/gemini-2.5-pro"
    description: Fallback model chain (cloud if local fails)
  timezone:
    type: string
    default: "UTC"
    description: Schedule timezone
  cron_expr:
    type: string
    default: "30 6 * * *"
    description: Cron schedule (6:30 AM daily)
    prompt: "What time should the morning briefing run?"
  delivery_mode:
    type: string
    default: "announce"
    description: Delivery mode (announce for briefings)
  delivery_channel:
    type: string
    default: "telegram"
    description: Delivery channel