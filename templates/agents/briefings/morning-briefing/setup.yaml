# Morning Briefing — template setup
agent_id: morning-briefing
version: "2026-03-09"
instruction_file_path: brain/agents/morning-briefing.md

variables:
  timezone:
    type: string
    default: "UTC"
    description: Schedule timezone
  cron_expr:
    type: string
    default: "30 6 * * *"
    description: Cron schedule (6:30 AM daily)
    prompt: "What time should the morning briefing run?"
  delivery_mode:
    type: string
    default: "announce"
    description: Delivery mode (announce for briefings)
  delivery_channel:
    type: string
    default: "telegram"
    description: Delivery channel