id: crm-steward
name: CRM Steward
description: CRM data hygiene, duplicate merge, and contact enrichment
version: "{{ version }}"
department: crm

reports_to: {{ reports_to }}
creates_tasks_for: []
receives_tasks_from: []
escalates_to: {{ escalates_to }}

schedule:
  cron: "{{ cron_expr }}"
  timezone: {{ timezone }}
  timeout_seconds: 480
  max_iterations: 6
  session_target: isolated

delivery:
  mode: {{ delivery_mode }}

tools_allowed:
  - exec
  - read_file
  - write_file
  - search_memory
  - get_entity
  - list_people
  - update_person
  - update_company
  - merge_contacts
  - merge_companies
  # The 0.2 hygiene scan calls delete_person on furniture, system accounts and
  # automated senders. It was in the instructions and not the manifest, so the
  # scan reported a count it had not deleted.
  - delete_person
  - create_note
  - create_task
  - list_tasks
  - list_my_tasks
  - update_task
  - resolve_task
  - get_inbox
  - ack_notification
  - append_to_block
tools_denied:
bridge_endpoints:
  - "GET /health"
  - "GET /api/people"
  - "PATCH /api/people/*"
  - "PATCH /api/companies/*"
  - "POST /api/people/merge"
  - "POST /api/companies/merge"
  - "POST /api/notes"
  - "POST /api/tasks"
  - "GET /api/tasks"
  - "PATCH /api/tasks/*"
  - "GET /api/tasks/agent/*"
  - "POST /api/tasks/*/resolve"
  - "GET /api/notifications/inbox/*"
  - "POST /api/notifications/*/ack"
  - "POST /api/memory/blocks/*/append"
streams:
  read: [crm]
  write: [crm]

sla:
  urgent: 30m
  high: 2h
  normal: 8h
  low: 24h

task_protocol: true
auto_task: true
review_workflow: true
notification_inbox: true
status_file: brain/memory/crm-steward-status.md
shared_working_state: true

warmup:
  memory_blocks:
    - contacts_summary
  context_files:
    - brain/memory/crm-steward-status.md

instruction_file: brain/CRM_STEWARD.md
bootstrap_files:
  - brain/AGENTS.md
  - brain/TOOLS.md

tags_produced: [crm-hygiene, dedup, enrichment]
tags_consumed: [crm-hygiene]

v2:
  error_feedback: true
  guardrails:
    - write_path_restrict
    # delete_person is granted below because the 0.2 hygiene scan calls it, and
    # the scan was reporting a count it had not deleted. But what it deletes is
    # chosen by the MODEL matching CRM rows against a prose blocklist, on an
    # unattended schedule, with no dry-run and no cap — so it goes through a
    # human. Both halves are needed: this policy, and the tool list below.
    # Verified enforced end to end, not assumed: with the policy enabled and
    # the pattern set, delete_person returns allowed=False action='escalate'
    # while list_people stays allowed.
    #
    # The ENGINE needs two environment variables, not one, and an earlier
    # version of this comment named only the second — so an operator who set
    # what it said got an ungated delete_person. Measured:
    #
    #   unset / unset                                 -> off
    #   ROBOTHOR_APPROVAL_MODE=enforce alone          -> off    <- the trap
    #   ROBOTHOR_APPROVAL_FAILCLOSED_ENABLED=1        -> observe
    #   both, with MODE=enforce                       -> enforce
    #
    # Only in 'enforce' does an unreachable approver fail CLOSED; in 'observe'
    # the verdict is logged and the call proceeds. Both are set in
    # infra/systemd/robothor-engine.service.d/upgrade-rip-flags.conf and in
    # helm/genus-os/values-*.yaml. `genus doctor --category agents` reports it
    # when they are not (agents.approval_gate_not_armed).
    - human_approval
  human_approval_tools:
    - delete_person
  write_path_allowlist:
    - "brain/memory/crm-steward-status.md"

changelog:
  - date: "2026-09-16"
    change: "Grant delete_person for the 0.2 hygiene scan, which called it without holding it, and gate it behind human_approval — the rows it removes are chosen by the model from a prose blocklist on an unattended run. Drop the Password Vault Tools section: it documented three tools this agent is not granted and should not have."

  - date: "2026-03-09"
    change: "Swap to GLM-5 — merge_contacts/update_person need reliable multi-param tool calls"
  - date: "2026-03-09"
    change: "Swap to local Qwen 3.5 122B for cost savings & privacy"
  - date: "2026-03-06"
    change: "Reduce timeout 600s→480s, reduce max_iterations 10→8 — 33% timeout rate (2/6 runs), 3x fleet avg duration. Nightwatch self-heal."
  - date: "2026-02-28"
    change: "CRITICAL FIX: Add exec, read_file, write_file, search_memory, get_entity — agent couldn't read/write files. Delivery→none."
  - date: "2026-02-24"
    change: "Initial manifest creation; payload model fixed from qwen3-14b to kimi"
  - date: "2026-02-23"
    change: "Timeout reduced 540→480s, enrichment budget 1 contact per run"
