# CRM Steward — template setup
agent_id: crm-steward
version: "2026-03-09"
instruction_file_path: brain/CRM_STEWARD.md

variables:
  model_primary:
    type: string
    default: "openrouter/xiaomi/mimo-v2-pro"
    description: Primary LLM model
  model_fallbacks:
    type: list
    default:
      - "openrouter/anthropic/claude-sonnet-4-6"
      - "gemini/gemini-2.5-pro"
    description: Fallback model chain
  timezone:
    type: string
    default: "UTC"
    description: Schedule timezone
  cron_expr:
    type: string
    default: "0 10 * * *"
    description: "Cron schedule (daily at 10:00 AM)"
    prompt: "Cron schedule for CRM maintenance"
  reports_to:
    type: string
    default: "main"
    description: Agent to report to
  escalates_to:
    type: string
    default: "main"
    description: Agent to escalate to
  delivery_mode:
    type: string
    default: "none"
    description: Delivery mode (none for workers)
