id: main
name: Main
description: Primary interactive agent — talks to the operator and delegates work to the fleet
version: "2026-08-18"
department: core

schedule:
  cron: ""
  timezone: {{ timezone }}
  timeout_seconds: 0
  max_iterations: 20
  session_target: persistent

delivery:
  mode: none

# Opt-in tools on top of the default set: main delegates coding tasks to
# Claude Code and sees each one through to a verified commit (skill:
# claude-code). Uses the host's Claude Code login, or a token from `robothor claude-code login`.
# Deliberate: the operator wants main to code. The mitigation is the job fence
# (docs/TOOLS.md, "Security model"): every job's shell is sandboxed (no
# credentials, no network by default, writes only to its worktree), Edit/Write
# are confined to the worktree, and no job starts until the operator sets
# ROBOTHOR_CODING_REPO_ROOTS.
tools_opt_in:
  - claude_code_start
  - claude_code_status
  - claude_code_wait
  - claude_code_followup
  - claude_code_cancel
  # Clone an allowlisted remote (ROBOTHOR_CODING_REMOTES) and, for the owner,
  # push a verified job to that remote and open a draft PR.
  - claude_code_repo_prepare
  - claude_code_publish
  - pr_review_intake
  - pr_review_status
  # Starts declared workflows when the operator asks; RBAC denies it to user/member.
  - run_workflow

# main is deferred (it has every default tool), so these everyday tools are
# always shown to the model rather than found through tool_search each time.
tools_eager:
  - org_overview
  - list_tasks
  - get_task
  - update_task
  - gws_gmail_search
  - gws_gmail_get

# Bridge routes main calls through its own token. Remote tools (org_tools,
# org_tool_read, org_tool_write) reach a child tenant's tools through these.
bridge_endpoints:
  - "GET /api/org/remote/*"
  - "POST /api/org/remote/call"

task_protocol: true
status_file: brain/memory/main-status.md

instruction_file: brain/agents/main.md
bootstrap_files:
  - brain/AGENTS.md
  - brain/TOOLS.md

warmup:
  context_files:
    - brain/memory/main-status.md

v2:
  can_spawn_agents: true
  error_feedback: true

# Organisation watch (a parent tenant with child tenants). Deliberately NOT
# enabled here: a heartbeat would start scheduled runs on every instance. To
# have main brief the owner when a company's state changes (instructions:
# "Organisation Watch"), add a heartbeat and the child grant to the instance
# manifest, and set crm_tenants.child_data_access for the parent tenant
# (docs/runbooks/TENANT_HIERARCHY.md, "The organisation watch"):
#
# heartbeat:
#   cron: "0 * * * *"          # hourly; the 08:00 beat adds the daily summary
#   delivery:
#     mode: announce
#     channel: telegram         # the owner's channel
# v2:
#   child_tenant_access: true   # merge into the v2 block above
