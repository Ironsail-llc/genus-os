id: concierge
name: Concierge
description: Self-configuring agent that detects usage patterns and proposes new agents
version: "2026-03-04"
department: core

reports_to: {{ reports_to }}
escalates_to: {{ escalates_to }}

schedule:
  cron: "0 20 * * *"
  timezone: {{ timezone }}
  timeout_seconds: 300
  max_iterations: 10
  session_target: isolated

delivery:
  mode: none

tools_allowed:
  - exec
  - read_file
  - write_file
  - search_memory
  - store_memory
  - memory_block_read
  - memory_block_write
  - memory_block_list
  - list_tasks
  - list_my_tasks
  - create_task
  - update_task
  - resolve_task
  - list_agent_runs
  - get_agent_stats
  - get_fleet_achievement_score
  - list_agent_reviews

task_protocol: true
status_file: brain/memory/concierge-status.md

warmup:
  memory_blocks: [concierge_observations, operational_findings]
  context_files:
    - brain/memory/concierge-status.md

v2:
  error_feedback: true
  cost_budget_usd: 0.50

changelog:
  - date: "2026-09-16"
    change: "Drop get_fleet_health and detect_anomalies from tools_allowed: neither is a registered tool. The instructions that called them now name the real ones, get_fleet_achievement_score and list_agent_reviews, which are granted in their place."
