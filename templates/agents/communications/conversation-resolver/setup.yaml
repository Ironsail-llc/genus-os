# Conversation Resolver — template setup
agent_id: conversation-resolver
version: "2026-03-09"
instruction_file_path: brain/CONVERSATION_RESOLVER.md

variables:
  model_primary:
    type: string
    default: "ollama_chat/qwen3.5:122b"
    description: Primary LLM model (local Qwen 3.5 122B)
  model_fallbacks:
    type: list
    default:
      - "openrouter/anthropic/claude-sonnet-4-6"
      - "gemini/gemini-2.5-pro"
    description: Fallback model chain
  timezone:
    type: string
    default: "UTC"
    description: Schedule timezone
  cron_expr:
    type: string
    default: "20 8,14,20 * * *"
    description: "Cron schedule (3x daily at 8:20 AM, 2:20 PM, 8:20 PM)"
    prompt: "Cron schedule for conversation resolution"
  reports_to:
    type: string
    default: "main"
    description: Agent to report to
  escalates_to:
    type: string
    default: "main"
    description: Agent to escalate to
  delivery_mode:
    type: string
    default: "none"
    description: Delivery mode (none for workers)
