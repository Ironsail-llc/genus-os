id: pr-reviewer
name: PR Reviewer
description: Reviews pull requests with Claude Code and posts the result on GitHub, in the Chat thread and (optionally) as a Telegram digest
version: "{{ version }}"
department: engineering

reports_to: {{ reports_to }}
creates_tasks_for: []
receives_tasks_from: []
escalates_to: {{ escalates_to }}

tags_produced: []
tags_consumed: [pr-review]

# No cron of its own, and no longer woken: the pr-review-run workflow
# (templates/workflows/) runs the queued reviews itself with pr_review_work,
# several at once and with no model. The agent stays installed because the
# review jobs start under its id — the engine hands GITHUB_TOKEN to a job only
# for an agent whose own manifest names it (`secrets:` below) — and the review
# tasks are assigned to it.
schedule:
  cron: ""
  timezone: {{ timezone }}
  timeout_seconds: 3300
  max_iterations: 40
  session_target: isolated

# `none` keeps the agent silent. The Telegram digest no longer goes through
# this delivery: pr_review_work sends finalize's digest lines itself when
# ROBOTHOR_PR_REVIEW_TELEGRAM_DIGEST=true. line_filter applies only to a run of
# this agent by hand: the digest lines get through, the model's narration not.
delivery:
  mode: {{ delivery_mode }}
  channel: telegram
  to: "${ROBOTHOR_TELEGRAM_CHAT_ID}"
  line_filter: '^\W*PR review '

# Exactly the tools its instructions call, and nothing else: its task queue,
# the deterministic pr_review_* halves, watching and (only if its run is
# ending) cancelling the review job, and its status file. pr_review_prepare
# STARTS the read-only Claude Code job itself and pr_review_finalize posts
# through the GitHub review handlers directly, so this agent can neither start
# an arbitrary coding job nor post, reply on or resolve a review:
# claude_code_start and the github_* review-write tools are deliberately
# absent. An explicit list, not `tools_opt_in` on the default set: that gave it
# over 200 tools, past the deferral threshold, so every call went through
# `tool_call`. Needs `robothor claude-code login` once per instance (or the
# host's Claude Code login), and GITHUB_TOKEN in the vault.
tools_allowed:
  - list_my_tasks
  - get_task
  - update_task
  - resolve_task
  - pr_review_prepare
  - pr_review_finalize
  - claude_code_wait
  - claude_code_status
  - claude_code_cancel
  - read_file
  - write_file

# grant_github on a review job hands Claude Code GH_TOKEN for read-only
# `gh pr view/diff/checks`; the engine gives it only to an agent that names it.
secrets:
  - GITHUB_TOKEN

task_protocol: true
auto_task: false
review_workflow: false
notification_inbox: false
status_file: brain/memory/pr-reviewer-status.md
shared_working_state: false

warmup:
  context_files:
    - brain/memory/pr-reviewer-status.md

instruction_file: brain/agents/PR_REVIEWER.md
bootstrap_files:
  - brain/AGENTS.md

v2:
  error_feedback: true
  guardrails:
    - no_destructive_writes
    - write_path_restrict
  write_path_allowlist:
    - "brain/memory/pr-reviewer-status.md"

changelog:
  - date: "2026-10-05"
    change: "Initial template: Claude Code review jobs, verdict recomputed in code, live GitHub posting, Chat thread announcements, optional Telegram digest."
