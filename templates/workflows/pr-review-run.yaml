# pr-reviewer run — template.
#
# Install beside pr-review-intake.yaml (copy to docs/workflows/, exclude
# locally). See docs/PR_REVIEWER.md.
#
# Runs the queued reviews only when a review task is waiting. The first step
# is the intake tool with count_only: true — it reads the queue and changes
# nothing. Only the pr-review-intake workflow dispatches (under a per-tenant
# lock), so the two crons can never file the same review twice.
#
# The review step is a tool, not an agent: pr_review_work runs up to
# ROBOTHOR_PR_REVIEW_WORKERS reviews at once (3 by default) with no model —
# prepare, the Claude Code job, finalize, resolve. It re-reads the queue every
# 30 s while a review is in flight, takes no new task after 45 minutes and
# returns inside its 3300 s step; the next tick carries on. One run per tenant
# at a time: a tick that lands during a run returns skipped: running.

id: pr-review-run
name: PR Review Run
description: Run the queued pull-request reviews, several at once, when a pr-review task is waiting
version: "2026-10-13"

triggers:
  - type: cron
    cron: "*/2 * * * *"
    timezone: UTC
  - type: manual

timeout_seconds: 3600

steps:
  - id: queue
    type: tool
    tool_name: pr_review_intake
    tool_args:
      count_only: true
    tool_timeout_seconds: 120
    on_failure: abort

  - id: any-queued
    type: condition
    input: "{{ steps['queue']['tool_output']['queued_tasks'] }}"
    branches:
      - when: "int(value) > 0"
        goto: review
      - otherwise: true
        goto: done

  - id: review
    type: tool
    tool_name: pr_review_work
    tool_timeout_seconds: 3300
    on_failure: abort

  - id: done
    type: noop
