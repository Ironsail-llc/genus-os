# What this distribution contributes. Read from the packaging layer BEFORE the
# module is imported, so an undeclared plugin never executes inside the daemon.
name: genus-hostinfo
contract_version: 1
handlers:
  - host_state
schemas:
  - host_state
services:
  - host_state

# What this distribution publishes into each group, by ENTRY-POINT name. An
# entry-point name is not a contribution name (this one publishes `hostinfo`
# and contributes `host_state`), so the two are declared separately -- and
# declaring this is what lets `genus plugin install` compare the wheel's actual
# surface to the declaration exactly, before anything is imported. Omitting it
# is allowed and caps the install verdict at `review`.
entry_points:
  genus.tools:
    - hostinfo
  genus.schemas:
    - hostinfo
  genus.services:
    - hostinfo
