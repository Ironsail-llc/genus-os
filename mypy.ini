[mypy]
python_version = 3.11
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
check_untyped_defs = True
disallow_any_generics = True
warn_unused_ignores = True
strict_equality = True
disallow_untyped_decorators = True
disallow_untyped_calls = True
disallow_incomplete_defs = True
warn_redundant_casts = True
no_implicit_reexport = True
extra_checks = True

[mypy-ultralytics.*]
ignore_missing_imports = True
follow_imports = skip

[mypy-robothor.vision.*]
disallow_any_generics = False

[mypy-robothor.tui.*]
warn_return_any = False

[mypy-robothor.*.tests.*]
ignore_errors = True

# ── Annotation coverage: the new sales package, itemised ──────────────
#
# `robothor/sales/` arrived whole in #624: 47 production modules that do not
# yet carry annotations. Every OTHER package in this tree does, and this file
# keeps it that way — so the new modules added to `robothor/engine/`,
# `robothor/operations/`, `robothor/templates/`, `robothor/db/` and
# `robothor/plugins/` by that same branch were annotated instead of listed
# here, and so was the public surface of `robothor.sales` that the engine
# calls across (`Sales`, `DeploymentCoordinator`, `QueueDriver.tick`,
# `operator`, `Reports`, `Requests`, `delegate_research`), because a call FROM
# a strictly checked module is checked in the caller.
#
# What is relaxed here is ONLY annotation COVERAGE. Every check that finds a
# bug stays on for these modules: `check_untyped_defs` is true globally, so
# their bodies are still analysed, and `arg-type`, `index`, `union-attr`,
# `assignment`, `attr-defined`, `type-arg`, `no-any-return` and the rest all
# still report. There were 74 of those when this list was written and they
# were fixed, not listed; the package is at zero.
#
# It is NOT `ignore_errors`, and it is NOT `robothor.sales.*`. Both would hide
# the next real error. This is an explicit list of the modules that exist
# today: a NEW module in this package does not match it and meets the full
# bar, which is the direction this should move. Delete an entry when its
# module is annotated. `robothor/tests/test_mypy_annotation_backlog.py` fails
# if an entry names a module that no longer needs it, so the list can only
# shrink.

[mypy-robothor.sales.api]
disallow_untyped_defs = False
disallow_incomplete_defs = False
disallow_untyped_calls = False
disallow_untyped_decorators = False

