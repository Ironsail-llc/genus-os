# Genus OS documentation site — built by .github/workflows/docs.yml and
# published to GitHub Pages. Local build: pip install -r requirements-docs.txt
# && mkdocs build --strict.
#
# The site publishes an explicit allowlist of pages (exclude_docs below).
# docs/ also holds internal material — runbooks, benchmarks, plans, agent
# schemas — that is platform-tracked but not part of the public site. Add a
# page by extending the allowlist AND the nav, and sweep it for
# instance-specific data first (see docs/PLATFORM_INSTANCE.md).

site_name: Genus OS
site_description: The enterprise AI operating system you deploy on your own infrastructure.
site_url: https://ironsail-llc.github.io/genus-os/
repo_url: https://github.com/Ironsail-llc/genus-os
repo_name: Ironsail-llc/genus-os
edit_uri: ""

theme:
  name: material
  logo: images/genus-os-logo.png
  favicon: images/genus-os-logo.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

# Allowlist: everything under docs/ is excluded unless re-included here.
# This keeps internal material (runbooks, benchmarks, plans, agent schemas,
# workflow YAML) off the public site by default.
# !/install.sh is not a page: it is scripts/install.sh, copied in by the docs
# workflow so the documented one-liner
# (https://ironsail-llc.github.io/genus-os/install.sh) serves the script this
# repository actually tests. It is gitignored under docs/ — the copy is a build
# artifact, and a committed one would drift.
# !/assets/ re-includes the Material theme's own CSS/JS/search workers: they
# register as docs files, so the /* catch-all strips them and the deployed
# site renders unstyled without it. (docs/assets/ does not exist in the repo,
# so nothing from docs/ sneaks in through this entry.)
exclude_docs: |
  /*
  !/index.md
  !/quickstart.md
  !/install.sh
  !/configuration.md
  !/deployment.md
  !/release-notes.md
  !/enterprise/00-overview.md
  !/enterprise/01-install.md
  !/enterprise/02-identity.md
  !/enterprise/03-channels.md
  !/enterprise/04-agents.md
  !/enterprise/05-secrets.md
  !/enterprise/06-backup-upgrade.md
  !/enterprise/07-operate.md
  !/reference/cli.md
  !/reference/configuration.md
  !/features/goal-pursuit.md
  !/TOOLS.md
  !/AUTONOMOUS_EXECUTION.md
  !/SALES_INTELLIGENCE.md
  !/PLUGINS.md
  !/channels/telegram.md
  !/CONNECTORS.md
  !/OBSERVABILITY.md
  !/runbooks/SNAPSHOT_RESTORE.md
  !/compliance/SECURITY_CONTROLS.md
  !/compliance/SOC2_MAPPING.md
  !/compliance/HIPAA_MAPPING.md
  !/channels/slack.md
  !/channels/slack-app-manifest.json
  !/channels/teams.md
  !/channels/teams-app-manifest.json
  !/channels/email.md
  !/channels/access.md
  !/channels/webchat.md
  !/runbooks/BENCHMARK_SANDBOX.md
  !/runbooks/LOCAL_FALLBACK.md
  !/runbooks/INTERACTIVE_REQUEST_PERFORMANCE.md
  !/architecture.md
  !/memory-system.md
  !/event-bus.md
  !/PLATFORM_INSTANCE.md
  !/READING_GUIDE.md
  !/contributing.md
  !/security.md
  !/images
  !/assets/

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn

nav:
  - Home: index.md
  - Getting Started:
      - Quick Start: quickstart.md
      - Configuration: configuration.md
      - Deployment: deployment.md
  - Enterprise Guide:
      - Overview: enterprise/00-overview.md
      - 1. Install: enterprise/01-install.md
      - 2. Identity: enterprise/02-identity.md
      - 3. Channels: enterprise/03-channels.md
      - 4. Agents: enterprise/04-agents.md
      - 5. Secrets: enterprise/05-secrets.md
      - 6. Backup and upgrade: enterprise/06-backup-upgrade.md
      - 7. Operate: enterprise/07-operate.md
  - Reference:
      - CLI: reference/cli.md
      - Settings: reference/configuration.md
  - Operating:
      - Goals: features/goal-pursuit.md
      - Tools: TOOLS.md
      - Personal autonomy: AUTONOMOUS_EXECUTION.md
      - Sales intelligence: SALES_INTELLIGENCE.md
      - Plugins: PLUGINS.md
      - Telegram channel: channels/telegram.md
      - Connectors: CONNECTORS.md
      - Slack channel: channels/slack.md
      - Email channel: channels/email.md
      - Teams channel: channels/teams.md
      - Channel access: channels/access.md
      - Web chat channel: channels/webchat.md
      - Observability: OBSERVABILITY.md
      - Snapshot and restore: runbooks/SNAPSHOT_RESTORE.md
      - Benchmark sandbox: runbooks/BENCHMARK_SANDBOX.md
      - Local fallback: runbooks/LOCAL_FALLBACK.md
      - Interactive request performance: runbooks/INTERACTIVE_REQUEST_PERFORMANCE.md
  - Compliance:
      - Security controls: compliance/SECURITY_CONTROLS.md
      - SOC 2 mapping: compliance/SOC2_MAPPING.md
      - HIPAA mapping: compliance/HIPAA_MAPPING.md
  - Architecture:
      - Overview: architecture.md
      - Memory System: memory-system.md
      - Event Bus: event-bus.md
      - Platform vs Instance: PLATFORM_INSTANCE.md
  - Releases:
      - Release Notes: release-notes.md
  - Project:
      - Contributing: contributing.md
      - Security: security.md
      - Reading Guide: READING_GUIDE.md
