[pytest]
asyncio_mode = auto
timeout = 30
addopts = --import-mode=importlib
pythonpath = .
markers =
    slow: marks tests as slow (real LLM calls, >10s)
    integration: real DB/Redis cross-service tests
    unit: fast unit tests, no external dependencies
    llm: requires Ollama/Qwen running
    e2e: full system end-to-end tests
    smoke: infrastructure health checks
    vision: requires vision dependencies (ultralytics, insightface, onnxruntime)
# What a bare `pytest` collects. Two corrections, 2026-08-27:
#
#   + robothor/federation/tests -- 140 tests that were absent here, so a local
#     `pytest` silently skipped them. (CI always ran them: ci.yml:121 is
#     `pytest tests/ robothor/`, which reaches them by path.)
#
#   - crm/bridge/tests -- removed. crm/ and crm/bridge/ are not packages, so
#     under pytest's default import mode its conftest and tests/conftest.py both
#     resolve to the module name 'tests.conftest' and a bare `pytest` dies with
#     "Plugin already registered under a different name". It gets its own CI job
#     (ci.yml:138) and its own venv (crm/bridge/venv), so it never belonged in
#     the main collection -- and its presence here is what made a bare `pytest`
#     unusable, which is how the federation gap above went unnoticed.
testpaths =
    tests
    robothor/engine/tests
    robothor/federation/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
