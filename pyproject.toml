[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "genusos"
version = "1.36.2"
description = "Self-hosted AI agent operating system: deterministic engine, plugin-style skills and connectors, multi-tenant CRM and memory. Everything is a plugin."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Genus OS Contributors" },
]
keywords = ["ai", "brain", "memory", "knowledge-graph", "rag", "vision", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "psycopg2-binary~=2.9",
    "redis~=5.0",
    "httpx~=0.27",
    "pydantic~=2.0",
    # ONNX 1.22+ requires ml-dtypes, whose Python 3.13+ wheels require NumPy
    # 2.x. Keep the stable 1.26 ABI on 3.11/3.12 while allowing the supported
    # NumPy 2 line on 3.13+.
    "numpy>=1.26,<2; python_version < '3.13'",
    "numpy>=2.1,<3; python_version >= '3.13'",
    "requests~=2.31",
    "pyyaml~=6.0",
    # Floor pins past the LiteLLM SQL-injection advisory (GHSA-vh4m-vp44-3rgq,
    # fixed in 1.61.17). No upper cap below 2.0: litellm 1.84+ relaxed its
    # transitive aiohttp pin again, so the latest 1.x (1.87.0) resolves cleanly
    # with aiohttp>=3.13.4. The 1.84 floor also clears later 2026 advisories.
    "litellm>=1.84.0,<2.0",
    "aiohttp>=3.14.3",
    "aiogram~=3.10",
    "apscheduler~=3.10",
    "croniter~=6.0",
    "html2text~=2024.2",
    "cryptography>=50.0.0",
    "structlog~=24.0",
    "prometheus-client~=0.21",
]

[project.optional-dependencies]
api = [
    # This floor also excludes the malicious FastAPI 0.136.3 release and pulls
    # the patched Starlette 1.3 line.
    "fastapi>=0.139",
    "uvicorn[standard]>=0.32",
    # Auth: bridge-issued JWT sessions + password hashing (break-glass admin).
    # pyjwt/bcrypt already resolve transitively; declare them as first-class.
    "pyjwt>=2.13.0",
    "argon2-cffi>=23.1",
]
vision = [
    "ultralytics>=8.0",
    "insightface>=0.7",
    # InsightFace leaves ONNX unconstrained; require the first release that
    # clears the 2026 parser and validation advisories.
    "onnx>=1.22.0",
    "onnxruntime>=1.17",
    "opencv-python>=4.8",
]
federation = [
    "nats-py>=2.0",
]
mcp = [
    # Official MCP Python SDK, used by robothor/api/mcp.py (session negotiation
    # only — our own client/bridge in robothor/engine + robothor/connectors
    # implement JSON-RPC directly and don't depend on this package). Floor is
    # the version installed ad-hoc today; ceiling excludes the next major so a
    # breaking SDK release (e.g. for 2026-07-28 support) is a deliberate bump,
    # not a surprise upgrade.
    "mcp>=1.26,<2",
]
rlm = [
    "rlms>=0.1.1",
]
tui = [
    "textual>=1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
    "pytest-cov>=5.0",
    "ruff==0.15.2",
    "mypy>=1.13",
    "types-requests>=2.31",
    "types-PyYAML>=6.0",
]
all = [
    "genusos[api,vision,rlm,tui,federation,mcp,dev]",
]

[project.scripts]
genusos = "robothor.cli:main"
robothor = "robothor.cli:main"

[project.urls]
Homepage = "https://github.com/Ironsail-llc/genus-os"
Repository = "https://github.com/Ironsail-llc/genus-os"
Issues = "https://github.com/Ironsail-llc/genus-os/issues"

[tool.hatch.build.targets.wheel]
packages = ["robothor"]

# crm/migrations and infra/migrations are NOT declared here as directory
# force-includes. hatchling's force-include walks a directory raw and never
# consults `exclude` config or .gitignore for it, and those two trees are
# also where this instance's untracked, gitignored Delphi migrations live on
# disk (crm/migrations/053_delphi_*.sql and friends). A directory-level
# force-include would ship them in any wheel built on a box where they
# happen to exist. hatch_build.py (a custom build hook, activated below)
# recomputes both trees at build time as an explicit per-file map with
# instance files filtered out, and still fails the build if a real platform
# migration ever falls behind — see hatch_build.py's module docstring and
# robothor/tests/test_migration_packaging.py.
[tool.hatch.build.targets.wheel.force-include]
# The init scaffold (repo-root templates/) ships as package data so a wheel
# install can scaffold a workspace. Named bundled_scaffold to avoid colliding
# with the robothor/templates/*.py code package that shares the parent dir.
# robothor/tests/test_template_resolution.py pins this mapping. Checked clean
# of instance files (git status --ignored -- templates); stays a plain
# static entry.
"templates" = "robothor/templates/bundled_scaffold"

# Scoped to the wheel target on purpose. A build-wide hook also runs for the
# sdist, and hatchling treats force-included sources as *relocations*: the 88
# tracked crm migrations would ship inside the sdist at robothor/migrations/
# and vanish from crm/migrations/ — a silent source-layout change. The sdist
# keeps its source layout and gets its own delphi guard below.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

# The sdist walks the whole tree. .gitignore covers today's delphi migrations
# by enumerated number (053_delphi_* ... 091_delphi_*), so a FUTURE delphi
# migration with a new number would leak into the sdist through the normal
# walk — the wheel hook cannot help there (force_include only adds files).
# The delphi patterns close that hole for any delphi name, any case, forever.
# robothor/tests/test_migration_packaging.py pins both this and the hook
# registration above.
#
# brain/ and local/ are instance-layer user-land (see CLAUDE.md). A handful of
# legacy files in them are still git-tracked, and hatchling's default sdist is
# "everything not VCS-ignored" — so without the excludes the sdist ships
# operator instance files to the GitHub Release and PyPI. The release
# workflow's instance-leak tripwire greps for these paths as defense-in-depth.
[tool.hatch.build.targets.sdist]
exclude = [
  "crm/migrations/*[Dd][Ee][Ll][Pp][Hh][Ii]*",
  "infra/migrations/*[Dd][Ee][Ll][Pp][Hh][Ii]*",
  "/brain",
  "/local",
  # .gitignore re-includes these two via `!` negations, which outrank the
  # directory excludes above in hatchling's pattern merge — name them
  # explicitly so nothing under brain/ or local/ ships.
  "/brain/README.md",
  "/local/owner.env.example",

]

[tool.coverage.run]
source = ["robothor"]
omit = ["*/tests/*"]

[tool.coverage.report]
skip_empty = true

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["brain/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C4", "RET", "PERF",
          "TCH", "FURB", "ERA", "PTH", "DTZ", "A"]
ignore = ["E501", "SIM108", "SIM110", "SIM117", "RET504", "RET505"]

[tool.ruff.lint.per-file-ignores]
"conftest.py" = ["SIM105"]
"crm/bridge/*.py" = ["E402", "N815", "SIM105"]
"crm/bridge/models.py" = ["N815"]
"crm/bridge/routers/*.py" = ["N803", "B008", "TC002"]  # FastAPI resolves request models at runtime
"crm/bridge/tests/*.py" = ["E402", "DTZ001"]
"crm/tests/*.py" = ["E402"]
# Engine modules with legitimate append-in-loop patterns (conditional builds,
# structured record construction) — PERF401 style suggestion not worth the rewrite
"robothor/engine/buddy_critic.py" = ["PERF401"]
"robothor/engine/session.py" = ["PERF401"]
"robothor/engine/telegram.py" = ["PERF401"]
# Test files: B017 blind-exception checks for DB constraint violations, N801/N802
# test-name conventions mirror the camelCase flag being tested, A002 `id` shadows
# builtin intentionally (matches the production field name), ERA001 commented
# alternatives in tests are deliberately kept as documentation
"tests/test_migration_*.py" = ["B017"]
"robothor/engine/tests/test_channel_bus.py" = ["N801"]
"robothor/engine/tests/test_guardrails_task_closure.py" = ["N802"]
"robothor/engine/tests/test_thread_planner.py" = ["A002"]
"robothor/engine/tests/test_goals.py" = ["ERA001"]

# mypy config lives in mypy.ini (pyproject.toml overrides don't work with editable installs)

# pytest config lives in pytest.ini (authoritative — pytest ignores this file
# when pytest.ini exists, and the two had silently drifted apart)
