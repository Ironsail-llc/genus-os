[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "genusos"
version = "1.28.2"
description = "Genus OS — An AI brain with persistent memory, semantic search, knowledge graph, vision, and self-healing infrastructure."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Genus OS Contributors" },
]
keywords = ["ai", "brain", "memory", "knowledge-graph", "rag", "vision", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "psycopg2-binary~=2.9",
    "redis~=5.0",
    "httpx~=0.27",
    "pydantic~=2.0",
    # ONNX 1.22+ requires ml-dtypes, whose Python 3.13+ wheels require NumPy
    # 2.x. Keep the stable 1.26 ABI on 3.11/3.12 while allowing the supported
    # NumPy 2 line on 3.13+.
    "numpy>=1.26,<2; python_version < '3.13'",
    "numpy>=2.1,<3; python_version >= '3.13'",
    "requests~=2.31",
    "pyyaml~=6.0",
    # Floor pins past the LiteLLM SQL-injection advisory (GHSA-vh4m-vp44-3rgq,
    # fixed in 1.61.17). No upper cap below 2.0: litellm 1.84+ relaxed its
    # transitive aiohttp pin again, so the latest 1.x (1.87.0) resolves cleanly
    # with aiohttp>=3.13.4. The 1.84 floor also clears later 2026 advisories.
    "litellm>=1.84.0,<2.0",
    "aiohttp>=3.14.1",
    "aiogram~=3.10",
    "apscheduler~=3.10",
    "croniter~=6.0",
    "html2text~=2024.2",
    "cryptography>=48.0.1",
    "structlog~=24.0",
    "prometheus-client~=0.21",
]

[project.optional-dependencies]
api = [
    # This floor also excludes the malicious FastAPI 0.136.3 release and pulls
    # the patched Starlette 1.3 line.
    "fastapi>=0.139",
    "uvicorn[standard]>=0.32",
    # Auth: bridge-issued JWT sessions + password hashing (break-glass admin).
    # pyjwt/bcrypt already resolve transitively; declare them as first-class.
    "pyjwt>=2.13.0",
    "argon2-cffi>=23.1",
]
vision = [
    "ultralytics>=8.0",
    "insightface>=0.7",
    # InsightFace leaves ONNX unconstrained; require the first release that
    # clears the 2026 parser and validation advisories.
    "onnx>=1.22.0",
    "onnxruntime>=1.17",
    "opencv-python>=4.8",
]
federation = [
    "nats-py>=2.0",
]
mcp = [
    # Official MCP Python SDK, used by robothor/api/mcp.py (session negotiation
    # only — our own client/bridge in robothor/engine + robothor/connectors
    # implement JSON-RPC directly and don't depend on this package). Floor is
    # the version installed ad-hoc today; ceiling excludes the next major so a
    # breaking SDK release (e.g. for 2026-07-28 support) is a deliberate bump,
    # not a surprise upgrade.
    "mcp>=1.26,<2",
]
rlm = [
    "rlms>=0.1.1",
]
tui = [
    "textual>=1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
    "pytest-cov>=5.0",
    "ruff==0.15.2",
    "mypy>=1.13",
    "types-requests>=2.31",
    "types-PyYAML>=6.0",
]
all = [
    "genusos[api,vision,rlm,tui,federation,mcp,dev]",
]

[project.scripts]
genusos = "robothor.cli:main"
robothor = "robothor.cli:main"

[project.urls]
Homepage = "https://genusos.dev"
Repository = "https://github.com/Ironsail-llc/genus-os"
Issues = "https://github.com/Ironsail-llc/genus-os/issues"

[tool.hatch.build.targets.wheel]
packages = ["robothor"]

[tool.hatch.build.targets.wheel.force-include]
"infra/migrations" = "robothor/migrations/infra"
# NOTE: 081-089 are absent from this list — a pre-existing packaging gap that
# means wheel-based deploys ship without them. Tracked separately; do not
# extend it. 092 is listed so the access-log roll-up ships with the wheel.
# Directory-level, NOT one line per file. The enumerated form drifted 10
# migrations behind — including 081 (tenant RLS backstop), 084 (feature flags)
# and 086 (user permissions) — so a wheel deploy would have come up with
# row-level security absent and nothing anywhere reporting an error. The runner
# only applies what it can find. robothor/tests/test_migration_packaging.py
# fails the build if this ever falls behind the manifest again.
"crm/migrations" = "robothor/migrations/crm"

[tool.coverage.run]
source = ["robothor"]
omit = ["*/tests/*"]

[tool.coverage.report]
skip_empty = true

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["brain/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C4", "RET", "PERF",
          "TCH", "FURB", "ERA", "PTH", "DTZ", "A"]
ignore = ["E501", "SIM108", "SIM110", "SIM117", "RET504", "RET505"]

[tool.ruff.lint.per-file-ignores]
"conftest.py" = ["SIM105"]
"crm/bridge/*.py" = ["E402", "N815", "SIM105"]
"crm/bridge/models.py" = ["N815"]
"crm/bridge/routers/*.py" = ["N803", "B008", "TC002"]  # FastAPI resolves request models at runtime
"crm/bridge/tests/*.py" = ["E402", "DTZ001"]
"crm/tests/*.py" = ["E402"]
# Engine modules with legitimate append-in-loop patterns (conditional builds,
# structured record construction) — PERF401 style suggestion not worth the rewrite
"robothor/engine/buddy_critic.py" = ["PERF401"]
"robothor/engine/session.py" = ["PERF401"]
"robothor/engine/telegram.py" = ["PERF401"]
# Test files: B017 blind-exception checks for DB constraint violations, N801/N802
# test-name conventions mirror the camelCase flag being tested, A002 `id` shadows
# builtin intentionally (matches the production field name), ERA001 commented
# alternatives in tests are deliberately kept as documentation
"tests/test_migration_*.py" = ["B017"]
"robothor/engine/tests/test_channel_bus.py" = ["N801"]
"robothor/engine/tests/test_guardrails_task_closure.py" = ["N802"]
"robothor/engine/tests/test_thread_planner.py" = ["A002"]
"robothor/engine/tests/test_goals.py" = ["ERA001"]

# mypy config lives in mypy.ini (pyproject.toml overrides don't work with editable installs)

# pytest config lives in pytest.ini (authoritative — pytest ignores this file
# when pytest.ini exists, and the two had silently drifted apart)
