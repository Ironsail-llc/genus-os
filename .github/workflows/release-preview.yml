name: Release Preview

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

# `pull-requests: write` is the minimum the sticky-comment action needs to
# create and update its comment, and it is why the two checkouts below are
# split: a job holding a write token must not execute code the pull request
# can rewrite.
permissions:
  pull-requests: write
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    if: github.event.pull_request.base.ref == 'main'
    steps:
      # The comment quotes the pull request's own release-note fragment, so the
      # author reads what the release will say while they can still change it.
      # That needs the tree, and this job holds `pull-requests: write` -- so the
      # TOOL is checked out from the BASE commit and only the FRAGMENTS come
      # from the head. A pull request can therefore change what the comment
      # says about itself, which is the point, but not what code produces it.
      # Both checkouts are sparse and drop their credentials: `preview` reads
      # `changelog.d/` and nothing else.
      - name: The tool, from the base commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: |
            scripts/changelog_fragments.py
            scripts/check_doc_links.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: The fragments, from the pull request
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          path: pr
          sparse-checkout: |
            changelog.d
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Compute release impact
        id: impact
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # Mirrors .releaserc.js releaseRules. Update both files together.
          TYPE=$(printf '%s' "$PR_TITLE" | sed -nE 's/^([a-z]+)(\([^)]+\))?!?:.*/\1/p')
          IS_BREAKING="no"
          if printf '%s' "$PR_TITLE" | grep -qE '^[a-z]+(\([^)]+\))?!:'; then
            IS_BREAKING="yes"
          fi
          if printf '%s' "$PR_BODY" | grep -qE '^BREAKING CHANGE:'; then
            IS_BREAKING="yes"
          fi

          BUMP="none"
          if [ "$IS_BREAKING" = "yes" ]; then
            BUMP="major"
          else
            case "$TYPE" in
              feat) BUMP="minor" ;;
              fix|perf|refactor|style) BUMP="patch" ;;
              docs)
                if printf '%s' "$PR_TITLE" | grep -qE '^docs\(README\):'; then
                  BUMP="patch"
                fi
                ;;
            esac
          fi

          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "type=$TYPE" >> "$GITHUB_OUTPUT"

      # What the release notes will say for this change, in the author's own
      # words, or the sentence that asks for them. Never fails the check: the
      # blocking half is the `changelog-fragment` job in ci.yml.
      - name: Read this pull request's release-note fragment
        id: fragment
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo 'notes<<FRAGMENT_EOF'
            python3 scripts/changelog_fragments.py --repo-root "$PWD/pr" preview \
              --pr "$PR_NUMBER" --title "$PR_TITLE" --labels "$PR_LABELS" || true
            echo FRAGMENT_EOF
          } >> "$GITHUB_OUTPUT"

      - name: Compose comment body
        id: comment
        env:
          BUMP: ${{ steps.impact.outputs.bump }}
          TYPE: ${{ steps.impact.outputs.type }}
          NOTES: ${{ steps.fragment.outputs.notes }}
        run: |
          {
            echo 'body<<EOF'
            if [ "$BUMP" = "none" ]; then
              echo "ℹ️ **No release on merge.** Title type \`$TYPE\` does not trigger semantic-release."
              echo ""
              echo "If a deploy is expected, change the PR title type to \`feat:\` (minor) or \`fix:\` (patch). See [release conventions](https://github.com/Ironsail-llc/aws-infrastucture/blob/main/docs/app-release-and-deploy.md)."
            else
              echo "✅ **Will trigger release on merge.** Expected bump: **$BUMP** (from \`$TYPE\`)."
              echo ""
              echo "Production image will be built and \`helm/genus-os/values-production.yaml\` updated. To deploy to staging first, add the \`deploy-staging\` label."
            fi
            if [ -n "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
              echo ""
              echo "---"
              echo ""
              printf '%s\n' "$NOTES"
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Post sticky comment
        # Third-party action SHA-pinned + tag-commented.
        uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0 # v3.0.4
        with:
          header: release-preview
          message: ${{ steps.comment.outputs.body }}
