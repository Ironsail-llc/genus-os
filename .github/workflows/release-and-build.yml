name: Release & Build

on:
  push:
    branches: [main]
    # No `paths-ignore`. Every bot-authored push to main carries `[skip ci]`
    # in the commit message (semantic-release, deploy-staging bump,
    # staging-reset bump), which GitHub Actions natively respects to skip
    # the workflow run. Filtering paths additionally swallows legitimate
    # cases — a chart-only `feat(helm):` PR or a human edit of
    # values-production.yaml needs to trigger a release + build + deploy,
    # but `helm/**` paths-ignore would silently skip the workflow and
    # leave production on stale code.
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, closed]
  workflow_dispatch:

# One release pipeline at a time; one staging-build per labeled PR at a time.
concurrency:
  group: release-and-build-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

# Default: read-only. Each job opts into the writes it actually needs.
permissions:
  contents: read

jobs:
  verify:
    name: Production release gate
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request'
        && github.event.action != 'closed')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # `Require CI to have passed this commit` reads the Actions API via
      # `gh run list`. The workflow-level grant is contents:read, under which
      # that call returns nothing — and this gate fails closed on "no run
      # found", so without this it would fail every time rather than pass
      # blindly.
      actions: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      # ci.yml owns ruff, mypy, the unit matrix across three Python versions,
      # the bridge suite, validate-agents, the integration suite, pip-audit,
      # gitleaks, the npm allowlist and the action-pin check. It triggers on the
      # same push and pull_request as this workflow, with no path filter, so it
      # has already run them against this exact commit.
      #
      # This gate used to re-run all of it, serially, in one job: ~40 minutes of
      # duplicate compute on every pull request and every release, and the long
      # pole on both. It asserts the result instead. Nothing stopped being
      # checked — the checks have one home, and this job fails if that home
      # reports anything other than success for this SHA.
      # Release runs only. On a pull request this assertion is both unnecessary
      # and unsound: branch protection already requires the named CI contexts
      # before the merge button unlocks, and PR runs are cancelled on purpose
      # when a new push supersedes them — so a burst of pushes leaves the head
      # commit's run `cancelled` and this step would fail a pull request for
      # doing nothing wrong. That is exactly what happened on this PR: three
      # pushes in quick succession, ci run for the head concluded `cancelled`,
      # gate red.
      #
      # On main there is nothing to supersede a commit (cancellation is
      # disabled there, see ci.yml's concurrency) and no merge button to gate,
      # so this is the only place the assertion is both needed and reliable.
      #
      # workflow_dispatch is deliberately NOT gated, and that is a real
      # trade-off rather than an oversight. A dispatch usually targets main's
      # tip, which after any release is a bot commit carrying [skip ci]
      # (semantic-release, promote-release.sh, the staging bump and reset) —
      # ci.yml never runs for those, so there would be no conclusion to assert
      # and every manual rebuild would fail on a missing run. The cost is that
      # a dispatched build is verified only by the two checks below, where
      # before this change the gate re-ran the suite against it. Dispatch is a
      # deliberate human action on an already-released commit, so that is the
      # better side of the trade; a dispatch of something genuinely unverified
      # should be a pull request instead.
      - name: Require CI to have passed this commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          deadline=$(( SECONDS + 3600 ))
          while :; do
            read -r status conclusion <<<"$(
              gh run list --commit "$SHA" --workflow ci.yml --limit 1 \
                --json status,conclusion \
                --jq '.[0] | "\(.status // "missing") \(.conclusion // "pending")"'
            )"
            case "$status" in
              completed)
                if [ "$conclusion" = "success" ]; then
                  echo "CI succeeded for $SHA."
                  exit 0
                fi
                if [ "$conclusion" = "cancelled" ]; then
                  echo "::error::CI for $SHA was cancelled, so this commit is unverified. Re-run the CI workflow for it, then re-run this job. (ci.yml no longer cancels main runs; a cancelled one here predates that change or was cancelled by hand.)"
                else
                  echo "::error::CI concluded '$conclusion' for $SHA — the release stops here."
                fi
                exit 1
                ;;
              missing)
                # Fail closed. A gate that passes because it could not find the
                # run it depends on is not a gate.
                if [ "$SECONDS" -gt "$(( deadline - 3300 ))" ]; then
                  echo "::error::No ci.yml run found for $SHA after 5 minutes."
                  exit 1
                fi
                ;;
            esac
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::CI for $SHA still '$status' after 60 minutes."
              exit 1
            fi
            sleep 30
          done

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - name: Verify product version metadata
        env:
          # Operator hatch for release-chain recovery: when release N's image
          # build fails after its tag is cut, production lawfully lags and
          # release N+1 must be allowed through to repair the chain. Set the
          # repository VARIABLE GENUS_ALLOW_DEPLOYMENT_LAG=true for the
          # recovery release, then unset it — the default keeps the
          # no-lag invariant enforced.
          #
          # Only consulted on release runs. On a pull request the deployment
          # tags are compared against the base branch instead of the version,
          # so a hand-edit is still caught but somebody else's stalled release
          # cannot block every PR (it has deadlocked this repo twice: v1.57.0
          # and v1.108.2). The script documents the split.
          GENUS_ALLOW_DEPLOYMENT_LAG: ${{ vars.GENUS_ALLOW_DEPLOYMENT_LAG || 'false' }}
          BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || '' }}
        run: |
          if [ -n "$BASE_REF" ]; then
            # Fetched explicitly rather than relying on fetch-depth: the
            # checkout above takes only the PR head.
            git fetch --no-tags --quiet origin "$BASE_REF"
            export GENUS_VERSION_BASELINE_REF=FETCH_HEAD
          fi
          node scripts/check-version-consistency.js
      # npm audit gate: named-allowlist policy, not a blanket exception. A
      # high/critical advisory must either be absent or have its GHSA id
      # explicitly tracked -- id, package, and a reviewed reason -- in
      # .npm-audit-allowlist.json (see scripts/check_npm_audit.py). Any
      # advisory NOT named in that tracked file still fails the gate,
      # including new advisories in an already-allowlisted package.
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.16.3
      - name: Verify production Kubernetes manifests
        run: |
          archive="$RUNNER_TEMP/helm-unittest.tgz"
          curl --fail --show-error --location --output "$archive" \
            https://github.com/helm-unittest/helm-unittest/releases/download/v0.8.2/helm-unittest-linux-amd64-0.8.2.tgz
          echo "56ab3091e6fa52a7c92ee951def9bed957f295d9ce98483aed404e748d7b3a94  $archive" \
            | sha256sum --check --strict
          plugin_dir="$(helm env HELM_PLUGINS)/helm-unittest"
          mkdir -p "$plugin_dir"
          tar --extract --gzip --file "$archive" --directory "$plugin_dir"
          helm repo add groundhog2k https://groundhog2k.github.io/helm-charts/
          # Official valkey-io chart repo — the per-app cache subchart.
          helm repo add valkey https://valkey.io/valkey-helm/
          helm dependency build helm/genus-os
          helm lint helm/genus-os --strict \
            --values helm/genus-os/values.yaml \
            --values helm/genus-os/values-production.yaml
          helm unittest helm/genus-os --strict
          # Hook-free render for kube-linter, as helm.yml does. Helm hook Pods
          # (chart tests) are ephemeral and never part of a release's steady
          # state, and the valkey subchart's test hook hardcodes a pod spec
          # with no resources, which this chart's values cannot fix.
          helm template gos helm/genus-os \
            --namespace genus \
            --no-hooks \
            --values helm/genus-os/values.yaml \
            --values helm/genus-os/values-production.yaml \
            > /tmp/genus-production.yaml
          # Hook-free copy for kube-linter only: a subchart's test-hook Pod
          # hardcodes its spec with no resource limits and is never part of a
          # release's steady state. helm lint and the full render above still
          # see everything.
          helm template gos helm/genus-os \
            --namespace genus \
            --no-hooks \
            --values helm/genus-os/values.yaml \
            --values helm/genus-os/values-production.yaml \
            > /tmp/genus-production-nohooks.yaml
          curl --fail --show-error --location \
            --output "$RUNNER_TEMP/kube-linter.tar.gz" \
            https://github.com/stackrox/kube-linter/releases/download/v0.7.4/kube-linter-linux.tar.gz
          echo "1d050a5d03e3347cc1cf5b1513f646709c65d129f7aa6c2b1a6388ffb2694671  $RUNNER_TEMP/kube-linter.tar.gz" \
            | sha256sum --check --strict
          tar --extract --gzip --file "$RUNNER_TEMP/kube-linter.tar.gz" \
            --directory "$RUNNER_TEMP" kube-linter
          "$RUNNER_TEMP/kube-linter" lint /tmp/genus-production-nohooks.yaml

  release:
    name: Semantic Release
    needs: [verify]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write       # tag + CHANGELOG.md commit
      issues: write         # GitHub Releases issue/PR comment integration
      pull-requests: write  # release notes referencing PRs
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      # main's TIP, not the push SHA. This job starts after the release gate,
      # tens of minutes after its push, and bot `[skip ci]` chores (staging
      # bump and reset, promotion) can land on main in between. Checked out at
      # the push SHA, semantic-release then finds the local branch behind the
      # remote, publishes nothing and exits 0: every downstream job skips and
      # a merged change is silently not released. From the tip it releases
      # everything that has landed. Downstream jobs build, publish and promote
      # the tag this job cuts (v<new_release_version>), never `github.sha`.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ssh-key: ${{ secrets.CI_USER_PRIVATE_KEY }}
          ref: main
          fetch-depth: 0

      # The gate verified GATED_SHA, not the tip. Bot `[skip ci]` chores
      # (release bookkeeping, deployment values) never get a CI run of their
      # own, so the tip may carry those and nothing else: the bot's email and
      # one of the bot's subject shapes. Anyone who can push to main could
      # forge both, which is the trust `[skip ci]` already carries. Anything
      # else (a direct push that landed while the gate ran, or a rewritten
      # main) was not verified by this run: stop red rather than release it.
      # That push started its own run, which gates its own SHA and releases
      # the tip after this one. With `cancel-in-progress: false` a third push
      # replaces the second run while it is pending, so the second push's CI
      # is never asserted yet the third run releases it. Pushes to main are
      # PR merges that passed the required CI checks, so that is acceptable.
      - name: Refuse a tip the gate did not verify
        env:
          GATED_SHA: ${{ github.sha }}
        run: |
          if ! git merge-base --is-ancestor "$GATED_SHA" HEAD; then
            echo "::error::The gated commit $GATED_SHA is not an ancestor of main's tip $(git rev-parse HEAD); main was rewritten. Nothing is released from this run."
            exit 1
          fi
          bot_email='github-actions[bot]@users.noreply.github.com'
          bot_subject='^(chore\(release\)|chore\(staging\)|chore\(deploy\)|revert\(deploy\)): .*\[skip ci\]'
          unverified=""
          for commit in $(git rev-list "$GATED_SHA..HEAD"); do
            email="$(git log -1 --format='%ae' "$commit")"
            subject="$(git log -1 --format='%s' "$commit")"
            if [ "$email" != "$bot_email" ] || [[ ! "$subject" =~ $bot_subject ]]; then
              unverified="${unverified}  ${commit} ${email}: ${subject}"$'\n'
            fi
          done
          if [ -n "$unverified" ]; then
            echo "::error::main's tip carries commits this run's gate did not verify. The run for the newest of them gates and releases the tip; this one stops here."
            printf '%s' "$unverified"
            exit 1
          fi
          echo "main's tip $(git rev-parse HEAD) is $GATED_SHA plus $(git rev-list --count "$GATED_SHA..HEAD") bot chore(s)."

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      # semantic-release's prepare step assembles `changelog.d/` into
      # `docs/release-notes.md`. Pinned rather than left to whatever python3
      # the runner image happens to ship: the release commit's contents must
      # not depend on an image bump. Stdlib only — nothing is installed.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - run: npm ci

      - name: Run semantic-release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
          JIRA_EMAIL: ${{ vars.JIRA_EMAIL }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
          # Plain text, so ANSI codes cannot break the skip-line match below.
          # semantic-release's logger (chalk 2 / supports-color 5) ignores
          # NO_COLOR; FORCE_COLOR=0 is what forces its colour level to 0.
          FORCE_COLOR: "0"
          NO_COLOR: "1"
        # Published means a v* tag on HEAD that did not exist before this
        # run (the tip can already be a tagged release commit: a re-run, or
        # a push whose tip is the last release) AND that is on the remote: a
        # tag whose push failed exists only here, nothing downstream could
        # check it out, so that fails now. Once the tag is on the remote the
        # step never fails, so the release always ships. Only when nothing
        # was published is the captured output checked for
        # semantic-release's own skip line (anchored to its logger, so the
        # commit subjects it echoes cannot match): main moved under it, it
        # exited 0, and that must not pass green. Accepted: a commit-body
        # line quoting that exact sentence, prefix included, could match on
        # a run that publishes nothing and turn it red.
        run: |
          log="$(mktemp)"
          tags_before="$(mktemp)"
          git tag --list 'v*' | sort > "$tags_before"
          set +e
          npx semantic-release 2>&1 | tee "$log"
          exit_code=${PIPESTATUS[0]}
          set -e

          version="$(git tag --points-at HEAD --list 'v*' | sort | comm -13 "$tags_before" - | head -n1)"
          if [ -n "$version" ] && ! git ls-remote --exit-code --tags origin "refs/tags/$version" >/dev/null; then
            echo "new_release_published=false" >> "$GITHUB_OUTPUT"
            echo "new_release_version=" >> "$GITHUB_OUTPUT"
            echo "::error::semantic-release cut $version but the tag is not on the remote (its push failed). Nothing downstream can build it; fix the push and re-run this workflow."
            exit 1
          fi
          if [ -n "$version" ]; then
            echo "new_release_published=true" >> "$GITHUB_OUTPUT"
            echo "new_release_version=${version#v}" >> "$GITHUB_OUTPUT"
            if [ "$exit_code" -ne 0 ]; then
              echo "::error::semantic-release exited $exit_code after cutting $version. The release ships; the log above names the step that failed."
            fi
            exit 0
          fi
          echo "new_release_published=false" >> "$GITHUB_OUTPUT"
          echo "new_release_version=" >> "$GITHUB_OUTPUT"

          if [ "$exit_code" -ne 0 ]; then
            echo "semantic-release failed with exit code $exit_code"
            exit "$exit_code"
          fi

          if grep -qE "^(\[[^]]*\] )?\[semantic-release\] [^[]*The local branch [^ ]+ is behind the remote one, therefore a new version won't be published" "$log"; then
            echo "::error::semantic-release skipped the release: main moved during this run, so the local branch is behind the remote. Nothing was published. Re-run this workflow to release main's tip."
            exit 1
          fi

  # ───────────────────────────────────────────────────────────────────────
  # Python distribution. On every release, build sdist+wheel from the
  # released tag on a clean CI clone and attach them to the GitHub Release.
  # PyPI publication is a separate job double-gated on the repository
  # variable PYPI_PUBLISH_ENABLED, so it skips cleanly (never red) until
  # the PyPI trusted publisher + `pypi` environment exist.
  # ───────────────────────────────────────────────────────────────────────
  build-dist:
    name: Build & attach release distributions
    needs: [release]
    if: |
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # gh release upload
    steps:
      # Build from the released tag on a clean clone, never a pre-existing
      # workspace: the tag commit carries the version metadata committed by
      # semantic-release, and the clean checkout is the primary guarantee
      # that gitignored instance files (delphi migrations, brain/) cannot
      # leak into the published distributions.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: v${{ needs.release.outputs.new_release_version }}

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*

      # Mirrors ci.yml's wheel-smoke tripwire, extended to the sdist and to
      # the instance-layer directories: gitignored delphi migrations must
      # never ship, and neither may brain/ or local/ (instance user-land —
      # legacy tracked files there are excluded via
      # [tool.hatch.build.targets.sdist] in pyproject.toml; this catches a
      # future packaging-exclude regression).
      - name: Verify no instance files leaked into the distributions
        run: |
          pattern='delphi|(^|/)(brain|local)/'
          if python -m zipfile -l dist/*.whl | grep -iE "$pattern"; then
            echo "::error::instance files leaked into the wheel"
            exit 1
          fi
          if tar -tzf dist/*.tar.gz | grep -iE "$pattern"; then
            echo "::error::instance files leaked into the sdist"
            exit 1
          fi

      - name: Attach distributions to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release.outputs.new_release_version }}
        run: gh release upload "v${VERSION}" dist/* --clobber

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-dist-v${{ needs.release.outputs.new_release_version }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  publish-pypi:
    name: Publish to PyPI
    needs: [release, build-dist]
    # Job-level gate: a plain false condition marks the job "skipped"
    # (green), never failed. Flip the repository VARIABLE
    # PYPI_PUBLISH_ENABLED to 'true' once the PyPI trusted publisher and
    # the `pypi` GitHub environment exist.
    if: |
      needs.release.outputs.new_release_published == 'true'
      && vars.PYPI_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # PyPI Trusted Publishing (OIDC) — no API token
    steps:
      # Publish exactly the artifacts built from the clean tag checkout and
      # already attached to the GitHub Release — no rebuild, no drift.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-dist-v${{ needs.release.outputs.new_release_version }}
          path: dist/
      # Third-party action SHA-pinned + tag-commented.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/

  build:
    name: Build & Push (${{ matrix.image.name }})
    needs: [verify, release]
    if: |
      always() && needs.verify.result == 'success' && (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && needs.release.outputs.new_release_published == 'true') ||
        (github.event_name == 'pull_request'
          && github.event.action != 'closed'
          && github.event.action != 'unlabeled'
          && contains(github.event.pull_request.labels.*.name, 'deploy-staging'))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # GHCR push
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: python, dockerfile: Dockerfile.python }
          - { name: app,    dockerfile: Dockerfile.app    }
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # For labeled PRs, check out the PR HEAD (not the merge commit) so
          # the SHA we tag matches what the contributor pushed. A production
          # release must build the semantic-release tag because that commit
          # contains the newly synchronized runtime version metadata.
          ref: ${{ github.event_name == 'push' && needs.release.outputs.new_release_published == 'true' && format('v{0}', needs.release.outputs.new_release_version) || (github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha) }}
          fetch-depth: 0

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve SemVer tags from release output
        id: semver
        env:
          PUBLISHED: ${{ needs.release.outputs.new_release_published }}
          VERSION: ${{ needs.release.outputs.new_release_version }}
        run: |
          if [ "$PUBLISHED" = "true" ] && [ -n "$VERSION" ]; then
            echo "raw_version=$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "raw_version=" >> "$GITHUB_OUTPUT"
          fi

      - name: docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/ironsail-llc/genus-os/${{ matrix.image.name }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=v${{ steps.semver.outputs.raw_version }},enable=${{ steps.semver.outputs.raw_version != '' }}
            type=match,pattern=v(\d+\.\d+),group=1,value=v${{ steps.semver.outputs.raw_version }},enable=${{ steps.semver.outputs.raw_version != '' }}
            type=match,pattern=v(\d+),group=1,value=v${{ steps.semver.outputs.raw_version }},enable=${{ steps.semver.outputs.raw_version != '' }}
            type=raw,value=pr-${{ github.event.pull_request.number }}-sha-{{sha}},enable=${{ github.event_name == 'pull_request' }}
            # `sha-` names the commit this run gated (github.sha); a release
            # image is built from the release tag, so the version tags name it.
            type=sha,prefix=sha-,format=short

      - name: Build & push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./${{ matrix.image.dockerfile }}
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: |
            type=gha,scope=${{ matrix.image.name }}
            type=registry,ref=ghcr.io/ironsail-llc/genus-os/${{ matrix.image.name }}:buildcache
          cache-to: |
            type=gha,scope=${{ matrix.image.name }},mode=max
            type=registry,ref=ghcr.io/ironsail-llc/genus-os/${{ matrix.image.name }}:buildcache,mode=max

      - name: Resolve primary tag
        id: primary
        env:
          META_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          # First tag in metadata-action output is the canonical/primary one.
          PRIMARY=$(printf '%s\n' "$META_TAGS" | head -n1)
          echo "ref=$PRIMARY" >> "$GITHUB_OUTPUT"
          echo "tag=${PRIMARY##*:}" >> "$GITHUB_OUTPUT"

      # Trivy does double duty: CVE scan + SPDX SBOM generation. Avoids a
      # second action (was anchore/sbom-action) that only ships floating v0
      # tags. Third-party action SHA-pinned + tag-commented.
      - name: Trivy — block on CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.primary.outputs.ref }}
          format: table
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Trivy — SARIF report (CRITICAL,HIGH)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.primary.outputs.ref }}
          format: sarif
          output: trivy-${{ matrix.image.name }}.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Trivy — SPDX SBOM
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.primary.outputs.ref }}
          format: spdx-json
          output: sbom-${{ matrix.image.name }}.spdx.json

      - name: Upload Trivy SARIF
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-${{ matrix.image.name }}-${{ steps.primary.outputs.tag }}
          path: trivy-${{ matrix.image.name }}.sarif
          retention-days: 30

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ matrix.image.name }}-${{ steps.primary.outputs.tag }}
          path: sbom-${{ matrix.image.name }}.spdx.json
          retention-days: 90

  # Production values remain on the previous known-good image while release
  # metadata is committed, images are built, and both blocking scans run.
  # Only this job makes the new release deployable.
  promote-production:
    name: Promote scanned production images
    needs: [release, build]
    if: |
      always()
      && needs.build.result == 'success'
      && needs.release.outputs.new_release_published == 'true'
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    outputs:
      promotion_commit: ${{ steps.promote.outputs.promotion_commit }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ssh-key: ${{ secrets.CI_USER_PRIVATE_KEY }}
          ref: main
          fetch-depth: 0

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify both release images exist
        env:
          VERSION: ${{ needs.release.outputs.new_release_version }}
        run: |
          docker buildx imagetools inspect "ghcr.io/ironsail-llc/genus-os/python:v${VERSION}" >/dev/null
          docker buildx imagetools inspect "ghcr.io/ironsail-llc/genus-os/app:v${VERSION}" >/dev/null

      - name: Promote release in GitOps values
        id: promote
        env:
          VERSION: ${{ needs.release.outputs.new_release_version }}
        # Retries against a moving main — see scripts/promote-release.sh.
        # This job runs tens of minutes after checkout, so anything that
        # merged in the meantime would otherwise reject the push and drop
        # the promotion entirely.
        run: bash scripts/promote-release.sh "$VERSION"

  publish-chart:
    name: Publish the Helm chart to ghcr.io/ironsail-llc/charts
    needs: [release, build]
    # NOT a `push: tags: ['v*']` trigger in helm.yml, which is where this
    # belongs by topic and where it would never run: semantic-release's release
    # commit is `chore(release): X [skip ci]`, the vX.Y.Z tag points at exactly
    # that commit, and GitHub evaluates the skip instruction against a tag
    # push's head commit like any other. Zero tag-push runs exist in this
    # repository's history. `on: release` is closed too — the GitHub Release is
    # created with GITHUB_TOKEN, and events from that token start no runs.
    #
    # So the chart publishes the way production images are promoted: off the
    # `release` job's outputs, in the run that created the release.
    if: |
      always()
      && needs.build.result == 'success'
      && needs.release.outputs.new_release_published == 'true'
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # The TAG, not main: main may already carry the next merge, and the
      # chart that is published has to be the one the release describes.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: v${{ needs.release.outputs.new_release_version }}

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.16.3

      # semantic-release bumps Chart.yaml in the commit this tag points at, so
      # these agree unless something raced. Publishing anyway would put a
      # version in the registry that no release describes.
      - name: Assert the chart version is the released version
        env:
          VERSION: ${{ needs.release.outputs.new_release_version }}
        run: |
          CHART="$(helm show chart helm/genus-os | awk '/^version:/ {print $2}' | tr -d '"')"
          echo "release=${VERSION}  Chart.yaml=${CHART}"
          if [ "$VERSION" != "$CHART" ]; then
            echo "chart version ${CHART} is not the released version ${VERSION}"
            exit 1
          fi

      - name: helm dependency build
        run: |
          helm repo add groundhog2k https://groundhog2k.github.io/helm-charts/
          # Official valkey-io chart repo — the per-app cache subchart.
          helm repo add valkey https://valkey.io/valkey-helm/
          helm dependency build helm/genus-os

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GITHUB_TOKEN" \
            | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: helm package and push
        env:
          VERSION: ${{ needs.release.outputs.new_release_version }}
        run: |
          helm package helm/genus-os --destination "$RUNNER_TEMP"
          helm push "$RUNNER_TEMP/genus-os-${VERSION}.tgz" oci://ghcr.io/ironsail-llc/charts

      # A push nobody pulls back is a push that can be broken for a whole
      # release cycle. Pull the published artifact -- not the working tree --
      # and render it with the values production actually uses.
      - name: Pull the published chart back and render it
        env:
          VERSION: ${{ needs.release.outputs.new_release_version }}
        run: |
          mkdir -p "$RUNNER_TEMP/verify"
          helm pull oci://ghcr.io/ironsail-llc/charts/genus-os \
            --version "$VERSION" --destination "$RUNNER_TEMP/verify"
          test -f "$RUNNER_TEMP/verify/genus-os-${VERSION}.tgz"
          helm template gos "$RUNNER_TEMP/verify/genus-os-${VERSION}.tgz" \
            --namespace genus \
            --values helm/genus-os/values.yaml \
            --values helm/genus-os/values-production.yaml \
            --set dashboard.ingress.host=genus-os.internal.ironsail.ai \
            > "$RUNNER_TEMP/verify/production.yaml"
          test -s "$RUNNER_TEMP/verify/production.yaml"
          echo "assertion OK: oci://ghcr.io/ironsail-llc/charts/genus-os ${VERSION} renders"

      - name: Summarise
        env:
          VERSION: ${{ needs.release.outputs.new_release_version }}
        run: |
          {
            echo "### Chart published"
            echo
            echo '```bash'
            echo "helm install genus oci://ghcr.io/ironsail-llc/charts/genus-os \\"
            echo "  --version ${VERSION} --namespace genus --create-namespace -f values.yaml"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  comment-pr:
    name: Sticky PR comment
    needs: [build]
    if: |
      always()
      && needs.build.result == 'success'
      && github.event_name == 'pull_request'
      && contains(github.event.pull_request.labels.*.name, 'deploy-staging')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Compute short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      # Third-party action SHA-pinned + tag-commented.
      - uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0 # v3.0.4
        with:
          header: build-and-push
          message: |
            ### 🐳 Images built for staging

            | Image | Tag |
            |---|---|
            | `ghcr.io/ironsail-llc/genus-os/python` | `pr-${{ github.event.pull_request.number }}-sha-${{ steps.sha.outputs.short }}` |
            | `ghcr.io/ironsail-llc/genus-os/app` | `pr-${{ github.event.pull_request.number }}-sha-${{ steps.sha.outputs.short }}` |

            Deploy job is wired in Phase 4 once `helm/genus-os/` lands.
            For now the images are available in GHCR and tagged for this PR's HEAD.

  # ───────────────────────────────────────────────────────────────────────
  # Production: deploy only the GitOps promotion commit created after both
  # release images passed their blocking scans.
  # ───────────────────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy to production
    needs: [release, build, promote-production]
    # Kill switch: the ArgoCD automation token (repo secret ARGOCD_TOKEN)
    # expired ~2026-07-16 and this job has failed red on every production
    # release since, training alarm fatigue on an otherwise-green release
    # train. Gated behind a repo VARIABLE so the job shows SKIPPED (grey)
    # instead of FAILED (red) while the token is dead. No job depends on
    # deploy-production via `needs:` (promote-production already runs and
    # commits the GitOps promotion before this job, independent of it), so
    # skipping it breaks nothing downstream.
    #
    # Re-enable: refresh the ArgoCD token, update the `ARGOCD_TOKEN`
    # repository secret, then set the repository VARIABLE
    # ARGOCD_DEPLOY_ENABLED=true (Settings → Secrets and variables →
    # Actions → Variables). Unset/false keeps both this job and
    # deploy-staging (below) skipped.
    if: |
      always()
      && vars.ARGOCD_DEPLOY_ENABLED == 'true'
      && needs.build.result == 'success'
      && needs.promote-production.result == 'success'
      && needs.release.outputs.new_release_published == 'true'
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ssh-key: ${{ secrets.CI_USER_PRIVATE_KEY }}
          ref: main
          fetch-depth: 0

      - name: Tailscale up (needed for private ArgoCD)
        uses: tailscale/github-action@6cae46e2d796f265265cfcf628b72a32b4d7cade # v3.3.0
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_CLIENT_SECRET }}
          tags: tag:github-ci

      - name: Install ArgoCD CLI
        run: |
          scripts/install-argocd-cli.sh "$RUNNER_TEMP/argocd"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Sync + wait for health
        env:
          ARGOCD_SERVER: ${{ vars.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_TOKEN }}
        run: |
          set -e
          argocd app terminate-op ironsail-production-genus-os --grpc-web || true
          argocd app sync ironsail-production-genus-os --grpc-web --prune --retry-limit 2
          argocd app wait ironsail-production-genus-os --grpc-web --health --timeout 900

      - name: Smoke-test live and ready endpoints
        id: smoke
        continue-on-error: true
        env:
          GENUS_URL: ${{ vars.GENUS_PRODUCTION_URL || 'https://genus-os.internal.ironsail.ai' }}
        run: |
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 "$GENUS_URL/api/live"
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 "$GENUS_URL/api/ready"

      - name: Roll back a failed production smoke test
        if: steps.smoke.outcome == 'failure'
        env:
          ARGOCD_SERVER: ${{ vars.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_TOKEN }}
          PROMOTION_COMMIT: ${{ needs.promote-production.outputs.promotion_commit }}
          VERSION: ${{ needs.release.outputs.new_release_version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --ff-only origin main

          git_rollback=false
          if git revert --no-commit "$PROMOTION_COMMIT"; then
            git commit -m "revert(deploy): roll back v${VERSION} [skip ci]"
            if git push origin HEAD:main; then
              git_rollback=true
            fi
          else
            git revert --abort || true
          fi

          if [ "$git_rollback" = "true" ]; then
            argocd app sync ironsail-production-genus-os --grpc-web --prune --retry-limit 2
          else
            echo "GitOps rollback failed; applying an emergency ArgoCD rollback." >&2
            argocd app rollback ironsail-production-genus-os --grpc-web
          fi
          argocd app wait ironsail-production-genus-os --grpc-web --health --timeout 900
          exit 1

  # ───────────────────────────────────────────────────────────────────────
  # Staging: label-driven. The deploy-staging label on a PR triggers an
  # image build (above) and then this job, which:
  #   1. Refuses if another open PR already owns staging (collision check
  #      via global.deployedFromPR in helm/genus-os/values-staging.yaml).
  #   2. Commits an imageTag bump on main with `[skip ci]`.
  #   3. Syncs the staging ArgoCD app.
  #   4. Posts the live staging URL in a sticky PR comment.
  #
  # On `unlabeled` / `closed` events the staging-reset job (below) walks
  # values-staging.yaml back to the latest released vX.Y.Z so staging
  # always tracks "latest released" when no PR holds the slot.
  # ───────────────────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to staging
    needs: [build]
    # Shares the same ArgoCD automation token as deploy-production (repo
    # secret ARGOCD_TOKEN) — same expired-token failure, same kill switch.
    # See the deploy-production comment above for the full explanation and
    # re-enable steps: set repo VARIABLE ARGOCD_DEPLOY_ENABLED=true after
    # refreshing ARGOCD_TOKEN.
    if: |
      always()
      && vars.ARGOCD_DEPLOY_ENABLED == 'true'
      && needs.build.result == 'success'
      && github.event_name == 'pull_request'
      && github.event.action != 'closed'
      && github.event.action != 'unlabeled'
      && contains(github.event.pull_request.labels.*.name, 'deploy-staging')
    runs-on: ubuntu-latest
    concurrency:
      group: staging-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ssh-key: ${{ secrets.CI_USER_PRIVATE_KEY }}
          ref: main
          fetch-depth: 0

      - name: Collision check
        id: collision
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          THIS_PR: ${{ github.event.pull_request.number }}
        run: |
          # Read the PR number currently occupying staging.
          CUR=$(yq '.global.deployedFromPR // ""' helm/genus-os/values-staging.yaml)
          if [ -z "$CUR" ] || [ "$CUR" = "null" ] || [ "$CUR" = "$THIS_PR" ]; then
            echo "free=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Another PR — is it still open AND still labeled?
          STATE=$(gh pr view "$CUR" --json state,labels -q '{state: .state, labels: [.labels[].name]}' 2>/dev/null || echo '{}')
          OPEN=$(echo "$STATE" | jq -r '.state == "OPEN"')
          LABELED=$(echo "$STATE" | jq -r '(.labels // []) | contains(["deploy-staging"])')
          if [ "$OPEN" = "true" ] && [ "$LABELED" = "true" ]; then
            echo "free=false" >> "$GITHUB_OUTPUT"
            echo "holder=$CUR" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Holder no longer holds — claim the slot.
          echo "free=true" >> "$GITHUB_OUTPUT"

      - name: Comment + fail on collision
        if: steps.collision.outputs.free != 'true'
        uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0 # v3.0.4
        with:
          header: deploy-staging
          message: |
            ❌ **Staging is occupied by #${{ steps.collision.outputs.holder }}.**

            Unlabel `deploy-staging` on #${{ steps.collision.outputs.holder }} (or wait for it to merge), then re-label this PR to retry.
      - name: Fail on collision
        if: steps.collision.outputs.free != 'true'
        run: exit 1

      - name: Bump values-staging.yaml
        env:
          PR_NUM: ${{ github.event.pull_request.number }}
          SHORT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -e
          SHA7="${SHORT_SHA:0:7}"
          TAG="pr-${PR_NUM}-sha-${SHA7}"
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          yq -i ".global.imageTag = \"$TAG\" |
                 .global.deployedFromPR = \"$PR_NUM\" |
                 .global.deployedAt = \"$NOW\"" helm/genus-os/values-staging.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/genus-os/values-staging.yaml
          if git diff --staged --quiet; then
            echo "no change — already at $TAG"
            exit 0
          fi
          git commit -m "chore(staging): deploy PR #${PR_NUM} (sha-${SHA7}) [skip ci]"
          git push origin main

      - name: Tailscale up
        uses: tailscale/github-action@6cae46e2d796f265265cfcf628b72a32b4d7cade # v3.3.0
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_CLIENT_SECRET }}
          tags: tag:github-ci

      - name: Install ArgoCD CLI
        run: |
          scripts/install-argocd-cli.sh "$RUNNER_TEMP/argocd"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Sync + wait for health
        env:
          ARGOCD_SERVER: ${{ vars.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_TOKEN }}
        run: |
          set -e
          argocd app terminate-op ironsail-staging-genus-os --grpc-web || true
          argocd app sync ironsail-staging-genus-os --grpc-web --prune --retry-limit 2
          argocd app wait ironsail-staging-genus-os --grpc-web --health --timeout 900

      - name: Sticky deploy-success comment
        uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0 # v3.0.4
        with:
          header: deploy-staging
          message: |
            ✅ **Deployed to staging.**

            - Image: `ghcr.io/ironsail-llc/genus-os/python:pr-${{ github.event.pull_request.number }}-sha-${{ github.event.pull_request.head.sha }}`
            - URL: <https://genus-os.staging.internal.ironsail.ai>

            Release the slot by removing the `deploy-staging` label or merging this PR — staging will reset to the latest released `vX.Y.Z`.

  # ───────────────────────────────────────────────────────────────────────
  # Staging reset: PR closed (merged or not) OR `deploy-staging` label
  # removed — if this PR currently holds staging, walk values-staging.yaml
  # back to the latest released vX.Y.Z and sync.
  # ───────────────────────────────────────────────────────────────────────
  staging-reset:
    name: Reset staging to latest release
    if: |
      github.event_name == 'pull_request'
      && ( github.event.action == 'closed'
           || (github.event.action == 'unlabeled' && github.event.label.name == 'deploy-staging') )
    runs-on: ubuntu-latest
    concurrency:
      group: staging-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ssh-key: ${{ secrets.CI_USER_PRIVATE_KEY }}
          ref: main
          fetch-depth: 0

      - name: Bump values-staging.yaml to latest release
        id: bump
        env:
          THIS_PR: ${{ github.event.pull_request.number }}
        run: |
          set -e
          CUR=$(yq '.global.deployedFromPR // ""' helm/genus-os/values-staging.yaml)
          if [ "$CUR" != "$THIS_PR" ]; then
            echo "Staging is held by PR=$CUR (not this one, $THIS_PR) — leaving alone."
            echo "synced=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Latest semver tag.
          LATEST=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          if [ -z "$LATEST" ]; then
            echo "No released vX.Y.Z yet — staging will sit on the previous tag until a release lands."
            echo "synced=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          yq -i ".global.imageTag = \"$LATEST\" |
                 .global.deployedFromPR = \"\" |
                 .global.deployedAt = \"\"" helm/genus-os/values-staging.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/genus-os/values-staging.yaml
          if git diff --staged --quiet; then
            echo "synced=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(staging): reset to ${LATEST} [skip ci]"
          git push origin main
          echo "synced=true" >> "$GITHUB_OUTPUT"

      # Everything below runs ONLY when the bump actually committed a change,
      # i.e. this PR was the one currently holding staging. PRs that never
      # held staging short-circuit at the step above with no work — no
      # Tailscale, no argocd, no sticky comment noise.
      - name: Tailscale up
        if: steps.bump.outputs.synced == 'true'
        uses: tailscale/github-action@6cae46e2d796f265265cfcf628b72a32b4d7cade # v3.3.0
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_CLIENT_SECRET }}
          tags: tag:github-ci

      - name: Install ArgoCD CLI
        if: steps.bump.outputs.synced == 'true'
        run: |
          scripts/install-argocd-cli.sh "$RUNNER_TEMP/argocd"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Sync staging
        if: steps.bump.outputs.synced == 'true'
        env:
          ARGOCD_SERVER: ${{ vars.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_TOKEN }}
        run: |
          argocd app sync ironsail-staging-genus-os --grpc-web --prune --retry-limit 2 || true
          argocd app wait ironsail-staging-genus-os --grpc-web --health --timeout 900 || true

