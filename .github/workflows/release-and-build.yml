name: Release & Build

on:
  push:
    branches: [main]
    # No `paths-ignore`. Every bot-authored push to main carries `[skip ci]`
    # in the commit message (semantic-release, deploy-staging bump,
    # staging-reset bump), which GitHub Actions natively respects to skip
    # the workflow run. Filtering paths additionally swallows legitimate
    # cases — a chart-only `feat(helm):` PR or a human edit of
    # values-production.yaml needs to trigger a release + build + deploy,
    # but `helm/**` paths-ignore would silently skip the workflow and
    # leave production on stale code.
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, closed]
  workflow_dispatch:

# One release pipeline at a time; one staging-build per labeled PR at a time.
concurrency:
  group: release-and-build-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

# Default: read-only. Each job opts into the writes it actually needs.
permissions:
  contents: read

jobs:
  verify:
    name: Production release gate
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request'
        && github.event.action != 'closed')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: robothor
          POSTGRES_PASSWORD: robothor
          POSTGRES_DB: robothor_release_gate
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify workflow actions are immutably pinned
        run: python3 scripts/check_workflow_action_pins.py

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,api,vision,tui]" opencv-python-headless
      - run: pip install -r crm/bridge/requirements.txt
      - name: Verify Python source and complete unit suite
        run: |
          ruff check robothor/ crm/bridge/
          ruff format --check robothor/ crm/bridge/
          mypy robothor/ --ignore-missing-imports
          pytest tests/ robothor/ -m "not integration and not llm and not slow and not e2e" --cov=robothor --cov-fail-under=60
          pytest crm/bridge/tests/ -m "not integration and not slow and not e2e"
          python scripts/validate_agents.py --ci

      - name: Verify canonical migrations against PostgreSQL
        env:
          PGPASSWORD: robothor
          ROBOTHOR_TEST_DB_DSN: "dbname=robothor_release_gate user=robothor password=robothor host=localhost port=5432"
          ROBOTHOR_DB_HOST: 127.0.0.1
          ROBOTHOR_DB_PORT: "5432"
          ROBOTHOR_DB_NAME: robothor_release_gate
          ROBOTHOR_DB_USER: robothor
          ROBOTHOR_DB_PASSWORD: robothor
        run: |
          python -m robothor.cli migrate
          python -m robothor.cli migrate --check
          pytest tests/integration/ -m integration

      - name: Audit Python dependencies
        run: |
          pip install pip-audit==2.10.1
          pip-audit

      - name: Scan repository history for secrets
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --show-error --location --output "$archive" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          echo "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  $archive" \
            | sha256sum --check --strict
          tar --extract --gzip --file "$archive" \
            --directory "$RUNNER_TEMP/bin" gitleaks
          "$RUNNER_TEMP/bin/gitleaks" detect --source . --verbose

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10.34.5
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Verify product version metadata
        run: node scripts/check-version-consistency.js
      # npm audit gate: named-allowlist policy, not a blanket exception. A
      # high/critical advisory must either be absent or have its GHSA id
      # explicitly tracked -- id, package, and a reviewed reason -- in
      # .npm-audit-allowlist.json (see scripts/check_npm_audit.py). Any
      # advisory NOT named in that tracked file still fails the gate,
      # including new advisories in an already-allowlisted package.
      - name: Audit release-tooling lock
        run: |
          npm audit --package-lock-only --audit-level=high --json > /tmp/npm-audit.json || true
          python3 scripts/check_npm_audit.py /tmp/npm-audit.json
      - name: Verify dashboard and browser flows
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          # Legacy npm audit endpoints were retired 2026-07 (HTTP 410 Gone) and
          # pnpm 10.x still queries them, so `pnpm audit` fails unconditionally — a
          # dead-endpoint error, not a finding. Keep it visible but non-blocking
          # until a working advisory source is wired up (see follow-up). The npm
          # audit above still runs against the working bulk endpoint.
          pnpm audit --audit-level=high || echo "::warning::pnpm audit skipped — npm audit endpoint retired (HTTP 410); dependency scan gap tracked as follow-up"
          pnpm lint
          pnpm exec tsc --noEmit
          pnpm test
          pnpm build
          pnpm exec playwright install --with-deps chromium
          pnpm exec playwright test

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.16.3
      - name: Verify production Kubernetes manifests
        run: |
          archive="$RUNNER_TEMP/helm-unittest.tgz"
          curl --fail --show-error --location --output "$archive" \
            https://github.com/helm-unittest/helm-unittest/releases/download/v0.8.2/helm-unittest-linux-amd64-0.8.2.tgz
          echo "56ab3091e6fa52a7c92ee951def9bed957f295d9ce98483aed404e748d7b3a94  $archive" \
            | sha256sum --check --strict
          plugin_dir="$(helm env HELM_PLUGINS)/helm-unittest"
          mkdir -p "$plugin_dir"
          tar --extract --gzip --file "$archive" --directory "$plugin_dir"
          helm repo add groundhog2k https://groundhog2k.github.io/helm-charts/
          helm dependency build helm/genus-os
          helm lint helm/genus-os --strict \
            --values helm/genus-os/values.yaml \
            --values helm/genus-os/values-production.yaml
          helm unittest helm/genus-os --strict
          helm template gos helm/genus-os \
            --namespace genus \
            --values helm/genus-os/values.yaml \
            --values helm/genus-os/values-production.yaml \
            > /tmp/genus-production.yaml
          curl --fail --show-error --location \
            --output "$RUNNER_TEMP/kube-linter.tar.gz" \
            https://github.com/stackrox/kube-linter/releases/download/v0.7.4/kube-linter-linux.tar.gz
          echo "1d050a5d03e3347cc1cf5b1513f646709c65d129f7aa6c2b1a6388ffb2694671  $RUNNER_TEMP/kube-linter.tar.gz" \
            | sha256sum --check --strict
          tar --extract --gzip --file "$RUNNER_TEMP/kube-linter.tar.gz" \
            --directory "$RUNNER_TEMP" kube-linter
          "$RUNNER_TEMP/kube-linter" lint /tmp/genus-production.yaml

  release:
    name: Semantic Release
    needs: [verify]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write       # tag + CHANGELOG.md commit
      issues: write         # GitHub Releases issue/PR comment integration
      pull-requests: write  # release notes referencing PRs
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ssh-key: ${{ secrets.CI_USER_PRIVATE_KEY }}
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run semantic-release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
          JIRA_EMAIL: ${{ vars.JIRA_EMAIL }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          set +e
          npx semantic-release
          exit_code=$?
          set -e

          if [ $exit_code -ne 0 ]; then
            echo "semantic-release failed with exit code $exit_code"
            exit $exit_code
          fi

          if version=$(git describe --tags --exact-match HEAD 2>/dev/null); then
            echo "new_release_published=true" >> "$GITHUB_OUTPUT"
            echo "new_release_version=${version#v}" >> "$GITHUB_OUTPUT"
          else
            echo "new_release_published=false" >> "$GITHUB_OUTPUT"
            echo "new_release_version=" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build & Push (${{ matrix.image.name }})
    needs: [verify, release]
    if: |
      always() && needs.verify.result == 'success' && (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && needs.release.outputs.new_release_published == 'true') ||
        (github.event_name == 'pull_request'
          && github.event.action != 'closed'
          && github.event.action != 'unlabeled'
          && contains(github.event.pull_request.labels.*.name, 'deploy-staging'))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # GHCR push
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: python, dockerfile: Dockerfile.python }
          - { name: app,    dockerfile: Dockerfile.app    }
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # For labeled PRs, check out the PR HEAD (not the merge commit) so
          # the SHA we tag matches what the contributor pushed. A production
          # release must build the semantic-release tag because that commit
          # contains the newly synchronized runtime version metadata.
          ref: ${{ github.event_name == 'push' && needs.release.outputs.new_release_published == 'true' && format('v{0}', needs.release.outputs.new_release_version) || (github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha) }}
          fetch-depth: 0

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve SemVer tags from release output
        id: semver
        env:
          PUBLISHED: ${{ needs.release.outputs.new_release_published }}
          VERSION: ${{ needs.release.outputs.new_release_version }}
        run: |
          if [ "$PUBLISHED" = "true" ] && [ -n "$VERSION" ]; then
            echo "raw_version=$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "raw_version=" >> "$GITHUB_OUTPUT"
          fi

      - name: docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/ironsail-llc/genus-os/${{ matrix.image.name }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=v${{ steps.semver.outputs.raw_version }},enable=${{ steps.semver.outputs.raw_version != '' }}
            type=match,pattern=v(\d+\.\d+),group=1,value=v${{ steps.semver.outputs.raw_version }},enable=${{ steps.semver.outputs.raw_version != '' }}
            type=match,pattern=v(\d+),group=1,value=v${{ steps.semver.outputs.raw_version }},enable=${{ steps.semver.outputs.raw_version != '' }}
            type=raw,value=pr-${{ github.event.pull_request.number }}-sha-{{sha}},enable=${{ github.event_name == 'pull_request' }}
            type=sha,prefix=sha-,format=short

      - name: Build & push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./${{ matrix.image.dockerfile }}
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: |
            type=gha,scope=${{ matrix.image.name }}
            type=registry,ref=ghcr.io/ironsail-llc/genus-os/${{ matrix.image.name }}:buildcache
          cache-to: |
            type=gha,scope=${{ matrix.image.name }},mode=max
            type=registry,ref=ghcr.io/ironsail-llc/genus-os/${{ matrix.image.name }}:buildcache,mode=max

      - name: Resolve primary tag
        id: primary
        env:
          META_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          # First tag in metadata-action output is the canonical/primary one.
          PRIMARY=$(printf '%s\n' "$META_TAGS" | head -n1)
          echo "ref=$PRIMARY" >> "$GITHUB_OUTPUT"
          echo "tag=${PRIMARY##*:}" >> "$GITHUB_OUTPUT"

      # Trivy does double duty: CVE scan + SPDX SBOM generation. Avoids a
      # second action (was anchore/sbom-action) that only ships floating v0
      # tags. Third-party action SHA-pinned + tag-commented.
      - name: Trivy — block on CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.primary.outputs.ref }}
          format: table
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Trivy — SARIF report (CRITICAL,HIGH)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.primary.outputs.ref }}
          format: sarif
          output: trivy-${{ matrix.image.name }}.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Trivy — SPDX SBOM
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.primary.outputs.ref }}
          format: spdx-json
          output: sbom-${{ matrix.image.name }}.spdx.json

      - name: Upload Trivy SARIF
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-${{ matrix.image.name }}-${{ steps.primary.outputs.tag }}
          path: trivy-${{ matrix.image.name }}.sarif
          retention-days: 30

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ matrix.image.name }}-${{ steps.primary.outputs.tag }}
          path: sbom-${{ matrix.image.name }}.spdx.json
          retention-days: 90

  # Production values remain on the previous known-good image while release
  # metadata is committed, images are built, and both blocking scans run.
  # Only this job makes the new release deployable.
  promote-production:
    name: Promote scanned production images
    needs: [release, build]
    if: |
      always()
      && needs.build.result == 'success'
      && needs.release.outputs.new_release_published == 'true'
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    outputs:
      promotion_commit: ${{ steps.promote.outputs.promotion_commit }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ssh-key: ${{ secrets.CI_USER_PRIVATE_KEY }}
          ref: main
          fetch-depth: 0

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify both release images exist
        env:
          VERSION: ${{ needs.release.outputs.new_release_version }}
        run: |
          docker buildx imagetools inspect "ghcr.io/ironsail-llc/genus-os/python:v${VERSION}" >/dev/null
          docker buildx imagetools inspect "ghcr.io/ironsail-llc/genus-os/app:v${VERSION}" >/dev/null

      - name: Promote release in GitOps values
        id: promote
        env:
          VERSION: ${{ needs.release.outputs.new_release_version }}
        run: |
          set -euo pipefail
          node scripts/promote-release-values.js "$VERSION"
          node scripts/check-version-consistency.js
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/genus-os/values-production.yaml helm/genus-os/values-staging.yaml
          if git diff --staged --quiet; then
            echo "Release v${VERSION} is already promoted; refusing an ambiguous no-op."
            exit 1
          fi
          git commit -m "chore(deploy): promote v${VERSION} [skip ci]"
          git push origin HEAD:main
          echo "promotion_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  comment-pr:
    name: Sticky PR comment
    needs: [build]
    if: |
      always()
      && needs.build.result == 'success'
      && github.event_name == 'pull_request'
      && contains(github.event.pull_request.labels.*.name, 'deploy-staging')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Compute short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      # Third-party action SHA-pinned + tag-commented.
      - uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0 # v3.0.4
        with:
          header: build-and-push
          message: |
            ### 🐳 Images built for staging

            | Image | Tag |
            |---|---|
            | `ghcr.io/ironsail-llc/genus-os/python` | `pr-${{ github.event.pull_request.number }}-sha-${{ steps.sha.outputs.short }}` |
            | `ghcr.io/ironsail-llc/genus-os/app` | `pr-${{ github.event.pull_request.number }}-sha-${{ steps.sha.outputs.short }}` |

            Deploy job is wired in Phase 4 once `helm/genus-os/` lands.
            For now the images are available in GHCR and tagged for this PR's HEAD.

  # ───────────────────────────────────────────────────────────────────────
  # Production: deploy only the GitOps promotion commit created after both
  # release images passed their blocking scans.
  # ───────────────────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy to production
    needs: [release, build, promote-production]
    if: |
      always()
      && needs.build.result == 'success'
      && needs.promote-production.result == 'success'
      && needs.release.outputs.new_release_published == 'true'
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ssh-key: ${{ secrets.CI_USER_PRIVATE_KEY }}
          ref: main
          fetch-depth: 0

      - name: Tailscale up (needed for private ArgoCD)
        uses: tailscale/github-action@6cae46e2d796f265265cfcf628b72a32b4d7cade # v3.3.0
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_CLIENT_SECRET }}
          tags: tag:github-ci

      - name: Install ArgoCD CLI
        run: |
          scripts/install-argocd-cli.sh "$RUNNER_TEMP/argocd"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Sync + wait for health
        env:
          ARGOCD_SERVER: ${{ vars.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_TOKEN }}
        run: |
          set -e
          argocd app terminate-op ironsail-production-genus-os --grpc-web || true
          argocd app sync ironsail-production-genus-os --grpc-web --retry-limit 2
          argocd app wait ironsail-production-genus-os --grpc-web --health --timeout 900

      - name: Smoke-test live and ready endpoints
        id: smoke
        continue-on-error: true
        env:
          GENUS_URL: ${{ vars.GENUS_PRODUCTION_URL || 'https://genus-os.internal.ironsail.ai' }}
        run: |
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 "$GENUS_URL/api/live"
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 "$GENUS_URL/api/ready"

      - name: Roll back a failed production smoke test
        if: steps.smoke.outcome == 'failure'
        env:
          ARGOCD_SERVER: ${{ vars.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_TOKEN }}
          PROMOTION_COMMIT: ${{ needs.promote-production.outputs.promotion_commit }}
          VERSION: ${{ needs.release.outputs.new_release_version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --ff-only origin main

          git_rollback=false
          if git revert --no-commit "$PROMOTION_COMMIT"; then
            git commit -m "revert(deploy): roll back v${VERSION} [skip ci]"
            if git push origin HEAD:main; then
              git_rollback=true
            fi
          else
            git revert --abort || true
          fi

          if [ "$git_rollback" = "true" ]; then
            argocd app sync ironsail-production-genus-os --grpc-web --retry-limit 2
          else
            echo "GitOps rollback failed; applying an emergency ArgoCD rollback." >&2
            argocd app rollback ironsail-production-genus-os --grpc-web
          fi
          argocd app wait ironsail-production-genus-os --grpc-web --health --timeout 900
          exit 1

  # ───────────────────────────────────────────────────────────────────────
  # Staging: label-driven. The deploy-staging label on a PR triggers an
  # image build (above) and then this job, which:
  #   1. Refuses if another open PR already owns staging (collision check
  #      via global.deployedFromPR in helm/genus-os/values-staging.yaml).
  #   2. Commits an imageTag bump on main with `[skip ci]`.
  #   3. Syncs the staging ArgoCD app.
  #   4. Posts the live staging URL in a sticky PR comment.
  #
  # On `unlabeled` / `closed` events the staging-reset job (below) walks
  # values-staging.yaml back to the latest released vX.Y.Z so staging
  # always tracks "latest released" when no PR holds the slot.
  # ───────────────────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to staging
    needs: [build]
    if: |
      always()
      && needs.build.result == 'success'
      && github.event_name == 'pull_request'
      && github.event.action != 'closed'
      && github.event.action != 'unlabeled'
      && contains(github.event.pull_request.labels.*.name, 'deploy-staging')
    runs-on: ubuntu-latest
    concurrency:
      group: staging-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ssh-key: ${{ secrets.CI_USER_PRIVATE_KEY }}
          ref: main
          fetch-depth: 0

      - name: Collision check
        id: collision
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          THIS_PR: ${{ github.event.pull_request.number }}
        run: |
          # Read the PR number currently occupying staging.
          CUR=$(yq '.global.deployedFromPR // ""' helm/genus-os/values-staging.yaml)
          if [ -z "$CUR" ] || [ "$CUR" = "null" ] || [ "$CUR" = "$THIS_PR" ]; then
            echo "free=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Another PR — is it still open AND still labeled?
          STATE=$(gh pr view "$CUR" --json state,labels -q '{state: .state, labels: [.labels[].name]}' 2>/dev/null || echo '{}')
          OPEN=$(echo "$STATE" | jq -r '.state == "OPEN"')
          LABELED=$(echo "$STATE" | jq -r '(.labels // []) | contains(["deploy-staging"])')
          if [ "$OPEN" = "true" ] && [ "$LABELED" = "true" ]; then
            echo "free=false" >> "$GITHUB_OUTPUT"
            echo "holder=$CUR" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Holder no longer holds — claim the slot.
          echo "free=true" >> "$GITHUB_OUTPUT"

      - name: Comment + fail on collision
        if: steps.collision.outputs.free != 'true'
        uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0 # v3.0.4
        with:
          header: deploy-staging
          message: |
            ❌ **Staging is occupied by #${{ steps.collision.outputs.holder }}.**

            Unlabel `deploy-staging` on #${{ steps.collision.outputs.holder }} (or wait for it to merge), then re-label this PR to retry.
      - name: Fail on collision
        if: steps.collision.outputs.free != 'true'
        run: exit 1

      - name: Bump values-staging.yaml
        env:
          PR_NUM: ${{ github.event.pull_request.number }}
          SHORT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -e
          SHA7="${SHORT_SHA:0:7}"
          TAG="pr-${PR_NUM}-sha-${SHA7}"
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          yq -i ".global.imageTag = \"$TAG\" |
                 .global.deployedFromPR = \"$PR_NUM\" |
                 .global.deployedAt = \"$NOW\"" helm/genus-os/values-staging.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/genus-os/values-staging.yaml
          if git diff --staged --quiet; then
            echo "no change — already at $TAG"
            exit 0
          fi
          git commit -m "chore(staging): deploy PR #${PR_NUM} (sha-${SHA7}) [skip ci]"
          git push origin main

      - name: Tailscale up
        uses: tailscale/github-action@6cae46e2d796f265265cfcf628b72a32b4d7cade # v3.3.0
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_CLIENT_SECRET }}
          tags: tag:github-ci

      - name: Install ArgoCD CLI
        run: |
          scripts/install-argocd-cli.sh "$RUNNER_TEMP/argocd"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Sync + wait for health
        env:
          ARGOCD_SERVER: ${{ vars.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_TOKEN }}
        run: |
          set -e
          argocd app terminate-op ironsail-staging-genus-os --grpc-web || true
          argocd app sync ironsail-staging-genus-os --grpc-web --retry-limit 2
          argocd app wait ironsail-staging-genus-os --grpc-web --health --timeout 900

      - name: Sticky deploy-success comment
        uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0 # v3.0.4
        with:
          header: deploy-staging
          message: |
            ✅ **Deployed to staging.**

            - Image: `ghcr.io/ironsail-llc/genus-os/python:pr-${{ github.event.pull_request.number }}-sha-${{ github.event.pull_request.head.sha }}`
            - URL: <https://genus-os.staging.internal.ironsail.ai>

            Release the slot by removing the `deploy-staging` label or merging this PR — staging will reset to the latest released `vX.Y.Z`.

  # ───────────────────────────────────────────────────────────────────────
  # Staging reset: PR closed (merged or not) OR `deploy-staging` label
  # removed — if this PR currently holds staging, walk values-staging.yaml
  # back to the latest released vX.Y.Z and sync.
  # ───────────────────────────────────────────────────────────────────────
  staging-reset:
    name: Reset staging to latest release
    if: |
      github.event_name == 'pull_request'
      && ( github.event.action == 'closed'
           || (github.event.action == 'unlabeled' && github.event.label.name == 'deploy-staging') )
    runs-on: ubuntu-latest
    concurrency:
      group: staging-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ssh-key: ${{ secrets.CI_USER_PRIVATE_KEY }}
          ref: main
          fetch-depth: 0

      - name: Bump values-staging.yaml to latest release
        id: bump
        env:
          THIS_PR: ${{ github.event.pull_request.number }}
        run: |
          set -e
          CUR=$(yq '.global.deployedFromPR // ""' helm/genus-os/values-staging.yaml)
          if [ "$CUR" != "$THIS_PR" ]; then
            echo "Staging is held by PR=$CUR (not this one, $THIS_PR) — leaving alone."
            echo "synced=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Latest semver tag.
          LATEST=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          if [ -z "$LATEST" ]; then
            echo "No released vX.Y.Z yet — staging will sit on the previous tag until a release lands."
            echo "synced=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          yq -i ".global.imageTag = \"$LATEST\" |
                 .global.deployedFromPR = \"\" |
                 .global.deployedAt = \"\"" helm/genus-os/values-staging.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/genus-os/values-staging.yaml
          if git diff --staged --quiet; then
            echo "synced=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(staging): reset to ${LATEST} [skip ci]"
          git push origin main
          echo "synced=true" >> "$GITHUB_OUTPUT"

      # Everything below runs ONLY when the bump actually committed a change,
      # i.e. this PR was the one currently holding staging. PRs that never
      # held staging short-circuit at the step above with no work — no
      # Tailscale, no argocd, no sticky comment noise.
      - name: Tailscale up
        if: steps.bump.outputs.synced == 'true'
        uses: tailscale/github-action@6cae46e2d796f265265cfcf628b72a32b4d7cade # v3.3.0
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_CLIENT_SECRET }}
          tags: tag:github-ci

      - name: Install ArgoCD CLI
        if: steps.bump.outputs.synced == 'true'
        run: |
          scripts/install-argocd-cli.sh "$RUNNER_TEMP/argocd"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Sync staging
        if: steps.bump.outputs.synced == 'true'
        env:
          ARGOCD_SERVER: ${{ vars.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_TOKEN }}
        run: |
          argocd app sync ironsail-staging-genus-os --grpc-web --retry-limit 2 || true
          argocd app wait ironsail-staging-genus-os --grpc-web --health --timeout 900 || true

      - name: Sticky released-the-slot comment
        if: steps.bump.outputs.synced == 'true'
        uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0 # v3.0.4
        with:
          header: deploy-staging
          message: |
            🔁 **Staging released.** Reset to the latest released version.
