name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar xz
          sudo mv gitleaks /usr/local/bin/
      - name: Run gitleaks
        run: gitleaks detect --source . --verbose
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install --upgrade pip
      - run: pip install pip-audit
      - run: pip install -e ".[api]"
      # CVE-2026-3219 is a pip self-CVE with no fix released; ignore until
      # upstream ships a patched version. CVE-2026-6357 is resolved by the
      # pip upgrade above.
      # PYSEC-2025-183 (CVE-2025-45768): disputed-by-maintainer, CVSS 3.1
      # pyjwt advisory about caller-chosen key length — no library fix exists
      # (affects all versions incl. latest 2.12.1). pyjwt is transitive via
      # litellm + redis; we never call it directly (no `import jwt`). Tracked
      # as Not Affected in SECURITY.md. Revisit if we add direct pyjwt usage.
      # CVE-2026-34993 / CVE-2026-47265: aiohttp advisories (CookieJar.load
      # deserialization; per-request `cookies=` leak across cross-origin
      # redirects), both fixed in aiohttp 3.14.0. We cannot upgrade — aiogram
      # hard-caps aiohttp <3.14 in every release (incl. latest 3.28.2). We are
      # Not Affected: no `CookieJar.load()` anywhere, and our sole direct
      # aiohttp call posts JSON to an operator-configured URL with no `cookies=`
      # param. Tracked as Not Affected in SECURITY.md. Revisit when aiogram
      # lifts its aiohttp <3.14 cap.
      - run: pip-audit --ignore-vuln CVE-2026-3219 --ignore-vuln PYSEC-2025-183 --ignore-vuln CVE-2026-34993 --ignore-vuln CVE-2026-47265

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check robothor/
      - run: ruff format --check robothor/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -e ".[dev,api,vision]" opencv-python-headless types-requests
      - run: mypy robothor/ --ignore-missing-imports

  validate-agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python scripts/validate_agents.py --ci

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - run: pip install -e ".[dev,api,vision]" opencv-python-headless
      - run: pytest tests/ robothor/engine/tests/ robothor/crm/tests/ -m "not integration and not llm and not slow and not e2e" -v

  test-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -e ".[dev,api]"
      - run: pip install -r crm/bridge/requirements.txt
      - run: >-
          pytest
          crm/bridge/tests/test_task_coordination.py
          crm/bridge/tests/test_multi_tenancy.py
          crm/bridge/tests/test_agent_status.py
          crm/bridge/tests/test_answer_endpoint.py
          -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v6
      # Third-party action SHA-pinned + tag-commented.
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: npx tsc --noEmit
      - run: pnpm test
