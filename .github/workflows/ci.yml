name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded runs on a pull request — a new push makes the old one
  # irrelevant. Never on main: every commit there is permanently in history and
  # has to stay verified. Two merges landing seconds apart used to cancel the
  # earlier commit's run, leaving it unverified with nothing to say so — and the
  # release gate now asserts this workflow's conclusion for the commit being
  # released, so a cancelled run would block a release over code that is fine.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - name: Verify immutable workflow action pins
        run: python3 scripts/check_workflow_action_pins.py
      - name: Install gitleaks
        run: |
          curl --fail --show-error --location --output gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          echo "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  gitleaks.tar.gz" \
            | sha256sum --check --strict
          tar --extract --gzip --file gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: Run gitleaks
        run: gitleaks detect --source . --verbose
      # Instance-data gate (CLAUDE.md rule #1). It had been a pre-commit hook
      # only, which `git commit --no-verify` skips and a web/API commit never
      # runs at all — and its allowlist had quietly exempted the operator's own
      # workspace path since 2026-05, so it passed a real leak in PR #346.
      # Scans the PR's changed files: the same set the hook sees, so local and
      # CI agree. A whole-tree scan is `--all` and is deliberately NOT wired
      # here — the tree carries pre-existing warnings (mostly test-fixture
      # emails) that would make this red on day one and disabled within a week.
      - name: Check for instance data in changed files
        run: python3 scripts/check_instance_leak.py --ci
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: package-lock.json
      # npm audit gate: named-allowlist policy, not a blanket exception. A
      # high/critical advisory must either be absent or have its GHSA id
      # explicitly tracked -- id, package, and a reviewed reason -- in
      # .npm-audit-allowlist.json (see scripts/check_npm_audit.py). Any
      # advisory NOT named in that tracked file still fails the gate,
      # including new advisories in an already-allowlisted package.
      - name: Audit release-tooling lock
        run: |
          npm audit --package-lock-only --audit-level=high --json > /tmp/npm-audit.json || true
          python3 scripts/check_npm_audit.py /tmp/npm-audit.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install --upgrade pip
      - run: pip install pip-audit==2.10.1
      # Audit the set the image ships (Dockerfile.python: `uv export --frozen
      # --extra api --extra federation`), not a fresh resolution. `pip install
      # -e ".[api]"` re-resolved litellm to the newest allowed release, whose
      # `filelock<4` pin dragged filelock down to a version carrying three
      # advisories the locked set (filelock 4.x) does not ship. That failed
      # this job on every branch with no commit touching the repo.
      - name: Install the locked runtime set
        run: |
          pip install uv==0.13.4
          uv export --frozen --no-emit-project --no-hashes \
            --extra api --extra federation \
            --output-file /tmp/requirements.txt
          uv pip install --system -r /tmp/requirements.txt
          uv pip install --system --no-deps -e .
      # No standing advisory exceptions: a newly reported dependency issue
      # must fail the gate and receive an explicit, reviewed remediation.
      - run: pip-audit
      # Documentation gates, siblings of the instance-data gate above. Two
      # things fix their position in this job. They need the package
      # importable -- check_doc_commands parses each quoted command with the
      # REAL `robothor.cli` parser -- which rules out sitting next to the leak
      # check, run on bare python3 before the install. And they go AFTER
      # pip-audit, so a typo in a doc cannot stop this run from reporting a
      # dependency advisory: the cheaper signal must never mask the graver one.
      #
      # The published Getting Started opened with `pip install robothor` (a
      # package that does not exist; the distribution is `genusos`) and the
      # Reading Guide sent readers into the gitignored `brain/` tree. Nothing
      # failed, because no gate had ever parsed a command or resolved a path
      # printed in the docs.
      - name: Check every command quoted in the docs parses
        run: python scripts/check_doc_commands.py
      - name: Check every path referenced in the docs exists
        run: python scripts/check_doc_links.py

  # Release notes, not a commit list. `CHANGELOG.md` keeps answering the
  # developer's question; this job makes the author answer the reader's, once,
  # in the pull request that ships the change. Stdlib only and no install: the
  # fragment tool and the link gate it borrows both run on a bare python3.
  changelog-fragment:
    name: Release-note fragment
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Every fragment in the tree will ship
        run: python3 scripts/changelog_fragments.py lint
      # A feat/fix/perf (or breaking) title ships something a reader can
      # notice. The escape hatch is the `no-changelog` label, which is a
      # decision somebody made, not a silence.
      - name: This pull request says what changed, and for whom
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: >-
          python3 scripts/changelog_fragments.py check
          --pr "$PR_NUMBER" --title "$PR_TITLE" --labels "$PR_LABELS"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: pip install ruff==0.15.2
      # bench/ and scripts/ were outside the gate, and scripts/ had quietly
      # drifted to 4 lint errors and 5 unformatted files. The benchmark
      # harness decides the project's competitive numbers and scripts/ holds
      # the backup and release machinery — neither is less load-bearing than
      # the package.
      # crm/bridge/ is included deliberately: the release gate used to be the
      # only thing linting it, and this job is now lint's single home.
      - run: ruff check robothor/ bench/ scripts/ crm/bridge/
      - run: ruff format --check robothor/ bench/ scripts/ crm/bridge/
      # The shell in scripts/ is release and backup machinery, and the
      # installer in particular is piped straight into bash from a URL. It was
      # outside every gate: ruff cannot read shell, and nothing else looked.
      # Pinned and checksummed, like every other tool this repository's gates
      # download. An unpinned `apt-get install` in a lint gate is a rule set
      # nobody pinned: the findings change under you with the runner image.
      - name: Install shellcheck
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          archive="$RUNNER_TEMP/shellcheck.tar.xz"
          curl --fail --show-error --location --output "$archive" \
            https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz
          echo "6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87  $archive" \
            | sha256sum --check --strict
          tar --extract --xz --file "$archive" --directory "$RUNNER_TEMP/bin" \
            --strip-components=1 shellcheck-v0.10.0/shellcheck
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/shellcheck" --version
      - run: shellcheck --severity=warning scripts/*.sh

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -e ".[dev,api,vision]" opencv-python-headless types-requests
      - run: mypy robothor/ --ignore-missing-imports
      # bench/ decides every competitive number this project publishes about
      # itself and was never typechecked. Production code only: its tests are
      # 192 untyped-def errors of pure noise, and a gate that reports noise
      # gets disabled within a week.
      - run: mypy bench/wildclaw --ignore-missing-imports --exclude 'tests/'
      - run: mypy bench/turn --ignore-missing-imports --exclude 'tests/'

  validate-agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python scripts/validate_agents.py --ci

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      # Install the set uv.lock pins — the same resolution Dockerfile.python
      # ships. `pip install -e` re-resolves on every run, so an upstream release
      # can turn this job red with no commit touching the repo. That is what
      # happened: litellm drifted 1.92.2 (locked) -> 1.106.2 (resolved), which
      # both reorganized its model catalog (breaking the registry-drift test
      # against values that still match the shipped version) and added a proxy
      # MCP module importing `mcp.types` unconditionally, so every provider call
      # raised APIConnectionError. Testing the locked set means CI exercises
      # what production runs.
      - name: Install the locked dependency set
        run: |
          # 0.13.4, not an older pin: `pip install uv` puts uv in the same
          # environment the gate's pip-audit step later scans, so uv's own
          # version has to be non-vulnerable (0.11.21 carries
          # PYSEC-2026-4321). Verified that 0.13.4 reads this lock and exports
          # byte-identically to the version the pins were generated with.
          pip install uv==0.13.4
          # --output-file, not a shell redirect: uv colorizes the comment
          # lines it writes, and the ANSI escapes make `uv pip install -r`
          # fail with "Unexpected '', expected ... the start of a requirement".
          uv export --frozen --no-emit-project --no-hashes \
            --extra dev --extra api --extra vision --extra tui \
            --output-file /tmp/requirements.txt
          # opencv-python-headless is not a declared dependency — it is the
          # headless wheel CI needs in place of the GUI one `vision` pulls — so
          # it is resolved TOGETHER with the pins. Installed as a separate step
          # it dragged numpy to 2.5.x, past the deliberate `numpy<2` constraint
          # for Python < 3.13, which broke mypy: numpy 2 stubs use PEP 695
          # `type` statements and mypy rejects those at the configured
          # python_version = 3.11. Resolved jointly, the pin holds numpy at
          # 1.26.4 and opencv lands on 4.11.0.86.
          uv pip install --system -r /tmp/requirements.txt opencv-python-headless
          # The project itself, without re-resolving what the lock just pinned.
          uv pip install --system --no-deps -e .
      - name: Run the complete Python unit suite
        run: >-
          pytest tests/ robothor/
          -m "not integration and not llm and not slow and not e2e"
          --cov=robothor
          --cov-report=term-missing:skip-covered
          --cov-fail-under=60
          -v

  test-autonomy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: autonomy
          POSTGRES_PASSWORD: autonomy
          POSTGRES_DB: autonomy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AUTONOMY_TEST_DSN: "host=127.0.0.1 port=5432 user=autonomy password=autonomy dbname=autonomy_test"
      ROBOTHOR_DB_HOST: 127.0.0.1
      ROBOTHOR_DB_PORT: "5432"
      ROBOTHOR_DB_NAME: autonomy_test
      ROBOTHOR_DB_USER: autonomy
      ROBOTHOR_DB_PASSWORD: autonomy
      ROBOTHOR_WORKSPACE: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -e ".[dev,api,autonomy]"
      - run: python -m playwright install --with-deps chromium
      - name: Allow sandboxed Chromium in the disposable hosted runner
        # Ubuntu's downloaded-executable policy otherwise blocks Chromium's
        # own sandbox. This changes only the ephemeral GitHub VM, never a host
        # install or deployment. The browser itself keeps its sandbox enabled.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: pytest robothor/autonomy/tests/ robothor/engine/tests/test_browser_resources.py -q

  test-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -e ".[dev,api]"
      - run: pip install -r crm/bridge/requirements.txt
      - run: pytest crm/bridge/tests/ -m "not integration and not slow and not e2e" -v

  test-integration:
    # Real-PostgreSQL integration lane. Kept out of the default unit matrix,
    # but every integration contract is release-blocking here.
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector image (Postgres 16 + the `vector` extension): infra/001_init.sql
        # runs in a single BEGIN/COMMIT and does `CREATE EXTENSION vector`, so a
        # stock postgres:16 would abort the whole init transaction. pgcrypto and
        # uuid-ossp ship in contrib, already present in this image.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: robothor
          POSTGRES_PASSWORD: robothor
          POSTGRES_DB: robothor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: robothor
      ROBOTHOR_TEST_DB_DSN: "dbname=robothor_test user=robothor password=robothor host=localhost port=5432"
      # Admin DSN for fixtures that create scratch databases (scratch_db, rls_db).
      ROBOTHOR_TEST_ADMIN_DSN: "dbname=postgres user=robothor password=robothor host=localhost port=5432"
      ROBOTHOR_DB_HOST: 127.0.0.1
      ROBOTHOR_DB_PORT: "5432"
      ROBOTHOR_DB_NAME: robothor_test
      ROBOTHOR_DB_USER: robothor
      ROBOTHOR_DB_PASSWORD: robothor
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -e ".[dev,api]"
      - name: Apply schema to the test database
        run: python -m robothor.cli migrate
      - name: Verify canonical migration ledger and required schema
        run: |
          python -m robothor.cli migrate --check
          psql "$ROBOTHOR_TEST_DB_DSN" -tAc \
            "SELECT 1 FROM information_schema.columns WHERE table_name='crm_tasks' AND column_name='question_resolved_at'" \
            | grep -q 1
          psql "$ROBOTHOR_TEST_DB_DSN" -tAc \
            "SELECT 1 FROM information_schema.tables WHERE table_name IN ('crm_task_history','crm_agent_notifications') HAVING count(*)=2" \
            | grep -q 1
      # Collect the whole tree, not just tests/integration/. The unit lane runs
      # `-m "not integration"` and this lane used to run only one directory, so
      # every integration-marked test living elsewhere was excluded by marker
      # from one and by path from the other — 234 tests across 26 files that
      # had never executed in CI, including tests/test_tenant_rls.py, the file
      # that certifies tenant isolation actually isolates.
      #
      # `crm/` is listed explicitly because the first pass at this fix said
      # "the whole tree" and then named two directories, which left the five
      # integration tests under crm/bridge/tests/ still running nowhere: the
      # unit lane deselects them by marker (ci.yml above) and this lane missed
      # them by path. They pass — they had simply never been executed.
      # crm/bridge/tests needs its own invocation: its conftest registers a
      # plugin that collides when collected alongside the rest of the tree.
      # "not llm": llm-marked integration tests need a live local model
      # runtime (Ollama) that CI does not have; they run on-box via the
      # nightly eval/benchmark timers instead.
      - run: pytest tests/ robothor/ -m "integration and not llm" -v
      - run: pytest crm/ -m "integration and not llm" -v

  bench-turn:
    # Per-turn latency (bench/turn/README.md). Its unit tests run on every
    # push. The benchmark itself runs on pull requests that touch
    # robothor/engine/ (and on a manual dispatch): the Telegram-shaped
    # in-process half, 20 runner.execute turns against real Postgres (with
    # pg_stat_statements preloaded, for statements per turn), Redis and the
    # mock model. A whole compose stack per pull request is too heavy, so the
    # webchat HTTP half runs nightly in install-gate.yml's compose job instead.
    # The comparison is against bench/turn/baselines/ci-inprocess.json, which
    # must be recorded on this runner class, not on a laptop.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ROBOTHOR_DB_HOST: 127.0.0.1
      ROBOTHOR_DB_PORT: "5432"
      ROBOTHOR_DB_NAME: robothor_test
      ROBOTHOR_DB_USER: robothor
      ROBOTHOR_DB_PASSWORD: robothor
      ROBOTHOR_REDIS_HOST: 127.0.0.1
      ROBOTHOR_REDIS_PORT: "6379"
      ROBOTHOR_OLLAMA_URL: http://127.0.0.1:11434
      OLLAMA_API_BASE: http://127.0.0.1:11434
      OPENROUTER_API_BASE: http://127.0.0.1:11434/v1
      OPENROUTER_API_KEY: mock-llm-not-a-key
      BENCH_MODEL: openrouter/deepseek/deepseek-v4-pro
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -e ".[dev,api]"
      - name: Unit-test the benchmark's parsers and comparison
        run: pytest bench/turn/tests -q
      - name: Decide whether this change touches the engine
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "pull_request" ] \
              && git diff --name-only "origin/${BASE_REF}...HEAD" | grep -q '^robothor/engine/'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "no robothor/engine/ change: the benchmark is skipped"
          fi
      # Not a `services:` container: those cannot take a command, and
      # pg_stat_statements only works when the server preloads it.
      - name: Start Postgres with pg_stat_statements preloaded
        if: steps.scope.outputs.run == 'true'
        run: |
          docker run -d --name bench-postgres -p 5432:5432 \
            -e POSTGRES_USER=robothor -e POSTGRES_PASSWORD=robothor -e POSTGRES_DB=robothor_test \
            pgvector/pgvector:pg16 postgres -c shared_preload_libraries=pg_stat_statements
          for _ in $(seq 1 60); do
            docker exec bench-postgres pg_isready -U robothor -d robothor_test >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec bench-postgres pg_isready -U robothor -d robothor_test
      - name: Start the mock model server
        if: steps.scope.outputs.run == 'true'
        run: |
          python -m tests.acceptance.mock_llm --host 127.0.0.1 --port 11434 \
            > "$RUNNER_TEMP/mock.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
      - name: Schema and a minimal instance
        if: steps.scope.outputs.run == 'true'
        run: |
          python -m robothor.cli migrate
          echo "ROBOTHOR_WORKSPACE=$RUNNER_TEMP/workspace" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/workspace/.robothor"
          cp templates/owner.yaml.example "$RUNNER_TEMP/workspace/.robothor/owner.yaml"
          echo "ROBOTHOR_OWNER_CONFIG=$RUNNER_TEMP/workspace/.robothor/owner.yaml" >> "$GITHUB_ENV"
          ROBOTHOR_WORKSPACE="$RUNNER_TEMP/workspace" \
            python -m robothor.cli agent install --preset minimal --yes
      - name: Benchmark Telegram-shaped turns and compare with the baseline
        if: steps.scope.outputs.run == 'true'
        run: |
          # pipefail: without it the step takes tee's 0, and neither a
          # regression (exit 1) nor a failed turn (exit 2) fails the job.
          set -o pipefail
          # --baseline-set ci: timings regress past 30% and 5 ms (shared
          # runners spread ~20% run to run), db_statements past 10%, and
          # prompt_tokens and tool_schemas on any increase.
          python -m bench.turn --half inprocess --runs 20 --model "$BENCH_MODEL" \
            --min-delta 5 --baseline-set ci \
            --out "$RUNNER_TEMP/bench-turn-inprocess.json" 2>&1 \
            | tee "$RUNNER_TEMP/bench-turn.txt"
      - if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-turn
          path: |
            ${{ runner.temp }}/bench-turn*
            ${{ runner.temp }}/mock.log
          if-no-files-found: ignore

  wheel-smoke:
    # Builds the Python distribution and installs it into a throwaway venv,
    # the way an end user (or a later distribution PR) actually would. This
    # is the first place in CI anything builds a wheel at all — later
    # distribution-train PRs extend this job rather than re-deriving it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: Install the wheel into a fresh venv
        run: |
          python -m venv /tmp/wheel-smoke-venv
          /tmp/wheel-smoke-venv/bin/pip install dist/*.whl
      - name: Smoke the installed console scripts and package import
        run: |
          # `genus` is the documented verb; `genusos` and `robothor` are the
          # aliases we still ship. All three must exist in the wheel, so all
          # three are exercised here.
          /tmp/wheel-smoke-venv/bin/genus version
          /tmp/wheel-smoke-venv/bin/genus --help
          /tmp/wheel-smoke-venv/bin/genusos version
          /tmp/wheel-smoke-venv/bin/robothor --help
          /tmp/wheel-smoke-venv/bin/python -c "import robothor"
      - name: Verify the init scaffold shipped in the wheel
        run: |
          python -m zipfile -l dist/*.whl | grep -q "robothor/templates/bundled_scaffold/SOUL.md"
          count=$(python -m zipfile -l dist/*.whl | grep -c "robothor/templates/bundled_scaffold/")
          echo "bundled_scaffold entries in wheel: $count"
          test "$count" -ge 90
      - name: Scaffold a workspace from the installed wheel
        # Runs create_workspace() against the wheel install (cwd moved off the
        # checkout so resolution cannot fall back to the repo's templates/)
        # and asserts the scaffold actually lands.
        working-directory: /tmp
        env:
          ROBOTHOR_WORKSPACE: /tmp/wheel-smoke-workspace
        run: |
          /tmp/wheel-smoke-venv/bin/python - <<'EOF'
          import os
          from pathlib import Path

          from robothor.setup import EXPECTED_SCAFFOLD_FILES, _find_template_dir, create_workspace

          workspace = Path(os.environ["ROBOTHOR_WORKSPACE"])
          template_dir = _find_template_dir()
          assert template_dir is not None, "no scaffold resolved from the wheel install"
          assert template_dir.name == "bundled_scaffold", f"resolved {template_dir}"
          create_workspace(workspace)
          scaffolded = [p for p in workspace.rglob("*") if p.is_file()]
          expected = len(EXPECTED_SCAFFOLD_FILES)
          assert len(scaffolded) >= expected, (
              f"{len(scaffolded)} files scaffolded, expected >= {expected}: "
              f"{sorted(str(p.relative_to(workspace)) for p in scaffolded)}"
          )
          for rel in ("CLAUDE.md", "AGENT_BUILDER.md", "brain/SOUL.md", "brain/CLAUDE.md"):
              assert (workspace / rel).is_file(), f"scaffold missing {rel}"
          print(f"scaffolded {len(scaffolded)} files from {template_dir}")
          EOF
      - name: Verify the agent catalog resolves from the installed wheel
        # `robothor agent install --preset standard` is the literal next
        # step `robothor init` prints, and it's a no-op unless the catalog
        # (departments + presets + on-disk template bundles) resolves from
        # the wheel install, not just the scaffold files checked above.
        working-directory: /tmp
        run: |
          output=$(/tmp/wheel-smoke-venv/bin/robothor agent catalog)
          echo "$output"
          echo "$output" | grep -q "^Presets:" || {
            echo "::error::robothor agent catalog printed no Presets section"
            exit 1
          }
          echo "$output" | grep -qE '^\s+standard\s' || {
            echo "::error::the standard preset is missing from the installed wheel's catalog"
            exit 1
          }
          echo "$output" | grep -q "^Templates on disk: " || {
            echo "::error::no template bundles resolved on disk from the installed wheel"
            exit 1
          }
          echo "$output" | grep -q "No template bundles found on disk." && {
            echo "::error::catalog resolved but found zero template bundles"
            exit 1
          }
          echo "$output" | grep -qE '^\s+main\s+dept=core' || {
            echo "::error::the main agent template is missing from the installed wheel's catalog"
            exit 1
          }
      # Regression tripwire: crm/migrations/*delphi*.sql are gitignored
      # instance files (see .gitignore) that must never ship in the wheel.
      # They're absent on CI's clean clone today, so this passes now -- it
      # exists to catch a future local build or packaging-exclude change
      # that accidentally pulls them back in.
      - name: Verify no delphi instance files leaked into the wheel
        run: |
          if python -m zipfile -l dist/*.whl | grep -i delphi; then
            echo "::error::delphi instance files leaked into the wheel"
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      # Third-party action SHA-pinned + tag-commented.
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10.34.5
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # The legacy npm audit endpoints (/-/npm/v1/security/audits and /audits/quick)
      # were retired 2026-07 and now return HTTP 410 Gone, so `pnpm audit` (pnpm 10.x
      # still queries them) fails unconditionally on every run — a hard-red on a dead
      # endpoint, not a real finding. Keep it visible but non-blocking until we move
      # to a working advisory source (bulk endpoint / osv-scanner / Renovate). This is
      # a dependency-scan gap tracked as a follow-up, NOT a silent pass: the step still
      # runs and surfaces its output; it just no longer blocks merges on the outage.
      - run: pnpm audit --audit-level=high
        continue-on-error: true
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test
