name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - name: Verify immutable workflow action pins
        run: python3 scripts/check_workflow_action_pins.py
      - name: Install gitleaks
        run: |
          curl --fail --show-error --location --output gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          echo "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  gitleaks.tar.gz" \
            | sha256sum --check --strict
          tar --extract --gzip --file gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: Run gitleaks
        run: gitleaks detect --source . --verbose
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: package-lock.json
      # npm audit gate: named-allowlist policy, not a blanket exception. A
      # high/critical advisory must either be absent or have its GHSA id
      # explicitly tracked -- id, package, and a reviewed reason -- in
      # .npm-audit-allowlist.json (see scripts/check_npm_audit.py). Any
      # advisory NOT named in that tracked file still fails the gate,
      # including new advisories in an already-allowlisted package.
      - name: Audit release-tooling lock
        run: |
          npm audit --package-lock-only --audit-level=high --json > /tmp/npm-audit.json || true
          python3 scripts/check_npm_audit.py /tmp/npm-audit.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install --upgrade pip
      - run: pip install pip-audit==2.10.1
      - run: pip install -e ".[api]"
      # No standing advisory exceptions: a newly reported dependency issue
      # must fail the gate and receive an explicit, reviewed remediation.
      - run: pip-audit

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: pip install ruff==0.15.2
      - run: ruff check robothor/
      - run: ruff format --check robothor/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -e ".[dev,api,vision]" opencv-python-headless types-requests
      - run: mypy robothor/ --ignore-missing-imports

  validate-agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python scripts/validate_agents.py --ci

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - run: pip install -e ".[dev,api,vision,tui]" opencv-python-headless
      - name: Run the complete Python unit suite
        run: >-
          pytest tests/ robothor/
          -m "not integration and not llm and not slow and not e2e"
          --cov=robothor
          --cov-report=term-missing:skip-covered
          --cov-fail-under=60
          -v

  test-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -e ".[dev,api]"
      - run: pip install -r crm/bridge/requirements.txt
      - run: pytest crm/bridge/tests/ -m "not integration and not slow and not e2e" -v

  test-integration:
    # Real-PostgreSQL integration lane. Kept out of the default unit matrix,
    # but every integration contract is release-blocking here.
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector image (Postgres 16 + the `vector` extension): infra/001_init.sql
        # runs in a single BEGIN/COMMIT and does `CREATE EXTENSION vector`, so a
        # stock postgres:16 would abort the whole init transaction. pgcrypto and
        # uuid-ossp ship in contrib, already present in this image.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: robothor
          POSTGRES_PASSWORD: robothor
          POSTGRES_DB: robothor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: robothor
      ROBOTHOR_TEST_DB_DSN: "dbname=robothor_test user=robothor password=robothor host=localhost port=5432"
      # Admin DSN for fixtures that create scratch databases (scratch_db, rls_db).
      ROBOTHOR_TEST_ADMIN_DSN: "dbname=postgres user=robothor password=robothor host=localhost port=5432"
      ROBOTHOR_DB_HOST: 127.0.0.1
      ROBOTHOR_DB_PORT: "5432"
      ROBOTHOR_DB_NAME: robothor_test
      ROBOTHOR_DB_USER: robothor
      ROBOTHOR_DB_PASSWORD: robothor
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -e ".[dev,api]"
      - name: Apply schema to the test database
        run: python -m robothor.cli migrate
      - name: Verify canonical migration ledger and required schema
        run: |
          python -m robothor.cli migrate --check
          psql "$ROBOTHOR_TEST_DB_DSN" -tAc \
            "SELECT 1 FROM information_schema.columns WHERE table_name='crm_tasks' AND column_name='question_resolved_at'" \
            | grep -q 1
          psql "$ROBOTHOR_TEST_DB_DSN" -tAc \
            "SELECT 1 FROM information_schema.tables WHERE table_name IN ('crm_task_history','crm_agent_notifications') HAVING count(*)=2" \
            | grep -q 1
      # Collect the whole tree, not just tests/integration/. The unit lane runs
      # `-m "not integration"` and this lane used to run only one directory, so
      # every integration-marked test living elsewhere was excluded by marker
      # from one and by path from the other — 234 tests across 26 files that
      # had never executed in CI, including tests/test_tenant_rls.py, the file
      # that certifies tenant isolation actually isolates.
      #
      # `crm/` is listed explicitly because the first pass at this fix said
      # "the whole tree" and then named two directories, which left the five
      # integration tests under crm/bridge/tests/ still running nowhere: the
      # unit lane deselects them by marker (ci.yml above) and this lane missed
      # them by path. They pass — they had simply never been executed.
      # crm/bridge/tests needs its own invocation: its conftest registers a
      # plugin that collides when collected alongside the rest of the tree.
      # "not llm": llm-marked integration tests need a live local model
      # runtime (Ollama) that CI does not have; they run on-box via the
      # nightly eval/benchmark timers instead.
      - run: pytest tests/ robothor/ -m "integration and not llm" -v
      - run: pytest crm/ -m "integration and not llm" -v

  wheel-smoke:
    # Builds the Python distribution and installs it into a throwaway venv,
    # the way an end user (or a later distribution PR) actually would. This
    # is the first place in CI anything builds a wheel at all — later
    # distribution-train PRs extend this job rather than re-deriving it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: Install the wheel into a fresh venv
        run: |
          python -m venv /tmp/wheel-smoke-venv
          /tmp/wheel-smoke-venv/bin/pip install dist/*.whl
      - name: Smoke the installed console scripts and package import
        run: |
          /tmp/wheel-smoke-venv/bin/genusos version
          /tmp/wheel-smoke-venv/bin/robothor --help
          /tmp/wheel-smoke-venv/bin/python -c "import robothor"
      - name: Verify the init scaffold shipped in the wheel
        run: |
          python -m zipfile -l dist/*.whl | grep -q "robothor/templates/bundled_scaffold/SOUL.md"
          count=$(python -m zipfile -l dist/*.whl | grep -c "robothor/templates/bundled_scaffold/")
          echo "bundled_scaffold entries in wheel: $count"
          test "$count" -ge 90
      - name: Scaffold a workspace from the installed wheel
        # Runs create_workspace() against the wheel install (cwd moved off the
        # checkout so resolution cannot fall back to the repo's templates/)
        # and asserts the scaffold actually lands.
        working-directory: /tmp
        env:
          ROBOTHOR_WORKSPACE: /tmp/wheel-smoke-workspace
        run: |
          /tmp/wheel-smoke-venv/bin/python - <<'EOF'
          import os
          from pathlib import Path

          from robothor.setup import EXPECTED_SCAFFOLD_FILES, _find_template_dir, create_workspace

          workspace = Path(os.environ["ROBOTHOR_WORKSPACE"])
          template_dir = _find_template_dir()
          assert template_dir is not None, "no scaffold resolved from the wheel install"
          assert template_dir.name == "bundled_scaffold", f"resolved {template_dir}"
          create_workspace(workspace)
          scaffolded = [p for p in workspace.rglob("*") if p.is_file()]
          expected = len(EXPECTED_SCAFFOLD_FILES)
          assert len(scaffolded) >= expected, (
              f"{len(scaffolded)} files scaffolded, expected >= {expected}: "
              f"{sorted(str(p.relative_to(workspace)) for p in scaffolded)}"
          )
          for rel in ("CLAUDE.md", "AGENT_BUILDER.md", "brain/SOUL.md", "brain/CLAUDE.md"):
              assert (workspace / rel).is_file(), f"scaffold missing {rel}"
          print(f"scaffolded {len(scaffolded)} files from {template_dir}")
          EOF
      # Regression tripwire: crm/migrations/*delphi*.sql are gitignored
      # instance files (see .gitignore) that must never ship in the wheel.
      # They're absent on CI's clean clone today, so this passes now -- it
      # exists to catch a future local build or packaging-exclude change
      # that accidentally pulls them back in.
      - name: Verify no delphi instance files leaked into the wheel
        run: |
          if python -m zipfile -l dist/*.whl | grep -i delphi; then
            echo "::error::delphi instance files leaked into the wheel"
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      # Third-party action SHA-pinned + tag-commented.
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10.34.5
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # The legacy npm audit endpoints (/-/npm/v1/security/audits and /audits/quick)
      # were retired 2026-07 and now return HTTP 410 Gone, so `pnpm audit` (pnpm 10.x
      # still queries them) fails unconditionally on every run — a hard-red on a dead
      # endpoint, not a real finding. Keep it visible but non-blocking until we move
      # to a working advisory source (bulk endpoint / osv-scanner / Renovate). This is
      # a dependency-scan gap tracked as a follow-up, NOT a silent pass: the step still
      # runs and surfaces its output; it just no longer blocks merges on the outage.
      - run: pnpm audit --audit-level=high
        continue-on-error: true
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test
