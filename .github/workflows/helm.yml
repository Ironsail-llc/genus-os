name: Helm

on:
  push:
    branches: [main]
    # Every release tag, and deliberately WITHOUT a paths filter: GitHub ANDs
    # branch/tag filters with path filters, so a release whose commit happened
    # not to touch helm/ would publish no chart and say nothing. Linting main
    # a few extra times a day is the cheaper failure.
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'helm/**'
      - '.github/workflows/helm.yml'

permissions:
  contents: read
  pull-requests: read

jobs:
  lint-and-test:
    name: Lint, unit-test, kubeconform, kube-linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.16.3

      - name: Install helm-unittest plugin
        run: |
          archive="$RUNNER_TEMP/helm-unittest.tgz"
          curl --fail --show-error --location --output "$archive" \
            https://github.com/helm-unittest/helm-unittest/releases/download/v0.8.2/helm-unittest-linux-amd64-0.8.2.tgz
          echo "56ab3091e6fa52a7c92ee951def9bed957f295d9ce98483aed404e748d7b3a94  $archive" \
            | sha256sum --check --strict
          plugin_dir="$(helm env HELM_PLUGINS)/helm-unittest"
          mkdir -p "$plugin_dir"
          tar --extract --gzip --file "$archive" --directory "$plugin_dir"

      - name: helm dependency build
        # Resolve the exact Chart.lock dependencies. `build` preserves the
        # reviewed lock instead of re-resolving versions like `update`.
        run: |
          helm repo add groundhog2k https://groundhog2k.github.io/helm-charts/
          helm dependency build helm/genus-os

      - name: helm lint
        run: |
          helm lint helm/genus-os \
            --strict \
            --values helm/genus-os/values.yaml

      - name: helm lint (staging values)
        run: |
          helm lint helm/genus-os \
            --strict \
            --values helm/genus-os/values.yaml \
            --values helm/genus-os/values-staging.yaml

      - name: helm lint (production values)
        run: |
          helm lint helm/genus-os \
            --strict \
            --values helm/genus-os/values.yaml \
            --values helm/genus-os/values-production.yaml

      - name: helm lint (local values)
        run: |
          helm lint helm/genus-os \
            --strict \
            --values helm/genus-os/values.yaml \
            --values helm/genus-os/values-local.yaml

      - name: helm unittest
        run: |
          helm unittest helm/genus-os \
            --color \
            --strict

      - name: Render templates for downstream validators
        run: |
          mkdir -p _rendered
          helm template gos helm/genus-os \
            --namespace genus \
            --values helm/genus-os/values.yaml \
            --values helm/genus-os/values-staging.yaml \
            --set dashboard.ingress.host=genus-os.staging.ironsail.ai \
            > _rendered/staging.yaml
          helm template gos helm/genus-os \
            --namespace genus \
            --values helm/genus-os/values.yaml \
            --values helm/genus-os/values-production.yaml \
            --set dashboard.ingress.host=genus-os.internal.ironsail.ai \
            > _rendered/production.yaml
          helm template gos helm/genus-os \
            --namespace genus \
            --values helm/genus-os/values.yaml \
            --values helm/genus-os/values-local.yaml \
            > _rendered/local.yaml

      - name: Install kubeconform
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl --fail --show-error --location --output "$RUNNER_TEMP/kubeconform.tar.gz" \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          echo "95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73  $RUNNER_TEMP/kubeconform.tar.gz" \
            | sha256sum --check --strict
          tar --extract --gzip --file "$RUNNER_TEMP/kubeconform.tar.gz" \
            --directory "$RUNNER_TEMP/bin" kubeconform
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: kubeconform (k8s schema validation)
        run: |
          for f in _rendered/*.yaml; do
            echo "→ $f"
            # VaultStaticSecret CRD schema comes from Datree's catalog
            # via the second -schema-location below.
            kubeconform \
              -strict \
              -summary \
              -verbose \
              -kubernetes-version 1.31.0 \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/34cef0fc2698bbb611f475515e555a2d7ca85b6c/{{ .Group }}/{{ .ResourceKind }}_{{ .ResourceAPIVersion }}.json' \
              "$f"
          done

      - name: Install kube-linter
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl --fail --show-error --location --output "$RUNNER_TEMP/kube-linter.tar.gz" \
            https://github.com/stackrox/kube-linter/releases/download/v0.7.4/kube-linter-linux.tar.gz
          echo "1d050a5d03e3347cc1cf5b1513f646709c65d129f7aa6c2b1a6388ffb2694671  $RUNNER_TEMP/kube-linter.tar.gz" \
            | sha256sum --check --strict
          tar --extract --gzip --file "$RUNNER_TEMP/kube-linter.tar.gz" \
            --directory "$RUNNER_TEMP/bin" kube-linter
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: kube-linter (best practices)
        run: |
          for f in _rendered/*.yaml; do
            echo "→ $f"
            kube-linter lint "$f"
          done

      - name: Upload rendered manifests
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rendered-manifests
          path: _rendered/
          retention-days: 14

  publish:
    name: Publish the chart to ghcr.io/ironsail-llc/charts
    # Release tags only. A chart published from a branch would give the
    # registry a version that no git tag, changelog entry or image exists for.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: lint-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.16.3

      # semantic-release bumps Chart.yaml in the same commit the tag points at,
      # so these agree unless something raced. Publishing anyway would put a
      # version in the registry that no release describes.
      - name: Assert the chart version is the tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CHART="$(helm show chart helm/genus-os | awk '/^version:/ {print $2}' | tr -d '"')"
          echo "tag=${TAG}  Chart.yaml=${CHART}"
          if [ "$TAG" != "$CHART" ]; then
            echo "chart version ${CHART} is not the release tag ${TAG}"
            exit 1
          fi
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"

      - name: helm dependency build
        run: |
          helm repo add groundhog2k https://groundhog2k.github.io/helm-charts/
          helm dependency build helm/genus-os

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GITHUB_TOKEN" \
            | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: helm package and push
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          helm package helm/genus-os --destination "$RUNNER_TEMP"
          helm push "$RUNNER_TEMP/genus-os-${VERSION}.tgz" oci://ghcr.io/ironsail-llc/charts

      # A push nobody pulls back is a push that can be broken for a whole
      # release cycle. Pull the published artifact -- not the working tree --
      # and render it with the values production actually uses.
      - name: Pull the published chart back and render it
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/verify"
          helm pull oci://ghcr.io/ironsail-llc/charts/genus-os \
            --version "$VERSION" --destination "$RUNNER_TEMP/verify"
          test -f "$RUNNER_TEMP/verify/genus-os-${VERSION}.tgz"
          helm template gos "$RUNNER_TEMP/verify/genus-os-${VERSION}.tgz" \
            --namespace genus \
            --values helm/genus-os/values.yaml \
            --values helm/genus-os/values-production.yaml \
            --set dashboard.ingress.host=genus-os.internal.ironsail.ai \
            > "$RUNNER_TEMP/verify/production.yaml"
          test -s "$RUNNER_TEMP/verify/production.yaml"
          echo "assertion OK: oci://ghcr.io/ironsail-llc/charts/genus-os ${VERSION} renders"

      - name: Summarise
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "### Chart published"
            echo
            echo '```bash'
            echo "helm install genus oci://ghcr.io/ironsail-llc/charts/genus-os \\"
            echo "  --version ${VERSION} --namespace genus --create-namespace -f values.yaml"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
