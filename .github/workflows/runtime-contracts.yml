name: Runtime compatibility
on:
  pull_request:
    paths:
      - 'app/**'
      - 'robothor/engine/**'
      - 'robothor/goals/**'
      - 'crm/migrations/**'
      - 'crm/bridge/routers/pursuit_goals.py'
      - 'pyproject.toml'
      - 'bench/runtime/**'
      - 'bench/interactive/**'
      - '.github/workflows/runtime-contracts.yml'
  schedule:
    - cron: '15 9 1 * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev,api]'
      - run: sudo apt-get update && sudo apt-get install -y postgresql-16
      - name: Native execution and product contracts
        run: >-
          python -m pytest -q --no-cov robothor/goals/tests
          robothor/engine/tests/test_runtime_contracts.py
          robothor/engine/tests/test_runtime_controls.py
          robothor/engine/tests/test_runtime_deadlines.py
          robothor/engine/tests/test_runtime_verified_outcomes.py
          robothor/engine/tests/test_runtime_http_acceptance.py
          robothor/engine/tests/test_runtime_mixed.py
          robothor/engine/tests/test_request_budget.py
          robothor/engine/tests/test_checkpoint.py
          robothor/engine/tests/test_runner.py
          robothor/engine/tests/test_plan_mode.py
          robothor/engine/tests/test_plan_integrity.py
          robothor/engine/tests/test_interactive_benchmark_compare.py
      - name: Pinned candidate compatibility (synthetic tools only)
        run: |
          python -m venv /tmp/runtime-candidates
          /tmp/runtime-candidates/bin/pip install -r bench/runtime/candidates.lock
          PYDANTIC_AI_NO_BANNER=1 /tmp/runtime-candidates/bin/python -m pytest -q bench/runtime/test_store_host.py bench/runtime/test_adapter.py bench/runtime/test_candidate_boundaries.py bench/runtime/test_candidate_durable_budget.py
          PYDANTIC_AI_NO_BANNER=1 /tmp/runtime-candidates/bin/python -m bench.runtime.screen_candidates --output /tmp/screening.json
          python -c 'import json; r=json.load(open("/tmp/screening.json")); assert all(s["status"]=="completed" and s["verified"] and s["single_write"] for s in r["samples"])'

  browser-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10.34.5
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pip install -e '.[dev,api]'
      - run: sudo apt-get update && sudo apt-get install -y postgresql-16
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: app
      - run: pnpm exec playwright test --config uat/runtime/playwright.config.ts
        working-directory: app
        env:
          RUNTIME_UAT_MANAGED: '1'
          RUNTIME_UAT_PYTHON: python
