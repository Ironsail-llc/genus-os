name: Runtime compatibility
on:
  pull_request:
    paths:
      - 'app/**'
      - 'robothor/engine/**'
      - 'robothor/goals/**'
      - 'crm/migrations/**'
      - 'crm/bridge/routers/pursuit_goals.py'
      - 'pyproject.toml'
      - 'bench/runtime/**'
      - 'bench/interactive/**'
      - '.github/workflows/runtime-contracts.yml'
  schedule:
    - cron: '15 9 1 * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev,api]'
      - run: sudo apt-get update && sudo apt-get install -y postgresql-16
      - name: Native execution and product contracts
        run: >-
          python -m pytest -q --no-cov robothor/goals/tests
          robothor/engine/tests/test_runtime_contracts.py
          robothor/engine/tests/test_runtime_resume_loading.py
          robothor/engine/tests/test_runtime_native_gateway.py
          robothor/engine/tests/test_runtime_chat_goal_acceptance.py
          robothor/engine/tests/test_runtime_chat_confirmation.py
          robothor/engine/tests/test_chat_plan_outcomes.py
          robothor/engine/tests/test_chat_plan_claim.py
          robothor/engine/tests/test_chat_recovery.py
          robothor/engine/tests/test_calendar_recovery_readback.py
          robothor/engine/tests/test_tool_proxy.py
          robothor/engine/tests/test_runtime_controls.py
          robothor/engine/tests/test_runtime_deadlines.py
          robothor/engine/tests/test_runtime_action_policy.py
          robothor/engine/tests/test_runtime_admission_audit.py
          robothor/engine/tests/test_runtime_profile_admission.py
          robothor/engine/tests/test_runtime_profile_lookup.py
          robothor/engine/tests/test_runtime_profile_progress.py
          robothor/engine/tests/test_runtime_profile_pool.py
          robothor/engine/tests/test_runtime_profile_http.py
          bench/runtime/test_profile_load.py
          bench/runtime/test_native_journal.py
          bench/runtime/test_chat_cohort.py
          bench/runtime/test_chat_cohort_report.py
          robothor/engine/tests/test_runtime_verified_outcomes.py
          robothor/engine/tests/test_runtime_fallback_wire.py
          robothor/engine/tests/test_runtime_http_acceptance.py
          robothor/engine/tests/test_runtime_mixed.py
          robothor/engine/tests/test_request_budget.py
          robothor/engine/tests/test_checkpoint.py
          robothor/engine/tests/test_runner.py
          robothor/engine/tests/test_plan_mode.py
          robothor/engine/tests/test_plan_integrity.py
          robothor/engine/tests/test_interactive_benchmark_compare.py
      - name: Capture the native provider configuration without network access
        run: >-
          ROBOTHOR_RUNTIME_NATIVE_WIRE_ARTIFACT=/tmp/runtime-native-request.json
          python -m pytest -q --no-cov robothor/engine/tests/test_runtime_provider_configuration.py
      - name: Pinned candidate compatibility (synthetic tools only)
        run: |
          python -m venv /tmp/runtime-candidates
          /tmp/runtime-candidates/bin/pip install -r bench/runtime/candidates.lock
          ROBOTHOR_RUNTIME_NATIVE_WIRE_ARTIFACT=/tmp/runtime-native-request.json PYDANTIC_AI_NO_BANNER=1 /tmp/runtime-candidates/bin/python -m pytest -q bench/runtime/test_screen_candidates.py bench/runtime/test_screen_journal.py bench/runtime/test_goal_lifecycle.py bench/runtime/test_native_profile.py bench/runtime/test_screening_configuration.py bench/runtime/test_store_host.py bench/runtime/test_adapter.py bench/runtime/test_candidate_boundaries.py bench/runtime/test_candidate_durable_budget.py
          PYDANTIC_AI_NO_BANNER=1 /tmp/runtime-candidates/bin/python -m bench.runtime.screen_candidates --output /tmp/screening.json
          python -c 'import json; r=json.load(open("/tmp/screening.json")); assert all(s["status"]=="completed" and s["verified"] and s["single_write"] for s in r["samples"])'
      - name: Preserve candidate screening evidence, including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-candidate-screening
          path: |
            /tmp/screening.json
            /tmp/screening.json.jsonl
          if-no-files-found: warn
      - name: Candidate frameworks through native business controls
        run: |
          python -m venv /tmp/runtime-native-candidates
          /tmp/runtime-native-candidates/bin/pip install -e '.[dev,api]' -r bench/runtime/candidates.lock
          PYDANTIC_AI_NO_BANNER=1 /tmp/runtime-native-candidates/bin/python -m pytest -q --no-cov bench/runtime/test_native_dispatch.py

  browser-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10.34.5
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pip install -e '.[dev,api]'
      - run: sudo apt-get update && sudo apt-get install -y postgresql-16 postgresql-16-pgvector
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: app
      - run: pnpm exec playwright test --config uat/runtime/playwright.config.ts
        working-directory: app
        env:
          RUNTIME_UAT_MANAGED: '1'
          RUNTIME_UAT_PYTHON: python
      - name: Verify chat recovery under audit outages
        run: >-
          pnpm exec vitest run
          src/lib/chat/__tests__/request-journal.test.ts
          src/lib/chat/__tests__/request-failure.test.ts
          src/components/__tests__/chat-recovery.test.tsx
          src/components/__tests__/chat-panel*.test.tsx
          src/app/api/chat/__tests__/agent-routing.test.ts
          src/lib/engine/__tests__/server-client-session.test.ts
        working-directory: app
      - name: Build and verify terminal chat outcomes in the actual dashboard
        run: |
          pnpm build
          pnpm exec playwright test e2e/deep-mode.spec.ts --workers=2
        working-directory: app
        env:
          PLAYWRIGHT_PORT: '5323'
      - name: Recover a saved plan through browser, native engine and canonical database
        run: python -m bench.runtime.migrated_integration --chat-browser
