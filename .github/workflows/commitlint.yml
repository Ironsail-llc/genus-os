name: Commitlint

on:
  pull_request:
    branches: [main, staging]

permissions:
  contents: read
  pull-requests: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Validate PR commits
        run: npx commitlint --from origin/${{ github.base_ref }} --to HEAD --verbose
