<!doctype html>
<!-- Minimal stand-in for a www.startpage.com/do/search results page: only the
     two result-anchor classes Startpage serves (a page carries both) and the
     description paragraph beside each. Hand-written — no captured markup, no
     tracking parameters. -->
<html>
  <body>
    <div class="w-gl w-gl--default">
      <div class="w-gl__result">
        <a class="result-link w-gl__result-title" href="https://springfield-cowork.example.com/">Springfield Coworking — Private Offices</a>
        <p class="description">Private offices in <b>Springfield</b> with meeting rooms included.</p>
      </div>
      <div class="w-gl__result">
        <a class="result-link w-gl__result-title" href="https://desks.example.org/springfield">Desks &amp; Suites of Springfield</a>
        <p class="w-gl__description">Coworking memberships near Springfield station.</p>
      </div>
      <div class="w-gl__result">
        <a class="result-link w-gl__result-title" href="https://example.net/listings/springfield-office">Office space listings in Springfield</a>
      </div>
    </div>
  </body>
</html>
