<!doctype html>
<!-- Minimal stand-in for html.duckduckgo.com: only .result__a / .result__snippet
     and the /l/?uddg= redirect wrapper the parser has to unwrap. -->
<html>
  <body>
    <div class="results">
      <div class="result results_links_deep result--ad">
        <a class="result__a" href="https://ads.example.com/promo">Sponsored listing</a>
        <a class="result__snippet" href="#">Ad copy.</a>
      </div>
      <div class="result results_links_deep">
        <a class="result__a" href="//duckduckgo.com/l/?uddg=https%3A%2F%2Fspringfield-cowork.example.com%2F&amp;rut=abc">Springfield Coworking — Private Offices</a>
        <a class="result__snippet" href="#">Private offices in <b>Springfield</b> with meeting rooms included.</a>
      </div>
      <div class="result results_links_deep">
        <a class="result__a" href="https://desks.example.org/springfield">Desks &amp; Suites of Springfield</a>
        <a class="result__snippet" href="#">Coworking memberships near Springfield station.</a>
      </div>
      <div class="result results_links_deep">
        <a class="result__a" href="https://example.net/listings/springfield-office">Office space listings in Springfield</a>
        <a class="result__snippet" href="#">Private office suites across Springfield.</a>
      </div>
    </div>
  </body>
</html>
