<!doctype html>
<!-- Shape of the anti-bot page Startpage serves a suspected scraper: a 200 with
     a CAPTCHA widget, no result anchors, and — unlike DuckDuckGo's — no form of
     hidden inputs to recognise it by. Hand-written. -->
<html>
  <head><title>Startpage — CAPTCHA</title></head>
  <body>
    <h1>Our systems have detected unusual traffic from your network.</h1>
    <p>Please complete the captcha below to verify you are a human.</p>
    <div id="captcha-widget" data-sitekey="test-sitekey"></div>
  </body>
</html>
