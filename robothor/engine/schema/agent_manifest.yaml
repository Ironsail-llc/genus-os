# Agent Manifest Schema — the strict contract for building agents.
# Every agent manifest MUST validate against this schema.
#
# CANONICAL COPY: robothor/engine/schema/agent_manifest.yaml. That is the one
# the engine reads (robothor/engine/manifest_schema.py derives its structural
# rules from it at import time) and the one that ships in the wheel; this file
# is the documentation mirror. tests/test_manifest_schema_single_source.py
# fails if the two ever differ by a single byte, so edit either and copy.
#
# Used by: the engine's manifest validator, validate_agents.py,
# robothor agent scaffold, Claude Code, onboarding agents.
#
# Field categories:
#   required    — Must be present. Engine rejects the manifest without them.
#   recommended — Should be present. Validator warns if missing.
#   optional    — Enhance coordination, hooks, warmup, SLA, changelog.

required:
  id:
    type: string
    format: kebab-case
    description: Unique agent identifier
    example: "ticket-router"
  name:
    type: string
    description: Human-readable display name
  description:
    type: string
    description: One-line purpose statement
  version:
    type: string
    format: "YYYY-MM-DD"
    description: Date of last manifest change
  department:
    type: string
    # Must stay a superset of the departments in templates/agents/_catalog.yaml —
    # `examples` was missing here while the catalog shipped it and hello-world
    # declared it.
    enum: [email, calendar, operations, security, communications, crm, briefings, core, examples, system, custom]

recommended:
  model:
    primary:
      type: string
      description: Full LiteLLM model path
      example: "openrouter/z-ai/glm-5"
    fallbacks:
      type: list[string]
    temperature:
      type: number
      default: 0.3
    reasoning_effort:
      type: string
      default: medium
      description: Effort hint passed to models that accept one (low/medium/high)
    payload_alias:
      type: string
      description: >
        Short handle for the chain this agent is on, used by
        scripts/set-fleet-model.py to rewrite fallbacks across the fleet
        without reading the model names back out. Metadata — the engine
        never reads it.
      example: "ox"
  schedule:
    cron:
      type: string
      description: APScheduler cron expression. Empty for hook-only or interactive agents.
    timezone:
      type: string
      default: UTC
    timeout_seconds:
      type: integer
      default: 0
      description: >
        Wall-clock cap (seconds). Default 0 = disabled. Runs complete
        when the agent says it's done; they are not killed on elapsed
        time. Set a positive value only if you explicitly want a
        circuit breaker for this agent (not recommended).
    max_iterations:
      type: integer
      default: 10
    session_target:
      type: string
      enum: [isolated, persistent]
      default: isolated
    catch_up:
      type: string
      enum: [coalesce, skip_if_stale]
      default: coalesce
      description: >
        How to handle missed cron fires. coalesce: merge missed into one run
        (APScheduler default). skip_if_stale: skip if fire time is older than
        stale_after_minutes.
    stale_after_minutes:
      type: integer
      default: 120
      description: >
        Minutes after scheduled fire time before a job is considered stale.
        Only used when catch_up=skip_if_stale.
    safety_cap:
      type: integer
      default: 200
      description: Hard ceiling on LLM iterations for one run.
    stall_timeout_seconds:
      type: integer
      default: 0
      description: >
        Watchdog budget between steps, in seconds. 0 disables it. Scaled by the
        chain's slowest model at runtime — see the stall-budget check in
        manifest_schema.py.
    early_stall_timeout_seconds:
      type: integer
      default: 0
      description: Watchdog budget before the first tool call. 0 disables it.
    journal_file:
      type: string
      description: Path the run journal is written to. Empty = no journal.
    journal_checkpoint_interval:
      type: integer
      default: 5
    resume_on_start:
      type: boolean
      default: false
      description: Resume an interrupted run of this agent when the engine boots.
  delivery:
    mode:
      type: string
      enum: [none, announce, log]
      default: none
    channel:
      type: string
      description: Required when mode=announce
    to:
      type: string
      description: Channel-specific target (e.g., Telegram chat ID)
    surface_to_channel:
      type: boolean
      default: true
      description: Mirror this agent's deliveries into the channel bus.
  tools_allowed:
    type: list[string]
    description: >
      STRICT — if set, ONLY these tools are available.
      Always include exec, read_file, write_file for file I/O.
  tools_denied:
    type: list[string]
    default: []
  instruction_file:
    type: string
    description: Path to .md file loaded as system prompt
  bootstrap_files:
    type: list[string]
    description: Shared context files appended after instruction

optional:
  reports_to:
    type: string
    description: Agent ID this reports to
  creates_tasks_for:
    type: list[string]
  receives_tasks_from:
    type: list[string]
  escalates_to:
    type: string
  downstream_agents:
    type: list[string]
  teams:
    type: list[string]
    description: Team IDs this agent belongs to
  messaging:
    type: object
    description: Agent messaging capabilities
    properties:
      can_send:
        type: boolean
        default: false
      can_receive:
        type: boolean
        default: false
  hooks:
    type: list[Hook]
    description: Event triggers — when these fire, this agent runs
    items:
      stream:
        type: string
        description: Redis Stream name (e.g., "email", "support")
      event_type:
        type: string
        description: Event type filter (e.g., "email.new")
      message:
        type: string
        description: Initial prompt sent to agent when triggered
  streams:
    read:
      type: list[string]
    write:
      type: list[string]
  task_protocol:
    type: boolean
    default: false
    description: Agent must check inbox, process tasks, resolve
  auto_task:
    type: boolean
    default: false
    description: Engine auto-creates a CRM task per run with proper lifecycle
  review_workflow:
    type: boolean
    default: false
  notification_inbox:
    type: boolean
    default: false
  status_file:
    type: string
  shared_working_state:
    type: boolean
    default: false
  warmup:
    memory_blocks:
      type: list[string]
    context_files:
      type: list[string]
    peer_agents:
      type: list[string]
  sla:
    urgent: { type: string, example: "30m" }
    high: { type: string, example: "2h" }
    normal: { type: string, example: "8h" }
    low: { type: string, example: "24h" }
  tags_produced:
    type: list[string]
  tags_consumed:
    type: list[string]
  secret_refs:
    type: list[string]
    description: >
      Declarative list of secret keys this agent depends on. Validated by
      validate_agents.py (check M) and cross-referenced by vault audit.
    example: ["OPENROUTER_API_KEY", "ROBOTHOR_TELEGRAM_BOT_TOKEN"]
  role:
    type: string
    description: >
      Service role this agent runs as. Resolved by service_roles.resolve_service_role
      and gates every RBAC decision. Empty = the default role for the agent id.
  service_role:
    type: string
    description: Alias for `role`, accepted by the loader.
  bridge_endpoints:
    type: list[string]
    description: >
      Bridge endpoint patterns this agent is allowed to call
      (events/capabilities.py). Glob patterns, not URLs.
  goals:
    type: object
    description: >
      Declared goals per category, e.g. {quality: [{id, metric, target}]}.
      Read by engine/goals.py; graded by the goal-review run.
  when:
    type: list[WhenClause]
    description: >
      Conditional overrides applied for one trigger type, then dropped from
      the manifest. Later clauses win.
    items:
      trigger_type:
        type: string
        description: Trigger this clause applies to (e.g. "hook", "cron")
      overrides:
        type: object
        description: Manifest fragment deep-merged over the agent's config
  channel_bus:
    wake_on_surface:
      type: boolean
      default: false
    wake_debounce_seconds:
      type: integer
      default: 15
    wake_cost_budget_usd:
      type: number
      default: 0.0
    per_agent_rate_limit_per_hour:
      type: integer
      default: 20
    main_wake_cooldown_seconds:
      type: integer
      default: 300
    wake_preamble_history_lines:
      type: integer
      default: 8
  # ── Worker (a second cron lane with its own instruction + budget) ─
  # Same shape as heartbeat. Inherits model + tools from the parent agent.
  worker:
    cron:
      type: string
    timezone:
      type: string
    instruction_file:
      type: string
    session_target:
      type: string
      enum: [isolated, persistent]
      default: isolated
    max_iterations:
      type: integer
      default: 15
    timeout_seconds:
      type: integer
      default: 0
    safety_cap:
      type: integer
      default: 200
    stall_timeout_seconds:
      type: integer
      default: 0
    early_stall_timeout_seconds:
      type: integer
      default: 0
    persistent_history_limit:
      type: integer
      default: 20
    cost_budget_usd:
      type: number
      default: 0.0
    model:
      primary:
        type: string
      fallbacks:
        type: list[string]
      temperature:
        type: number
      reasoning_effort:
        type: string
    delivery:
      mode:
        type: string
        enum: [none, announce, log]
        default: none
      channel:
        type: string
      to:
        type: string
      surface_to_channel:
        type: boolean
    context_files:
      type: list[string]
    peer_agents:
      type: list[string]
    memory_blocks:
      type: list[string]
    bootstrap_files:
      type: list[string]
    worker_tools_allowed:
      type: list[string]
      description: Tool allowlist for worker runs only. Empty = inherit.
  # ── Heartbeat (periodic health-check runs with overrides) ────────
  # Attach to an interactive agent to add periodic cron runs with
  # different instruction file, delivery mode, warmup, and budget.
  # Inherits model + tools from the parent agent.
  heartbeat:
    cron:
      type: string
      description: APScheduler cron expression for heartbeat schedule
      example: "0 6-22/4 * * *"
    timezone:
      type: string
      default: (inherits from schedule.timezone)
    instruction_file:
      type: string
      description: Path to .md file used as system prompt for heartbeat runs
    session_target:
      type: string
      enum: [isolated, persistent]
      default: isolated
    max_iterations:
      type: integer
      default: 15
    timeout_seconds:
      type: integer
      default: 0
      description: >
        Wall-clock cap for heartbeat runs (seconds). Default 0 = no cap.
        See schedule.timeout_seconds for semantics.
    safety_cap:
      type: integer
      default: 200
    stall_timeout_seconds:
      type: integer
      default: 0
    early_stall_timeout_seconds:
      type: integer
      default: 0
    model:
      primary:
        type: string
      fallbacks:
        type: list[string]
      temperature:
        type: number
      reasoning_effort:
        type: string
    heartbeat_tools_allowed:
      type: list[string]
      description: Tool allowlist for heartbeat runs only. Empty = inherit.
    task_authorship_agent:
      type: string
      description: Agent id recorded as the author of tasks a heartbeat run creates.
    persistent_history_limit:
      type: integer
      default: 20
      description: >
        How many prior messages to replay at the top of a session-resumed
        heartbeat run. Smaller is cheaper; larger preserves more context.
        Only honoured when session_target=persistent.
    delivery:
      mode:
        type: string
        enum: [none, announce, log]
        default: announce
      channel:
        type: string
      to:
        type: string
    context_files:
      type: list[string]
      description: Warmup context files for heartbeat runs
    peer_agents:
      type: list[string]
      description: Peer agents whose status is checked during warmup
    memory_blocks:
      type: list[string]
      description: Memory blocks loaded during warmup
    bootstrap_files:
      type: list[string]
      description: Shared context files for heartbeat system prompt
    token_budget:
      type: integer
      default: 0
      description: "DEPRECATED — auto-derived at runtime from model registry × max_iterations"
    cost_budget_usd:
      type: number
      default: 0.0

  changelog:
    type: "list[{date: string, change: string}]"

  # ── v2 Engine Enhancements (all default off) ──────────────────────
  # Nest under a `v2:` key in the manifest. All fields are optional.
  v2:
    # Sub-agent spawning
    can_spawn_agents:
      type: boolean
      default: false
      description: Allow this agent to spawn other agents as sub-tasks mid-run
    max_nesting_depth:
      type: integer
      default: 2
      description: Max spawn depth (capped at 3). 0 = top-level only, 2 = A→B→C
    sub_agent_max_iterations:
      type: integer
      default: 10
      description: Max LLM iterations for spawned child agents
    sub_agent_timeout_seconds:
      type: integer
      default: 120
      description: Timeout in seconds for spawned child agents
    max_concurrent_spawns:
      type: integer
      default: 0
      description: >
        Max concurrent sub-agent spawns for this agent (0 = use engine default,
        which is ROBOTHOR_MAX_CONCURRENT_SPAWNS env var, default 10).
    max_spawn_batch:
      type: integer
      default: 0
      description: >
        Max agents per spawn_agents() call (0 = use engine default, which is
        ROBOTHOR_MAX_SPAWN_BATCH env var, default 10).

    error_feedback:
      type: boolean
      default: true
      description: Inject error analysis prompt when tools fail
    safety_cap:
      type: integer
      default: 200
      description: >
        Fallback for schedule.safety_cap — read from BOTH blocks, so it is the
        one key that cannot be misplaced between them.
    continuous:
      type: boolean
      default: false
      description: Keep the run loop going past the natural stop condition.
    progress_report_interval:
      type: integer
      default: 50
      description: Iterations between progress reports on a continuous run.
    hard_budget:
      type: boolean
      default: false
      description: Abort at cost_budget_usd rather than warning past it.
    max_cost_usd:
      type: number
      default: 0.0
      description: Max cost per run in USD (0 = unlimited).
    rate_limit_per_minute:
      type: integer
      default: 0
      description: Tool-call ceiling per minute for this agent (0 = engine default).
    tool_timeout_seconds:
      type: integer
      default: 120
    tool_offload_threshold:
      type: integer
      default: 0
      description: Characters above which a tool result is offloaded to a file.
    eager_tool_compression:
      type: boolean
      default: false
    todo_list_enabled:
      type: boolean
      default: false
    workspace_inventory:
      type: boolean
      default: false
      description: Prepend a workspace inventory to the system prompt.
    guardrails_opt_out:
      type: boolean
      default: false
      description: >
        Opt this agent out of fleet-level guardrails. Audited — an opt-out that
        nobody can see is how a guardrail becomes decoration.
    human_approval_tools:
      type: list[string]
      default: []
      description: Tools that require a human approval before they run.
    human_approval_timeout:
      type: integer
      default: 300
    human_approval_fail_open:
      type: boolean
      default: false
      description: Run the tool anyway when an approval request times out.
    mcp_servers:
      type: list[string]
      default: []
      description: MCP server names this agent may reach.
    token_budget:
      type: integer
      default: 0
      description: "DEPRECATED — auto-derived at runtime from model registry × max_iterations"
    cost_budget_usd:
      type: number
      default: 0.0
      description: Max cost per run in USD (0 = unlimited)
    planning_enabled:
      type: boolean
      default: false
      description: Pre-execution planning phase via separate LLM call
    planning_model:
      type: string
      description: Cheap model for planning (defaults to primary model)
    scratchpad_enabled:
      type: boolean
      default: false
      description: Periodic working state injection for long sessions
    guardrails:
      type: list[string]
      default: []
      description: >
        Named policies: no_destructive_writes, no_external_http,
        no_sensitive_data, rate_limit, no_main_branch_push,
        exec_allowlist, write_path_restrict
    exec_allowlist:
      type: list[string]
      default: []
      description: >
        Regex patterns for allowed exec/shell commands. Requires
        exec_allowlist in guardrails list. If empty, no restriction
        (backward compat). Commands not matching any pattern are blocked.
      example: ["^gog gmail thread (get|list)", "^gog gmail send --reply"]
    write_path_allowlist:
      type: list[string]
      default: []
      description: >
        Glob patterns for allowed write_file paths (workspace-relative).
        Requires write_path_restrict in guardrails list. If empty, no
        restriction. Writes not matching any pattern are blocked.
      example: ["brain/memory/email-classifier-status.md", "brain/memory/triage-*"]
    checkpoint_enabled:
      type: boolean
      default: false
      description: Mid-run state persistence for resume
    verification_enabled:
      type: boolean
      default: false
      description: Post-execution self-validation step
    verification_prompt:
      type: string
      description: Custom success criteria for verification
    difficulty_class:
      type: string
      enum: [simple, moderate, complex, ""]
      default: ""
      description: Manual difficulty override (empty = auto)
    sandbox:
      type: string
      enum: [local, docker, host]
      default: local
      description: >
        Execution sandbox mode. "local" uses the host Xvfb :99 display.
        "docker" creates a per-run ephemeral container with isolated
        Xvfb + Chromium + xdotool. "host" is an explicit opt-out from
        sandbox-by-default for host-trusted agents (RBAC + exec allowlist
        still apply); under ROBOTHOR_SANDBOX_DEFAULT_MODE=enforce,
        exec-holding agents without "host" get a Docker sandbox.
    lifecycle_hooks:
      type: list[LifecycleHook]
      description: >
        Hooks that fire during agent lifecycle. Each entry has: event, handler_type,
        handler, blocking, priority, filter, scope.
      items:
        event:
          type: string
          enum: [agent_start, agent_end, pre_tool_use, post_tool_use, pre_delivery, post_delivery, error, escalation, stream_event]
        handler_type:
          type: string
          enum: [command, http, agent, python]
        handler:
          type: string
          description: Shell command, URL, agent_id, or dotted.module.path
        blocking:
          type: boolean
          default: false
        priority:
          type: integer
          default: 100
          description: Lower numbers run first
        filter:
          type: object
          description: "Glob pattern filters, e.g. {tool_name: 'exec*'}"
