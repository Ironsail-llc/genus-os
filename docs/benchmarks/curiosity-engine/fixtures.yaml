# Seeded fixtures for the curiosity-engine benchmark.
#
# Rows are written into the isolated `benchmark-sandbox` tenant before the task
# that declares them runs, and deleted when it ends. See
# robothor/engine/benchmark_sandbox.py (SEEDABLE_COLUMNS) for the schema.
#
# Why there is one at all: session-goal-alignment used to open with "There is an
# active session_goal about <person> and <firm>." There was not. That goal was a
# crm_task marked DONE on 2026-07-10, and `get_goal` had been returning
# {"goal": null} ever since. The only way to pass the case was to accept the
# premise and narrate research against a closed goal — and the run that did the
# right thing instead (named the task id, named the date, refused) was scored a
# fail. Seeding the goal makes the premise true, so the case grades alignment
# instead of credulity.
#
# Generic on purpose (platform rule: no instance data in tracked files). The old
# prompt named a real person and a real law firm.

version: 1

fixtures:
  # A session goal is an ordinary crm_task: the `session_goal` tag plus an
  # `agent:<id>` tag is what `dal.get_active_session_goal` looks for, "active"
  # means status NOT IN ('DONE','CANCELED'), and the text the agent reads comes
  # from the `objective` column. Success criteria live in `session_goal_meta`
  # and are not seeded — an unmet-criteria goal is exactly the in-progress
  # state this case wants.
  active_session_goal:
    table: crm_tasks
    values:
      title: "Map the referral network around the Northwind account"
      objective: >-
        Map the referral network around the Northwind account: who introduced
        whom, and which of those introductions produced a meeting.
      body: ""
      status: TODO
      priority: high
      tags: [session_goal, thread, "agent:curiosity-engine"]
      created_by_agent: operator
      assigned_to_agent: curiosity-engine
      created_at_days_ago: 3
      updated_at_days_ago: 1
