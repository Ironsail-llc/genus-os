# Labelled conversations for the conversation fact extraction measurement
# (`robothor memory-eval --extraction`; see EXTRACTION.md beside this file).
#
# Each conversation is one extraction window, read as conversation ingest reads
# it: the owner's turns (role user), the assistant's, and guests' turns (role
# user, owner: false, speaker: <name>). A turn's time is `at` plus its number in
# minutes unless it carries its own `at`, so a relative date is counted from a
# fixed day and the result never depends on when the run happens.
#
# Each label:
#   fact        the expected fact, written as the extraction is asked to write it
#   keys        terms of which an extracted sentence must name at least one to be
#               considered (any other sentence is settled as no match by rule)
#   speaker     who said it: user (the owner), assistant, or a guest's name; a
#               list when more than one is right (a paste the assistant restated)
#   trust       the origin it must be stored with: user_stated, agent_generated
#               or external; a list when more than one is right
#   turns       the turn numbers it may cite
#   date        the event day (YYYY-MM-DD), null for none, or a list of
#               acceptable values. A month with no day accepts null or the 1st.
#   details     values the fact must keep (a list's items, a changed-from value),
#               each a list of acceptable spellings
#   paraphrase  the same fact in other words: the judge must match it
#   decoy       a close but different fact: the judge must not match it
#   required    false for a true fact the extraction may leave out (neither
#               missed nor a false positive); default true
#
# Generic people and places only: this file is public.
version: 1
