# Webhook channel configuration
# Each channel maps an external service to a Redis event stream.
# Agents pick up events via the existing EventHooks system (hooks.py).
channels:
  github:
    stream: github
    secret_env: GITHUB_WEBHOOK_SECRET
    event_type_header: X-GitHub-Event
    event_type_prefix: "github."
    rate_limit_per_min: 60

  generic:
    stream: webhook
    secret_env: GENERIC_WEBHOOK_SECRET
    event_type_field: event_type
    event_type_prefix: ""
    rate_limit_per_min: 100

  # A platform that signs Stripe-style: `t=<unix seconds>,v1=<hex>` over
  # "<t>." + raw body, with a delivery id header so redelivered events are
  # dropped. The delivery id is not signed: the timestamp window is what limits
  # replays of a captured request.
  # platform:
  #   stream: platform
  #   secret_env: PLATFORM_WEBHOOK_SECRET
  #   signature_header: X-Platform-Signature
  #   signature_scheme: stripe_t_v1        # hmac_hex (default) | stripe_t_v1 | hmac_ts_hex | google_oidc
  #   timestamp_tolerance_seconds: 300
  #   delivery_id_header: X-Platform-Delivery-Id
  #   event_type_field: type
  #   event_type_prefix: "platform."
  #   rate_limit_per_min: 120

  # A sender that puts a hex HMAC-SHA256 of "<timestamp>." + raw body in one
  # header (optionally "sha256="-prefixed) and the unix-seconds timestamp in
  # another. The timestamp must be within timestamp_tolerance_seconds.
  # helpdesk:
  #   stream: helpdesk
  #   secret_env: HELPDESK_WEBHOOK_SECRET
  #   signature_scheme: hmac_ts_hex
  #   signature_header: X-Helpdesk-Signature
  #   timestamp_header: X-Helpdesk-Timestamp  # default X-Webhook-Timestamp
  #   timestamp_tolerance_seconds: 300
  #   event_type_field: event
  #   event_type_prefix: "helpdesk."

  # Google Cloud Pub/Sub push with authentication on (Gmail push ingest, see
  # docs/event-bus.md "Gmail push"). No shared secret: the push's ID token is
  # verified for this audience and service account. The Pub/Sub messageId is
  # the delivery id; message.data is decoded into the payload.
  # gmail:
  #   stream: gmail                          # = ROBOTHOR_GMAIL_PUSH_STREAM
  #   signature_scheme: google_oidc
  #   oidc_audience: "https://agent.example.com/api/webhooks/gmail"
  #   oidc_service_account: "gmail-push@example-project.iam.gserviceaccount.com"
  #   event_type_prefix: "gmail.push"
  #   rate_limit_per_min: 600
