id: calendar-pipeline
name: Calendar Pipeline
description: Monitor calendar events for conflicts, cancellations, and changes
version: "2026-02-28"

triggers:
  - type: hook
    stream: calendar
    event_type: calendar.new
  - type: hook
    stream: calendar
    event_type: calendar.rescheduled
  - type: hook
    stream: calendar
    event_type: calendar.modified
  - type: cron
    cron: "0 6-22/6 * * *"
    timezone: America/New_York

# Must exceed one agent step's whole model-chain allowance — see
# email-pipeline.yaml for the arithmetic (1800s for a four-model chain on a
# workflow trigger). At 600 this pipeline was surviving only because its
# primary answered first try, which is the same footing email-pipeline was on
# the day before it started timing out.
timeout_seconds: 2400

steps:
  - id: monitor
    type: agent
    agent_id: calendar-monitor
    message: "Calendar event detected. Check for conflicts, cancellations, and changes."
    on_failure: abort

  - id: done
    type: noop
