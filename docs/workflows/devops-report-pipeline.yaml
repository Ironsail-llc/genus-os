id: devops-report-pipeline
name: Dev Team Operations Report Pipeline
description: Weekly — collect JIRA/GitHub/Claude-usage facts for last week, build the deterministic people table, add analyst narrative, render, email.
version: "2026-10-23"

# Every step works on one report week: the previous ISO week (Mon 00:00 to
# Mon 00:00, America/New_York). Intermediate files live in
# $DEVOPS_RUNS_DIR/<week-start>/ (default $ROBOTHOR_WORKSPACE/local/devops/runs),
# never /tmp — the engine runs with PrivateTmp, so /tmp files were invisible
# afterwards. $DEVOPS_RUNS_DIR/latest points at the current week.
#
# Instance env (daemon environment): DEVOPS_TEAM_FILE (team roster YAML),
# DEVOPS_USAGE_REPORT_SENDERS, DEVOPS_REPORT_RECIPIENTS, optionally
# DEVOPS_RUNS_DIR and DEVOPS_USAGE_LLM_MODEL. See docs/DEVOPS_REPORT.md.

triggers:
  - type: cron
    cron: "0 9 * * 1"  # Monday 9am ET
    timezone: America/New_York
  - type: manual

# Must EXCEED one agent step's whole model-chain allowance — see
# email-pipeline.yaml for the arithmetic.
timeout_seconds: 2400

steps:
  - id: collect-jira
    # Non-zero exit = some query failed. The JSON is still written and the
    # affected metrics render as "unavailable", so the run continues.
    type: tool
    tool_name: exec
    tool_timeout_seconds: 300
    tool_args:
      # Project list is instance config; inlined here (workflow YAML is instance
      # territory) so scripts/ stays platform-clean.
      command: >-
        cd ~/robothor &&
        DEVOPS_JIRA_PROJECTS='RD,VE,I1'
        venv/bin/python scripts/devops_collect_jira.py
      timeout: 300
    on_failure: skip

  - id: collect-github
    # Core REST only (no Search API), every page, one window. Non-zero exit =
    # a repo/endpoint failed after retries; recorded, never reported as zero.
    type: tool
    tool_name: exec
    tool_timeout_seconds: 900
    tool_args:
      command: >-
        cd ~/robothor &&
        DEVOPS_GITHUB_REPOS='ironsail-llc/impetus-one,ironsail-llc/ec-valhalla-mso,ironsail-llc/ec-valhalla-vitality-storefront,ironsail-llc/genus-os,ironsail-llc/aws-infrastucture,ironsail-llc/ecommerce-operator,ironsail-llc/watchtower,ironsail-llc/genus-helpdesk,ironsail-llc/impetus-ecommerce'
        venv/bin/python scripts/devops_collect_github.py
      timeout: 900
    on_failure: skip

  - id: collect-claude-usage
    # Newest HR "Claude Usage Report" email (PDF) from DEVOPS_USAGE_REPORT_SENDERS
    # within 10 days -> usage.json + archive. Unavailable is reported, not fatal.
    type: tool
    tool_name: exec
    tool_timeout_seconds: 180
    tool_args:
      command: "cd ~/robothor && venv/bin/python scripts/devops_claude_usage.py"
      timeout: 180
    on_failure: skip

  - id: aggregate-people
    # Deterministic people table from the team roster file: every number in
    # the report comes from people.json.
    type: tool
    tool_name: exec
    tool_args:
      command: "cd ~/robothor && venv/bin/python scripts/devops_aggregate_people.py"
      timeout: 60
    on_failure: abort

  - id: analyze
    type: agent
    agent_id: devops-analyst
    message: >
      Weekly narrative run. Read local/devops/runs/latest/people.json (the
      deterministic table: members, roles with how each is judged, team totals,
      Claude usage, data_quality). Write ONLY this JSON to
      local/devops/runs/latest/analyst.json:
      {"summary": "...", "per_person": {"<member id>": "one short note"},
       "bottlenecks": ["..."], "si_vs_output": "..."}.
      Never restate a number unless it is exactly the table's value; notes
      with mismatching numbers are withheld from the report. Do not produce
      tables, counts or roles — the renderer takes all of those from
      people.json. Do NOT call jira_* or github_* tools.
    on_failure: skip   # the report renders without narrative and says so

  - id: render-html
    type: tool
    tool_name: exec
    tool_args:
      command: "cd ~/robothor && venv/bin/python scripts/devops_render_report.py"
      timeout: 60
    on_failure: abort

  - id: dispatch-emails
    # ONE message, all recipients in To:. DEVOPS_REPORT_RECIPIENTS (comma list)
    # wins over the devops_report_recipients memory block. Non-zero exit when
    # any recipient could not be resolved.
    type: tool
    tool_name: exec
    tool_args:
      command: "cd ~/robothor && venv/bin/python scripts/devops_send_emails.py"
      timeout: 120
    on_failure: skip

  # No Telegram post: the operator's chat is a conversation, not a feed. The
  # main agent reads local/devops/runs/latest/report.json and mentions what
  # matters in its next scheduled update.
