id: devops-report-pipeline
name: Dev Team Operations Report Pipeline
description: Weekly — collect JIRA/GitHub data, analyze, render, email stakeholders, post Telegram summary.
version: "2026-04-22"

triggers:
  - type: cron
    cron: "0 9 * * 1"  # Monday 9am ET
    timezone: America/New_York
  - type: manual

timeout_seconds: 1800

steps:
  - id: collect-jira
    type: tool
    tool_name: exec
    tool_args:
      # Project list is instance config; inlined here (workflow YAML is instance
      # territory) so scripts/ stays platform-clean. Mirror of jira.active_projects
      # in brain/memory/devops-config.json — keep in sync when adding projects.
      command: >-
        cd ~/robothor &&
        DEVOPS_JIRA_PROJECTS='VV,RD,I1,IM,IEC,CRI,OO,PRAC'
        venv/bin/python scripts/devops_collect_jira.py
      timeout: 60
    on_failure: abort

  - id: collect-github
    type: tool
    tool_name: exec
    tool_args:
      # Mirror of github.active_repos in brain/memory/devops-config.json.
      command: >-
        cd ~/robothor &&
        DEVOPS_GITHUB_REPOS='ironsail-llc/impetus-one,ironsail-llc/impetusrx,ironsail-llc/ec-valhalla-mso,ironsail-llc/united-pharmacy-api,ironsail-llc/genus-os,ironsail-llc/ec-valhalla-vitality-storefront'
        venv/bin/python scripts/devops_collect_github.py
      timeout: 120
    on_failure: abort

  - id: aggregate-people
    # Deterministic per-person rollup: joins every author/assignee/reviewer
    # handle to a CRM person via contact_identifiers, surfaces unresolved
    # handles, roster engineers with zero activity, and bot authors. Writes
    # /tmp/devops_people_rollup.json for the analyst to narrate.
    type: tool
    tool_name: exec
    tool_args:
      command: "cd ~/robothor && venv/bin/python scripts/devops_aggregate_people.py"
      timeout: 60
    on_failure: abort

  - id: collect-claude-usage
    # Pulls the latest weekly Claude Usage Report email from
    # <USAGE_REPORT_SENDER> (the 'Claude Usage Interceptor' automation),
    # parses it, archives to local/devops/claude_usage_reports/, and
    # writes /tmp/devops_claude_usage.json for the analyst. Skip on
    # failure — Claude adoption metrics are nice-to-have, not blocking.
    type: tool
    tool_name: exec
    tool_args:
      command: "cd ~/robothor && venv/bin/python scripts/claude_usage_report.py"
      timeout: 30
    on_failure: skip

  - id: analyze
    type: agent
    agent_id: devops-analyst
    message: >
      Weekly analysis run. Pre-collected data is waiting for you:
        - JIRA:          /tmp/devops_jira_data.json
        - GitHub:        /tmp/devops_github_data.json
        - People roll:   /tmp/devops_people_rollup.json    (deterministic per-person totals)
        - Claude usage:  /tmp/devops_claude_usage.json     (weekly adoption; may be unavailable)

      Follow your instruction file end-to-end. Write the structured report to
      /tmp/devops_report.json AND to the devops_latest_report memory block.
      Do NOT call jira_* or github_* tools — those are blocked for a reason.
      Do NOT call resolve_identities — the rollup file already has every
      person joined to CRM. Your job is narration, not joining.
      Your output_text should be a short status line; downstream agents handle
      email and Telegram delivery.
    on_failure: abort

  - id: render-html
    type: tool
    tool_name: exec
    tool_args:
      command: "cd ~/robothor && venv/bin/python scripts/devops_render_report.py"
      timeout: 30
    on_failure: abort

  - id: dispatch-emails
    # Deterministic fan-out: reads recipients from devops_report_recipients
    # memory block, looks up each person's email via crm_people, sends the
    # pre-rendered HTML via gws CLI. No LLM — just a loop.
    type: tool
    tool_name: exec
    tool_args:
      command: "cd ~/robothor && venv/bin/python scripts/devops_send_emails.py"
      timeout: 120
    on_failure: skip   # Email is secondary; Telegram is the primary channel.

  - id: post-telegram
    # Deterministic send: reads /tmp/devops_report.json, formats the plain-text
    # report, posts to Philip's chat via Telegram Bot API. No LLM needed for a
    # formatter. Env (ROBOTHOR_TELEGRAM_BOT_TOKEN + ROBOTHOR_TELEGRAM_CHAT_ID)
    # is inherited from the daemon process.
    type: tool
    tool_name: exec
    tool_args:
      command: "cd ~/robothor && venv/bin/python scripts/devops_send_telegram.py"
      timeout: 30
    on_failure: abort
