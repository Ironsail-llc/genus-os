  - name: ROBOTHOR_BENCHMARK_DECONTAMINATION_MODE
    owner: ops
    mode: observe
    planned_promotion: "2026-09-20"
    soak: >
      BLOCKER: probe must produce a row first; then enforce (analytics-only).
      The observe reporter (robothor/engine/analytics.py) has written zero
      evidence rows since the flag shipped, so the contamination figure this
