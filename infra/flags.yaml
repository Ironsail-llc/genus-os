# Flag manifest — the single inventory of guardrail/RIP rollout flags.
#
# Live values ship via the systemd drop-in (see
# infra/systemd/robothor-engine.service.d/upgrade-rip-flags.conf and
# docs/runbooks/GUARDRAIL_FLIPS.md). This file records intent: who owns each
# flag, what mode production runs, when the next promotion is due, and what
# evidence gates it. guardrail_watch.py nags daily for any flag sitting in
# observe/alert past its planned_promotion date.
#
# mode: off | observe | alert | enforce | on   (on = enabled, no mode ladder)

flags:
  - name: ROBOTHOR_RBAC_MODE
    owner: ops
    mode: enforce
    soak: enforced 2026-07-02; 46 blocks day one (allow-all service default), quiet since

  - name: ROBOTHOR_INJECTION_SCAN_MODE
    owner: ops
    mode: enforce
    soak: flipped 2026-07-13 after zero observed events 2026-07-02 → 2026-07-13

  - name: ROBOTHOR_EXEC_ALLOWLIST_STRICT_MODE
    owner: ops
    mode: enforce
    soak: >
      flipped 2026-07-13. NOTE the original "zero events" evidence was vacuous —
      observe mode wrote no guardrail-event rows at all until #187. The real
      evidence is journald: zero "exec_allowlist would block" warnings across
      14 days. Blast radius is narrow: only auto-agent and email-responder
      define an exec_allowlist, and their allowlisted commands are simple
      single invocations that never need shell metacharacters.

  - name: ROBOTHOR_APPROVAL_MODE
    owner: ops
    mode: enforce
    soak: >
      The gate was INERT until 2026-07-13 (no agent set human_approval_tools, so
      nothing could ever escalate — zero events meant "no mechanism", not "safe").
      Now real: main opts in for irreversible DESTRUCTION only —
      delete_person/company/task/note, vault_delete, gws_calendar_delete.
      Deliberately narrow: the operator's standing mandate is autonomous
      operation, so sending email, calendar creation and everything else stay
      ungated. A delete cannot be undone and is rare, so one Telegram tap costs
      nothing. Timeout (600s) = deny, fail-secure. Probe-verified: deletes
      escalate, gws_gmail_send and search_memory stay autonomous.
  - name: ROBOTHOR_SANDBOX_DEFAULT_MODE
    owner: ops
    mode: observe
    planned_promotion: "2026-09-01"
    soak: >
      The infrastructure this flag depends on now EXISTS (#207). Everything the
      previous note said was missing has been built:

        * `exec` routes through the sandbox (it never did — filesystem.py ran
          subprocess.run(shell=True) on the host and never called
          get_current_sandbox());
        * the workspace is mounted (there were no -v flags at all);
        * the container is a boundary: --network=none by default, --cap-drop=ALL,
          --security-opt no-new-privileges, --pids-limit, --user;
        * the image is built by scripts/build-sandbox-image.sh and the script
          PROBES it (the old image had no git and no python, so an auto-agent run
          — whose job is running the test suite — would have failed on its first
          command);
        * the runtime is rootless podman (ROBOTHOR_SANDBOX_BINARY), which removes
          the root-equivalent docker socket. Do NOT add the engine user to the
          docker group: that group is root, and it would defeat the sandbox it
          enables.

      Probed on the box through the real exec handler: ran in-container, workspace
      mounted, pipes work, NETWORK_BLOCKED, HOST_HOME_NOT_VISIBLE, NO_SUDO. Rootless
      podman also works under NoNewPrivileges=yes, so #205's containment and the
      sandbox coexist.

      THE GATE HAS NOW BEEN RUN, AND THE ANSWER IS: DO NOT FLIP THIS GLOBALLY.

      A real auto-agent run was driven through the daemon and its container came
      up and was fully contained (workspace mounted, NETWORK_BLOCKED,
      HOST_HOME_NOT_VISIBLE, NO_SUDO). The sandbox works.

      But the commands the LIVE exec-holding agents actually run were then executed
      inside that same container, and they fail — because the sandbox correctly
      removes exactly what they depend on:

        crm-hygiene    psql              FAILS  (no DB socket in the container)
        crm-hygiene    curl the bridge   FAILS  (--network=none)
        email-analyst  gog OAuth tokens  FAILS  (host $HOME is not mounted)
        email-analyst  gog binary        FAILS  (not in the image)

      Global `enforce` would fail-close the CRM and email pipelines. And the way to
      "fix" that — mount the DB socket, mount the OAuth tokens, open the network —
      hands back most of what the sandbox took away, on the agents with the widest
      blast radius. That is not containment, it is a container.

      So containment is per-agent and deliberate, not a global default:

        * repo-only work (auto-agent: run the test suite) -> `sandbox: docker`,
          which now fails CLOSED on its own regardless of this flag (#207);
        * host-resource work (main, crm-hygiene, conversation-inbox, email-analyst,
          vision-monitor) -> stays on the host. Its blast radius is bounded by the
          systemd confinement in #205 (no sudo, no root, read-only $HOME, workspace
          the only writable tree), which is the honest control for these agents.

      To contain those agents for real, give them tools instead of a shell — the
      escape hatch is `python3 << EOF <arbitrary code>`, and no allowlist or
      container placed around a general-purpose shell fixes that.

      GOTCHA if you do flip it per-agent: ProtectHostname=yes in the engine unit
      makes the UTS namespace immutable and every container dies at init with
      "sethostname: operation not permitted". Set ProtectHostname=no.

      Note: an agent with an explicit manifest `sandbox: docker` now fails CLOSED
      on its own, regardless of this flag (#207) — the global mode is a default for
      agents that never asked, not an override for one that did.

  - name: ROBOTHOR_COMPLETION_CONTRACTS_MODE
    owner: ops
    mode: enforce
    promoted: "2026-07-14"
    soak: >
      PROMOTED. The mechanism demonstrably fires — 3 real events, all
      email-analyst "no evidence recorded" — so this is not one of the controls
      that was silently inert. The evidence-wiring gap those 3 events pointed at
      has been fixed, and there have been none since.

      Enforce here is non-destructive: it does not fail the run or block a tool.
      It records the unevidenced completion and writes a `next_action` via
      dal.set_next_action(), leaving the task open. The alternative — silently
      accepting an agent's claim that it finished something with no evidence — is
      strictly worse than an open task with a next step on it.

  - name: ROBOTHOR_RIP_7_MODE
    owner: ops
    mode: enforce
    soak: >
      flipped 2026-07-13. The cleanest evidence of any flag — and the only one
      whose mechanism is positively PROVEN rather than merely silent. Its
      evidence lives in memory_facts_audit (not agent_guardrail_events): three
      pre_update_drift_detected rows, all 2026-05-28, two of which are
