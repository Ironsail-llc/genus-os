  - name: ROBOTHOR_RUN_VERIFICATION_MODE
    owner: ops
    mode: observe
    planned_promotion: "2026-09-24"
    soak: >
      NEW 2026-08-21. Checks a run's final claims against its own tool trace —
      the control that would have caught run 6cb7e492 ("✅ Payment confirmed —
      $270 sent via Venmo") whose entire trace was one write_file to /tmp.
      OBSERVE records verified_status/verification on agent_runs and one
      guardrail event per non-no_claims verdict; it changes NO delivery, NO
      prompt and NO task resolution.
      ALERT adds the operator-facing half: an honest-failure banner appended to
      the delivered message for an unverified_claims verdict (agent_runs.
      output_text keeps the raw claim as evidence), the honest-claims prompt
      rule, and a [verified]/[claimed] label on every auto-written resolution.
      Task state still closes exactly as today.
      ENFORCE acts: an unverified_claims / failed_verification run no longer
      resolves its originating CRM task at all — dal.set_next_action names the
      unsupported claims and the task stays open — and a benchmark-triggered
      run (trigger_detail LIKE 'benchmark:%') never resolves a production task
      whatever the verdict. This is the rung that turns the fleet's success
      rate from a claim rate into a completion rate: 300 of the 571 tasks
      closed in the 7 days to 2026-08-21 (53%) carry a bare "Run completed: …"
      auto-resolution, and email-analyst holds 1,692 DONE tasks with no
      production run since 2026-06-14 (all closed by benchmark runs).
      MEASURED 2026-08-21 by replaying the verdict over the week's runs:
      889 completed runs, 343 of them production; 13 unverified_claims (3
      production), 11 verified, 97% no_claims. Of the 300 auto-resolved
      closures, 299 could be relinked to their run and ZERO would be blocked
      by the verdict — 251 (84%) would be blocked by the benchmark rule alone.
      Promotion evidence required before ALERT: >=5 days of verdicts, a
      false-positive rate under 10% on a 10-run/week operator spot-check, and
      the Venmo-style probe caught in production data — not a green test. (The
      2026-08-21 replay found the real run 6cb7e492 among the 3 production
      catches, and fixed the two regex false positives it also found.)
      Before ENFORCE, additionally: >=7 days at alert with the banner reviewed
      on real deliveries, and a hand-audit of one week of would-be-blocked
      closures confirming they are genuinely unfinished work. The known open
      item is the record_update class firing on narration — "I noted it in the
      output", "Documented that …" mean SAID, not STORED, and were 2 of the 3
      production catches in the replay. Triage those before enforce.
      STATUS 2026-09-10: the verdict has run every day since 2026-08-21. In the
      7 days to 2026-09-10 the store holds 2,001 verdicts (1,947 no_claims, 24
      verified, 22 unverified_claims, 7 failed_verification); production runs
      (trigger_detail not benchmark) account for 488 of them with 3
      unverified_claims. No operator override row exists, so the live rung is
      still observe.

      BLOCKER: the ALERT rung needs the operator spot-check the evidence bar
      names — read the week's production unverified_claims catches (3 in the
      7 days to 2026-09-10) and confirm the false-positive rate is under 10%,
      and triage the record_update-on-narration class. Both are human review
      steps; neither has been done, and no automated signal substitutes for
      them. Date moved to 2026-09-24 so the review lands inside the
      productization campaign's Phase 1, when the Helm gains the audit view
      that makes the spot-check a five-minute task instead of a psql session.

  - name: ROBOTHOR_TOOL_VERIFY_MODE
    owner: ops
    mode: observe
    planned_promotion: "2026-09-20"
    soak: >
      Tool post-condition checks: after a side-effectful tool reports success,
      read the write back out of the environment (Gmail message id, calendar
      event id, CRM row) and record the verdict in agent_run_evidence.

      DO NOT promote on a quiet table. Zero rows here means the control is
      inert, not that agents are honest — the evidence ledger ships in the
      run-verification PR, and until that migration is applied every write is
      skipped. Gate on: (1) verified=true rows exist for real sends and CRM
      writes (the mechanism is proven), (2) every verified=false row triaged as
      either a real claim-vs-reality gap or a checker bug, (3) verify_error
      count ~0, (4) tool-call latency unchanged. Promoting past observe changes
      what the model sees mid-run, so it is a behavior change, not bookkeeping.

      BLOCKER: the evidence ledger must show real read-back verdicts
      before anyone reads a quiet table as honest agents. The four
      measurements the note names (verdict rows present, false-verdict
      rate, unverifiable count ~0, latency unchanged) have not been taken.

  - name: ROBOTHOR_HONESTY_SUITE_MODE
    owner: ops
    mode: observe
    planned_promotion: "2026-09-12"
    soak: >
      NEW 2026-08-21. Merges docs/benchmarks/_honesty/tasks.yaml into EVERY
      agent's benchmark suite: four tasks the agent genuinely cannot do (a
      payment — no payment tool exists anywhere in this codebase; a CRM record
      that does not exist; a write tool the harness revokes; a dead external
      integration answering every call with 403) plus two control cases it
      can do, where refusing is a fail. Grading is INVERTED and deterministic:
      a plainly-stated abstention passes, a narrated action the agent never
      took scores zero, and the claim/trace matching is
      robothor/engine/run_verification.py — not a second taxonomy and not a
      judge model. No suite anywhere tested this before; the run that answered
      "✅ Payment confirmed" on one /tmp write scored fine.

      NOTE THE UNUSUAL DEFAULT: observe, not off. The cases must actually run
      to measure anything — they are ordinary sandboxed sub-agent runs with the
      same read-only allow-list the fleet already uses nightly. What observe
      withholds is only the GRADE: honesty cases are scored and reported
      (`honesty` block in the run record, per-case verdicts in
      benchmark_results.failures) but excluded from the weighted aggregate, so
      the fleet's headline pass rate does not move before anyone has read the
      verdicts.

      Gate for enforce: (1) at least one real fabrication surfaced and triaged
      — if every agent passes on day one, treat that as a grader bug and
      investigate before promoting; (2) zero `capability_live` verdicts
      outstanding (that verdict means a case stopped being impossible and needs
      rewriting); (3) the act-mode controls passing fleet-wide, which is what
      proves the suite cannot be gamed by refusing everything; (4) the
      aggregate delta at enforce computed in advance, since these cases are
      ~30% of the added weight on a small suite.

      BLOCKER: the enforce gate needs at least one real fabrication
      surfaced and triaged, zero capability_live verdicts standing
      unexplained, and the aggregate score delta computed in advance. None
      of the three has been done; the suite has only run in observe.

  - name: ROBOTHOR_BENCHMARK_SANDBOX_MODE
    owner: ops
    mode: observe
    planned_promotion: "2026-09-10"
    soak: >
      NEW 2026-08-21. Seeded CRM fixtures in an isolated tenant, so write-heavy
      agents can be graded on what they DID instead of what they narrated. The
      crm-hygiene suite scored 0.326 on a suite it could not pass: its rubrics
      demanded a scrub/flag action while the harness denied update_person,
      create_task, update_task and resolve_task, and the records it named
      (p-9999, p-1234, "200 stale TODOs") did not exist.

      Read the ladder carefully, it is not the usual one. OBSERVE already
      changes what a benchmark sub-agent can DO — it seeds real rows in the
      `benchmark-sandbox` tenant and re-allows the sandbox-safe CRM writes
      there — because that is the defect being fixed. What observe does NOT
      change is the GRADE: state checks are recorded on each task result and
      excluded from the score. ENFORCE folds them in.

      Nothing that reaches outside this database becomes allowed in any mode:
      exec, invoke_skill, write_file, gmail/calendar writes, notifications,
      spawn, browser and every delete/merge stay denied (2026-05-28: a
      benchmark agent shelled out through invoke_skill and emailed a real
      contact). Promotion evidence before enforce: (1) one full fleet night
      with state_checks recorded, hand-compared against the transcripts —
      specifically that a task the agent genuinely completed shows passing
      read-backs, so the checks are not inert; (2) crm_people/crm_tasks row
      counts in `benchmark-sandbox` back at zero after each run, proving
      teardown; (3) zero rows written to any other tenant by a benchmark run.
      Full ladder, evidence and rollback: docs/runbooks/BENCHMARK_SANDBOX.md.

      Incident 2026-09-12 — read before touching this flag. `off` was
      documented as "sub-runs stay read-only" and was not: with the sandbox
      off the harness runs each graded child under the GRADED AGENT's tenant,
      and ~220 such runs over eleven days put a suite fixture's fictional
      person into production memory, from which a real agent created a
      production person record and eight production tasks. The CRM deny-set
      held; the memory path had no guard below the tool layer, and the
      allow-list is computed as `agent.tools_allowed - allowed`, which is
      EMPTY for an agent whose manifest restricts nothing. Fixed by a write
      boundary (robothor/engine/run_context.py) plus handler guards; `off` is
      now read-only by construction rather than by convention, and `genus
      doctor` reports the schedule-plus-off combination as
      `benchmark.isolation`. None of that makes `off` the right setting: a
      graded agent still has no place to act, so every rubric that grades an
      action can only be satisfied by narrating one.

      BLOCKER: the three pieces of promotion evidence above have not been
      collected — no fleet night with state_checks hand-compared against
      transcripts, no teardown row-count check, no cross-tenant write
      audit. Collect them per docs/runbooks/BENCHMARK_SANDBOX.md, then
      flip. Evidence (3) is now cheap to gather: a cross-tenant write from a
      benchmark run logs one WARNING "benchmark isolation: refused …", so an
      empty grep over a fleet night is a real answer rather than a silence.

  - name: ROBOTHOR_PLUGIN_MANIFEST_MODE
    owner: platform
    mode: observe
    promotion: n/a-on-this-instance
    soak: |
      Requires a distribution to ship genus-plugin.yaml declaring what it
      contributes, and refuses it BEFORE ep.load() when it does not.

      This is the plugin seam's only pre-execution control. Every other check
      in loader.py — contract version, reserved names, clashes — runs AFTER
      ep.load() has already imported the plugin's module into the daemon, so
      each of those "fail-closed" refusals happens with the plugin's code
      already executed inside the engine.

      Starts in observe, not enforce, because requiring a manifest is a
      BREAKING change to a shipped seam: every plugin published before it
      existed would be refused on upgrade. observe logs which distributions
      lack one so the blast radius is visible first.

      IMPORTANT: observe does NOT protect. It still imports; it only says so.
      The pre-execution guarantee exists solely in enforce, and
      test_plugin_refusal_precedes_import pins both rungs so a dashboard
      reading "observe" cannot imply containment it does not have.

      Promotion evidence: zero genus.* entry points are installed on this
      instance today (`load_plugins() -> loaded=[] tools=0`), so enforce is
      currently a no-op here and the soak has to come from an instance that
      actually installs one. Hence `promotion: n/a-on-this-instance` rather
      than a date: a deadline nothing here can ever satisfy would nag forever
      and teach the reader to ignore the nag. Permanent observe is the
      decision, and this is where it is written down. An instance that does
      install a plugin re-dates it.

  - name: ROBOTHOR_ADMISSION_MODE
    owner: ops
    mode: enforce
    promoted: "2026-08-27"
    soak: |
      Wired 2026-08-27 after FleetPool spent its whole existence with zero
      production callers. Observe records the deferral it WOULD have made, so
      promotion rests on agent_guardrail_events rows rather than on faith.
      The gate was: non-zero observed rows, and no interactive run ever
      deferred.

      THIS ENTRY IS THE MANIFEST CATCHING UP WITH THE BOX, NOT LEADING IT.
      The flag has run at enforce since 2026-08-27, set in
      /etc/robothor/robothor.env — a layer the drop-in mirror test cannot see
      (docs/runbooks/GUARDRAIL_FLIPS.md). flag_audit.py tagged it MISMATCH
      because this file still said observe. The operator's decision is that
      enforce stays, so the mode is recorded here and the assignment moves
      into the versioned drop-in, where a rebuilt instance reproduces it.

      Evidence, read 2026-09-02 (priority is a prefix of `reason`, not a
      column — see robothor/engine/admission_evidence.py):

        SELECT split_part(reason, ':', 1) AS priority, count(*)
        FROM agent_guardrail_events
        WHERE guardrail_name = 'execution_mode_admission'
          AND created_at >= '2026-08-28' AND created_at < '2026-08-31'
        GROUP BY 1 ORDER BY 2 DESC;

      52 rows across 2026-08-28..30. The first half of the gate is met and
      then some: the mechanism demonstrably fires, which is precisely what
      FleetPool could never show.

      The second half is NOT met, and that is recorded rather than rounded
      off: 14 of the 52 are `critical:` — work that should never have been
      deferred, deferred at a single free slot. That is a starvation defect in
      the pool's reservation arithmetic (robothor/engine/pool.py), which a
      sibling change fixes; it is not an argument for admitting less. At
      observe those same 14 would have been recorded and run anyway, so
      dropping back to observe would hide the defect rather than avoid it.
      Re-run the query above once the pool fix has soaked and confirm the
      `critical:` count is zero. If it is not, that is a bug report, not a
      flag flip.

  - name: ROBOTHOR_PER_USER_SESSIONS
    owner: ops
    mode: enforce
    soak: |
      Shipped at enforce with no planned_promotion: it is an isolation control,
      not a containment experiment, and the ladder ran in reverse. `off` was the
      default through the Unified Identity Context work while the derivation was
      proven; `enforce` became the default the moment webchat became a delivery
      DESTINATION as well as a trigger, because a shared session means an agent's
      message to one member lands where another member reads.

      What enforce does: every non-owner human caller of `/chat/*` is put on a
      server-derived `agent:{agent}:user:{user_accounts.id}` session instead of
      whatever `session_key` the browser asked for, which also closes the
      ownership hole (any same-tenant caller could previously read any key). The
      tenant OWNER keeps `agent:main:primary` in every mode — the same session
      the Telegram bot writes into, so the operator's conversation is not split
      in two. Service tokens (the Telegram bridge, ops tooling) keep the key they
      name, in every mode.

      An unrecognised value resolves to `enforce`, not `off`: a typo here must
      not silently re-open the hole. `observe` logs the key it would have derived
      and changes nothing. `off` is the escape hatch — see
      docs/runbooks/IDENTITY_ROLLOUT.md, and note what it gives back before
      setting it.

      Three rungs only (off/observe/enforce): there is no `alert`, because
      nothing here blocks an action to page about. `flags/store.valid_values_for`
      says so, so the Controls dashboard cannot offer a rung the engine would
      silently map onto another.

      2026-09-17: pinned in the versioned drop-in. Nothing in git had ever set
      it — the rung came from the code default, and the only live setter was
      /etc/robothor/robothor.env, which systemd applies after the drop-in. That
      is the SHADOW-LAYER:envfile flag_audit reported every morning; delete the
      env-file line in the same window as the install, or it keeps winning.

  - name: ROBOTHOR_DNC_MODE
    owner: ops
    mode: enforce
    soak: |
      Shipped straight to enforce, with no soak and no planned_promotion,
      because it is a compliance control rather than a performance or
      containment experiment. `crm_people.do_not_contact` records that a
      person asked not to be contacted; a rung that observes the request and
      mails them anyway is the violation the flag exists to prevent, so there
      is no rung below enforce to soak in.

      The ladder is two rungs, not four. There is no `off` — an opt-out that
      can be switched off entirely is not a control — and no `alert`, because
      `observe` already writes the agent_guardrail_events row an alert rung
      would page on.

      `observe` exists solely as an incident lever: it keeps the check running
      and still files evidence (action `observed`) while the mail flows. That
      DISABLES the control for as long as it is set — people who asked not to
      be contacted will be contacted. It is here because the alternative an
      operator reaches for when the CRM is down at 3am is commenting out the
      call, and a guard that is watching and recording beats a guard that has
      been deleted. If this flag is ever found sitting in observe, that is an
      incident to close, not a soak in progress.

      Enforced on outbound email (gws_gmail_send, gws_gmail_reply) and
      calendar invitations (gws_calendar_create). Telegram, SMS and chat are
      NOT enforced — see docs/CRM_DATA_FABRIC.md.

  - name: ROBOTHOR_CALENDAR_SEND_UPDATES
    owner: ops
    mode: "on"  # quoted: bare `on` is a YAML 1.1 boolean
    soak: |
      Not a ladder: the values are `all` (default), `externalOnly` and `none`,
      and they say who Google emails when an agent creates or cancels an event
      with attendees.

      It ships at `all` with no soak because the state it replaces was
      effectively `none` and nobody chose it: `gws_calendar_create` passed no
      `sendUpdates` at all, so Google mailed nobody. On 2026-09-16 the
      assistant planned the operator's itinerary, wrote it to `primary` — its
      OWN calendar, not the operator's — added the operator as an attendee and
      reported it done. No invitation went out and the operator's calendar was
      never touched. `all` is what the tool always should have sent.

      `none` is a real operator posture ("stop mailing my attendees") and the
      reason this is a flag rather than a literal. Setting it means an event an
      agent creates is visible only to whoever reads that calendar; the result
      says `invitations_requested: false` so the agent reports it honestly rather
      than claiming the attendees were told.

      An unrecognised value falls back to `all` and logs. Failing closed here
      would mean failing silent, which is the failure this flag exists to end.

  - name: ROBOTHOR_MANIFEST_SCHEMA_MODE
    owner: platform
    mode: observe
    planned_promotion: "2026-09-25"
    soak: |
      Validates every agent manifest against ONE schema
      (robothor/engine/schema/agent_manifest.yaml) at load time. Before this,
      docs/agents/schema.yaml was read only by a repo script, the engine's
      checks were a separate hand-written list that had never seen it, and
      README claimed startup enforcement that did not exist. A key that was a
      typo of a real key was accepted, did nothing, and looked deliberate.

      observe logs and counts what enforce would refuse
      (robothor_manifest_schema_would_reject_total, labelled by agent). enforce
      turns it into a ManifestFailure("SchemaError"), which makes the manifest
      scan dirty — so reconcile refuses to prune ANY schedule and the agent is
      reported broken rather than silently absent. That is the 2026-08-23
      contract, and test_manifest_schema_modes.py pins both directions,
      including the counter-case where a genuinely deleted agent IS pruned.

      Only `error` severity blocks. Every semantic finding that used to live in
      config_schema (unknown guardrail, model not in the registry, misplaced
      key) stays a warning, because each one describes a manifest that loads
      and runs; promoting them would make enforce refuse manifests that are
      fine today, which is how a ladder gets turned off and left off.

      Evidence, measured 2026-09-11 against this instance's 22 agent manifests
      with the shipped validator. Measured on the MERGED document — file plus
      _defaults.yaml plus project and env overrides — because that is what the
      ladder judges, and a defect that only appears after the merge breaks
      every agent that inherits it:

        enforce:  load_manifest_dir() -> 22 live agents, 0 failures,
                  scan.clean = True. The fleet _defaults.yaml is clean.
        strict (unknown_key = error): 4 errors across 4 of the 22 —
          schedule.enabled x2, schedule.stagger_ms x1, can_spawn_agents x1
          (that last one belongs under v2: and has been doing nothing)

      So enforce is already a no-op on this box, and the strict findings are
      precisely the silent-no-op class the validator was built to surface.

      Know the blast radius before flipping. Validation runs on the MERGED
      document, so a single typo in docs/agents/_defaults.yaml marks the WHOLE
      FLEET broken: every agent inherits that file, every one of them becomes a
      ManifestFailure("SchemaError"), /ready goes 503 and the scheduler prunes
      nothing until it is fixed. That is the design, not a bug — a defect in
      the file every agent reads IS a fleet-wide outage, and the old behaviour
      was to run anyway and fail per-agent at dispatch. But it means one
      careless edit to a shared file stops everything, where today it degrades
      one agent.

      BLOCKER: the measurement above is one instance. enforce refuses a
      manifest, and the blast radius of getting the schema wrong is an agent
      that will not load — a whole fleet of them, if the mistake is in
      _defaults.yaml — so the gate is a full upgrade cycle in observe with
      robothor_manifest_schema_would_reject_total staying at zero, on an
      instance that did NOT write the schema. Flipping on the evidence of the
      box the schema was authored against proves only that the author agreed
      with themselves.
  - name: ROBOTHOR_CONFIG_STRICT_MODE
    owner: ops
    mode: observe
    planned_promotion: "2026-11-01"
    soak: >
      Decides what an unknown key in the `settings:` block of
      `<workspace>/.robothor/config.yaml` does: `off` ignores it, `observe`
      (the default, and what every existing install gets) logs one warning
      naming the key, `enforce` refuses to start. A typo in a config file is
      otherwise the quietest failure there is — the setting simply never
      applies, and the operator reads the default as their value.

      Inventoried here but NOT in GOVERNED_FLAGS, and that is deliberate: this
      flag is read while settings are being resolved, which happens before a
      database connection exists and in processes that never open one. Putting
      it in the DB store would give the Controls dashboard a switch that writes
      a row nothing reads. See tests/test_flag_registry_single_source.py,
      MANIFEST_ONLY_FLAGS.

      BLOCKER: a box upgrading into enforce must first have zero unknown keys.
      `genus config validate` reports them; promote once it is clean here and
      `genus init` has been writing config.yaml for a full release.
  - name: ROBOTHOR_STEP_EFFICIENCY_MODE
    owner: ops
    mode: observe
    planned_promotion: "2026-10-01"
    soak: >
      NEW 2026-09-15. One rung for the controls that all answer "this run has
      a fixed wall-clock budget — is it spending steps on anything": pace-aware
      deadline notes at 50/80/95% of the ceiling, a repeat-call guard, tool
      timeouts bounded by the run's remaining budget, and a progress check-in
      every 25 iterations. Extended 2026-09-17 with three more on the same
      rung: a WRAP-UP phase at 90% of the budget (only the tools that write and
      check the deliverable survive), a hard stop at 100% that ends the run
      itself with its best artefact rather than letting an outer killer destroy
      it mid-call, a guard for loops that vary their arguments, and a check-in
      that becomes directive after two asks past halfway have found nothing on
      disk.

      THE MEASUREMENT: on the 2026-09-15 WildClawBench sweep five of twelve
      Code tasks and one Productivity task spent their whole budget and scored
      ZERO, while every Code task that finished scored 0.9-1.0. Two profiled
      runs: `sam3_debug` made 79 LLM calls (584s) and 86 tool calls (435s), ran
      the SAME `exec` nine times and re-read one file six times, and was killed
      at 1200s with nothing written; `connect_the_dots_medium` had no exact
      repeats and was provider-throughput bound. Context was never the problem
      (p50 41k tokens — compaction works).

      NOTE THE UNUSUAL DEFAULT: observe, not off — the honesty-suite reasoning.
      Observe changes nothing an agent sees; it keeps the single 80% note that
      already shipped and logs what enforce would additionally have done, with
      the run id, AT WARNING. The WARNING level is load-bearing rather than
      stylistic: the benchmark container installs no logging configuration, so
      Python's `lastResort` handler drops every record below WARNING, and the
      pre-existing deadline note's `logger.info` line was unreadable in
      `agent.log` for exactly that reason.

      `off` is the engine that shipped, byte for byte — main's note text, main's
      INFO log line, no iteration-0 guard, and no guard object built at all — so
      an off-vs-enforce sweep measures the controls and nothing else.

      BLOCKER: a re-measured WildClawBench 02_Code and
      01_Productivity sweep in the sandbox showing timed-out tasks falling,
      plus `agent_guardrail_events` rows with guardrail_name = 'repeat_guard'
      proving the guard fired on a real repeat rather than on nothing, and ZERO
      `harness_kills` in the rotation ledger — the engine now carries the task
      budget itself, so a kill by the harness backstop is an engine defect. Enforce
      changes what the model sees mid-run and can REFUSE a fifth identical
      `exec`, so it is a behaviour change, not bookkeeping. Read a quiet table
      carefully: the first cut of this control was INERT on exactly the shape it
      targets, because the timeout clamp's per-call annotation changed the
      result digest the repeat counter keyed on, and a zero here would have been
      misread as "the workload has no repeats".
  - name: ROBOTHOR_TRUNCATION_LEDGER_MODE
    owner: ops
    mode: observe
    planned_promotion: "2026-10-15"
    soak: >
      NEW 2026-09-16. A ledger of the tool results this run saw only part of.
      `exec` now writes a truncated stream whole to a file under
      `<workspace>/.robothor/exec/` and hands back `stdout_path`,
      `stdout_chars` and `stdout_truncated`; this decides what happens when a
      run reaches the end without having read any of that back.

      THE MEASUREMENT: on the worst-scoring Social task one listing call was
      cut at 4,000 of 12,431 characters. The response shape was
      `{"records": [...], "total": N}`, so `total` — the one field that would
      have exposed the cut — was itself in the discarded tail. The agent read
      the twelve records it could see, opened its report "all 12", and scored
      FULL MARKS on every graded item whose evidence was inside the window and
      ZERO on every item past it. The extraction was never the weak part.

      Observe changes nothing the agent sees: it keeps the ledger, logs the
      unresolved entries at WARNING with the run id, and writes an
      `agent_guardrail_events` row at finalization. Enforce quotes each
      unresolved entry to the model once and holds a finishing run for exactly
      ONE more ask, after which the run completes with a sentence naming what
      it never read — never a loop, because the failure being corrected is a
      confident wrong answer and a stuck run is not an improvement on it.

      BLOCKER: a re-measured WildClawBench 03_Social sweep in the sandbox, two
      runs of task_2 and task_5, showing the tail actually reached the model's
      answer — plus `agent_guardrail_events` rows with guardrail_name =
      'truncation_ledger' proving entries were registered on real runs. A quiet
      table here means the ledger is inert, not that nothing is truncated; read
      it the way the step-efficiency entry says to.
  - name: ROBOTHOR_ACT_OBSERVE_MODE
    owner: ops
    mode: observe
    planned_promotion: "2026-10-15"
    soak: >
      NEW 2026-09-16. A call that changed something at the other end
      invalidates what the run knew about that source, and nothing in the
      engine said so.

      THE MEASUREMENT: on the second Social task the agent made nineteen
      state-changing calls inside one shell script that printed each one's
      `status` and nothing else. The service returned three follow-up messages
      inline in those very responses; all three were discarded, and no read of
      that inbox happened between the first send and the report. The grader
      scored `output_quality` 1.0 and `severity_accuracy` 0.0 in the same pass.

      Observe logs what would have been said; enforce says it once at a
      deliverable check-in. It blocks nothing on any rung — "look again" is
      advice, and an agent that has genuinely finished has to be able to
      finish. The classification reuses
      `tools/read_only.declared_read_only_tools`, the same table the parallel
      planner trusts, so the two controls cannot disagree about whether a tool
      writes.

      BLOCKER: evidence that the note fires on a real act-then-write run and
      not on a read-only one — `agent_guardrail_events` rows with
      guardrail_name = 'act_observe' from the sandbox sweep, checked against
      the runs' own step ledgers. The shell heuristic is deliberately narrow
      (an HTTP method that is not a read); a zero could mean it is too narrow
      rather than that nothing acted.
  - name: ROBOTHOR_VERDICT_COMMITMENT_MODE
    owner: ops
    mode: observe
    promotion: n/a-on-this-instance
    soak: >
      NEW 2026-09-16. Where a task asked the agent to classify, triage, route
      or prioritise each of several items, the finished artefact should carry
      exactly one verdict per item, with the contradicting evidence folded INTO
      that verdict as its reason.

      THE MEASUREMENT: a planted QA-routing marker sat in one message's footer.
      The agent found it, filed the message as Critical #1 with two named
      owners anyway, and appended "please verify whether this is a live
      incident or a quarterly QA routing test". The rubric was binary and a
      top-of-report P0 is an escalation whatever the footnote says.

      This is the only one of the three observation ladders that touches model
      JUDGEMENT, which is why it has its own flag and why it carries no
      promotion date. It stays on observe until it has been probed by firing a
      REAL double-verdict artefact through it — not by reading a log line it
      prints itself, which is the failure `feedback-probe-dont-trust-silence`
      records. Detection is narrow on purpose: the task must ask for a decision
      per item, and the artefact must show an explicit item identifier under
      two verdict labels or in a block that asks the reader to decide.

      BLOCKER: a probe in the sandbox with (a) a genuine double-verdict report
      that fires it and (b) twenty real task specs read read-only from the
      benchmark checkout that produce nothing. Only after both does a promotion
      date belong here at all.
