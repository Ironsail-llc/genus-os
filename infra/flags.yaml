# Flag manifest — the single inventory of guardrail/RIP rollout flags.
#
# Live values ship via the systemd drop-in (see
# infra/systemd/robothor-engine.service.d/upgrade-rip-flags.conf and
# docs/runbooks/GUARDRAIL_FLIPS.md). This file records intent: who owns each
# flag, what mode production runs, when the next promotion is due, and what
# evidence gates it. guardrail_watch.py nags daily for any flag sitting in
# observe/alert past its planned_promotion date.
#
# mode: off | observe | alert | enforce | on   (on = enabled, no mode ladder)

flags:
  - name: ROBOTHOR_RBAC_MODE
    owner: ops
    mode: enforce
    soak: enforced 2026-07-02; 46 blocks day one (allow-all service default), quiet since

  - name: ROBOTHOR_INJECTION_SCAN_MODE
    owner: ops
    mode: enforce
    soak: flipped 2026-07-13 after zero observed events 2026-07-02 → 2026-07-13

  - name: ROBOTHOR_EXEC_ALLOWLIST_STRICT_MODE
    owner: ops
    mode: enforce
    soak: >
      flipped 2026-07-13. NOTE the original "zero events" evidence was vacuous —
      observe mode wrote no guardrail-event rows at all until #187. The real
      evidence is journald: zero "exec_allowlist would block" warnings across
      14 days. Blast radius is narrow: only auto-agent and email-responder
      define an exec_allowlist, and their allowlisted commands are simple
      single invocations that never need shell metacharacters.

  - name: ROBOTHOR_APPROVAL_MODE
    owner: ops
    mode: enforce
    soak: >
      The gate was INERT until 2026-07-13 (no agent set human_approval_tools, so
      nothing could ever escalate — zero events meant "no mechanism", not "safe").
      Real since then, and as of 2026-09-17 no SHIPPED template declares a gate
      at all: crm-steward's human_approval block became a commented example,
      because arming it in a template made one instance's policy choice the
      default for everyone who installed it — and on that agent's nightly
      unattended scan every delete asked a person, timed out and was denied.
      main and morning-briefing declare no tools_allowed and no human_approval,
      so they hold every delete tool UNGATED. Neither doctor check reports them:
      both scope to grants a manifest made ON PURPOSE, because "this agent is
      unrestricted" is a different finding and counting it fires on a clean
      install. vault_delete and
      gws_calendar_delete are named here as intent and are not covered by the
      check; docs/TOOLS.md says so plainly.
      Two checks, split by what they read, and BOTH info so that neither can
      mark an instance degraded for running the way the platform is designed to
      run: agents.approval_gate_available reads the manifests and states which
      destructive grants have no gate, plus the two keys that add one;
      agents.approval_gate_not_armed is this engine not enforcing the gates the
      manifests DID declare, which promoting this flag is exactly what fixes.
      The first was agents.destructive_tool_not_gated at recommended until
      2026-09-17, and an instance read the recommendation as an instruction.
      Deliberately narrow: the operator's standing mandate is autonomous
      operation, so sending email, calendar creation and everything else stay
      ungated, and the gate is for irreversible external actions — a refund, a
      payment — that an instance chooses to queue.
      Timeout = deny, fail-secure; the default is 300s
      (models.py human_approval_timeout), not the 600s this entry used to say.
      Probe-verified: deletes escalate, gws_gmail_send and search_memory stay
      autonomous.
  - name: ROBOTHOR_SANDBOX_DEFAULT_MODE
    owner: ops
    mode: observe
    planned_promotion: "2026-09-16"
    soak: >
      BLOCKER: per-agent settlement first (main/crm-hygiene/email-analyst keep
      host with reason; conversation-inbox/vision-monitor lose exec;
      auto-agent declares docker), then enforce governs only future agents.
      Four of the six exec-holding agents declare `sandbox: host`, and that
      opt-out is honoured BEFORE the mode is consulted, so flipping this today
      would containerise two agents and leave the four with the widest blast
      radius exactly as they are — while the dashboard read `enforce`. The
      flag is not the decision; the six manifests are. Once they are settled,
      this mode is only a default for agents that never asked. Originally
      dated 2026-09-01.

      The infrastructure this flag depends on now EXISTS (#207). Everything the
      previous note said was missing has been built:

        * `exec` routes through the sandbox (it never did — filesystem.py ran
          subprocess.run(shell=True) on the host and never called
          get_current_sandbox());
        * the workspace is mounted (there were no -v flags at all);
        * the container is a boundary: --network=none by default, --cap-drop=ALL,
          --security-opt no-new-privileges, --pids-limit, --user;
        * the image is built by scripts/build-sandbox-image.sh and the script
          PROBES it (the old image had no git and no python, so an auto-agent run
          — whose job is running the test suite — would have failed on its first
          command);
        * the runtime is rootless podman (ROBOTHOR_SANDBOX_BINARY), which removes
          the root-equivalent docker socket. Do NOT add the engine user to the
          docker group: that group is root, and it would defeat the sandbox it
          enables.

      Probed on the box through the real exec handler: ran in-container, workspace
      mounted, pipes work, NETWORK_BLOCKED, HOST_HOME_NOT_VISIBLE, NO_SUDO. Rootless
      podman also works under NoNewPrivileges=yes, so #205's containment and the
      sandbox coexist.

      THE GATE HAS NOW BEEN RUN, AND THE ANSWER IS: DO NOT FLIP THIS GLOBALLY.

      A real auto-agent run was driven through the daemon and its container came
      up and was fully contained (workspace mounted, NETWORK_BLOCKED,
      HOST_HOME_NOT_VISIBLE, NO_SUDO). The sandbox works.

      But the commands the LIVE exec-holding agents actually run were then executed
      inside that same container, and they fail — because the sandbox correctly
      removes exactly what they depend on:

        crm-hygiene    psql              FAILS  (no DB socket in the container)
        crm-hygiene    curl the bridge   FAILS  (--network=none)
        email-analyst  gog OAuth tokens  FAILS  (host $HOME is not mounted)
        email-analyst  gog binary        FAILS  (not in the image)

      Global `enforce` would fail-close the CRM and email pipelines. And the way to
      "fix" that — mount the DB socket, mount the OAuth tokens, open the network —
      hands back most of what the sandbox took away, on the agents with the widest
      blast radius. That is not containment, it is a container.

      So containment is per-agent and deliberate, not a global default:

        * repo-only work (auto-agent: run the test suite) -> `sandbox: docker`,
          which now fails CLOSED on its own regardless of this flag (#207);
        * host-resource work (main, crm-hygiene, conversation-inbox, email-analyst,
          vision-monitor) -> stays on the host. Its blast radius is bounded by the
          systemd confinement in #205 (no sudo, no root, read-only $HOME, workspace
          the only writable tree), which is the honest control for these agents.

      To contain those agents for real, give them tools instead of a shell — the
      escape hatch is `python3 << EOF <arbitrary code>`, and no allowlist or
      container placed around a general-purpose shell fixes that.

      GOTCHA if you do flip it per-agent: ProtectHostname=yes in the engine unit
      makes the UTS namespace immutable and every container dies at init with
      "sethostname: operation not permitted". Set ProtectHostname=no.

      Note: an agent with an explicit manifest `sandbox: docker` now fails CLOSED
      on its own, regardless of this flag (#207) — the global mode is a default for
      agents that never asked, not an override for one that did.

  - name: ROBOTHOR_COMPLETION_CONTRACTS_MODE
    owner: ops
    mode: enforce
    promoted: "2026-07-14"
    soak: >
      PROMOTED. The mechanism demonstrably fires — 3 real events, all
      email-analyst "no evidence recorded" — so this is not one of the controls
      that was silently inert. The evidence-wiring gap those 3 events pointed at
      has been fixed, and there have been none since.

      Enforce here is non-destructive: it does not fail the run or block a tool.
      It records the unevidenced completion and writes a `next_action` via
      dal.set_next_action(), leaving the task open. The alternative — silently
      accepting an agent's claim that it finished something with no evidence — is
      strictly worse than an open task with a next step on it.

  - name: ROBOTHOR_DELIVERABLE_CONTRACT_MODE
    owner: ops
    mode: observe
    planned_promotion: "2026-09-30"
    soak: |
      The complement of ROBOTHOR_COMPLETION_CONTRACTS_MODE. That one asks
      whether the agent's CLAIMS are backed by evidence in its own trace; this
      one asks whether the artifact the TASK named actually exists. An agent
      passes the first and fails the second by doing the work correctly and
      saving it to the wrong path — measured 2026-08-26 as -0.87 of a -1.04
      competitive gap in which 7 of 10 tasks were already at parity. One
      misdelivered artifact, not a capability deficit, is most of the gap.
      (robothor/engine/feature_flags.py: deliverable_contract_mode)

      2026-09-16: it now checks the SHAPE, not only the path. Three
      Productivity tasks of the public benchmark scored 0 against a
      competitor's 86 / 91 / 49 with the file present and the shape wrong —
      our own TSV columns, our own manifest path, our own section headings.
      Extraction grew typed items (exact output set, header, JSON field set,
      section headings, sort order), each read only from explicit spec
      language. Migration 123 added agent_runs.task_text so the verdict has a
      source at finalization at all.

      Ladder: observe logs the verdict, alert tells the operator, enforce
      turns the deliverable check-in into a comparison, re-asks the model ONCE
      with the report, and then fails the run rather than letting it report
      completed. Evidence lands in agent_guardrail_events under
      guardrail_name = 'deliverable_contract' (robothor/flags/evidence.py;
      written by robothor/engine/deliverable_verdict.py).

      This entry did not exist until 2026-09-02, and neither did the runbook.
      The flag was set ONLY in /etc/robothor/robothor.env — flag_audit.py's
      SHADOW-LAYER:envfile — so nothing in git recorded that the control was
      on and a rebuilt instance would have come up without it. It now ships in
      the versioned drop-in at the value it was already running.

      DO NOT PROMOTE ON THIS EVIDENCE. There is exactly ONE observed row on
      record. That is enough to prove the writer is wired and not enough to
      characterise anything:

        SELECT action, count(*) FROM agent_guardrail_events
        WHERE guardrail_name = 'deliverable_contract'
        GROUP BY 1;

      Know WHY the table is quiet before reading anything into it. Probed
      against production 2026-08-27: of 4,000 crm_tasks over 60 days, ZERO
      named an explicit output path — delegated tasks here are written in
      prose. The contracts live in prompt-borne task specs, which is why
      task_text_for_run falls back to the run's originating message. Wired to
      crm_tasks alone this would be a guard on an empty table, the mistake
      this instance has made six times (feedback-probe-dont-trust-silence).

      Gate for alert: (1) >= 20 observed verdicts across at least three
      different agents, (2) every `observed` row hand-checked against the run
      that produced it — a deliverable the task never actually named is a
      checker bug and the dominant false-positive class here, (3) the
      -0.87-shaped failure reproduced in production data, not only in the
      benchmark that found it. Before enforce, additionally: >= 7 days at
      alert with no operator-reported false block, since enforce is the rung
      that stops a run from closing its task, AND a refusal audit — at least
      one task the agent was right to decline, run at enforce, confirming the
      re-ask did not push it into producing the artifact anyway. That hazard
      is real (safety tasks name output paths) and it is invisible in a
      false-positive count.

      NOTE on re-probing: rows written before migration 123 came from runs
      whose prompt was never persisted, so an observe window that starts
      before it is not evidence about the current control.
      Runbook: docs/runbooks/DELIVERABLE_CONTRACT.md

      BLOCKER: exactly one observed row exists and the note says not to
      promote on it. Needs the deliverable contract to produce verdicts on
      real runs (know WHY the table is quiet first), then >= 7 days at
      alert with the operator reading the banners.

  - name: ROBOTHOR_RIP_7_MODE
    owner: ops
    mode: enforce
    soak: >
