# Flag manifest — the single inventory of guardrail/RIP rollout flags.
#
# Live values ship via the systemd drop-in (see
# infra/systemd/robothor-engine.service.d/upgrade-rip-flags.conf and
# docs/runbooks/GUARDRAIL_FLIPS.md). This file records intent: who owns each
# flag, what mode production runs, when the next promotion is due, and what
# evidence gates it. guardrail_watch.py nags daily for any flag sitting in
# observe/alert past its planned_promotion date.
#
# mode: off | observe | alert | enforce | on   (on = enabled, no mode ladder)

flags:
  - name: ROBOTHOR_RBAC_MODE
    owner: ops
    mode: enforce
    soak: enforced 2026-07-02; 46 blocks day one (allow-all service default), quiet since

  - name: ROBOTHOR_INJECTION_SCAN_MODE
    owner: ops
    mode: enforce
    soak: flipped 2026-07-13 after zero observed events 2026-07-02 → 2026-07-13

  - name: ROBOTHOR_EXEC_ALLOWLIST_STRICT_MODE
    owner: ops
    mode: enforce
    soak: >
      flipped 2026-07-13. NOTE the original "zero events" evidence was vacuous —
      observe mode wrote no guardrail-event rows at all until #187. The real
      evidence is journald: zero "exec_allowlist would block" warnings across
      14 days. Blast radius is narrow: only auto-agent and email-responder
      define an exec_allowlist, and their allowlisted commands are simple
      single invocations that never need shell metacharacters.

  - name: ROBOTHOR_APPROVAL_MODE
    owner: ops
    mode: enforce
    soak: >
      The gate was INERT until 2026-07-13 (no agent set human_approval_tools, so
      nothing could ever escalate — zero events meant "no mechanism", not "safe").
      Now real: main opts in for irreversible DESTRUCTION only —
      delete_person/company/task/note, vault_delete, gws_calendar_delete.
      Deliberately narrow: the operator's standing mandate is autonomous
      operation, so sending email, calendar creation and everything else stay
      ungated. A delete cannot be undone and is rare, so one Telegram tap costs
      nothing. Timeout (600s) = deny, fail-secure. Probe-verified: deletes
      escalate, gws_gmail_send and search_memory stay autonomous.
  - name: ROBOTHOR_SANDBOX_DEFAULT_MODE
    owner: ops
    mode: observe
    planned_promotion: "2026-09-01"
    soak: >
      DO NOT PROMOTE ON A CLEAN SOAK. The soak is structurally incapable of
      telling us anything, and enforcing today would break the email pipeline
      while containing nothing.

      The guardrail does not do what its name says. `exec` NEVER routes through
      the sandbox: tools/handlers/filesystem.py runs subprocess.run(shell=True)
      on the host and never consults get_current_sandbox(). Only browser.py and
      desktop.py enter the container — and none of the three agents this flag
      would sandbox (auto-agent, auto-researcher, email-analyst) use browser or
      desktop tools at all. There are also no volume mounts in the docker run,
      infra/sandbox/Dockerfile is never built or tagged, and the docker group
      has no members, so Sandbox.start() cannot succeed on this box.

      "Zero events" is a FALSE NEGATIVE, not evidence of safety: the observe
      event fires at step 0 of every run of an exec-holding agent, and
      auto-agent and auto-researcher are `enabled: false` — they cannot emit a
      soak event at all. email-analyst is live but rare. On the next complex
      inbound email after a flip, sandbox start fails, the run fail-closes
      (correctly, #201), and the email pipeline silently loses its analysis
      stage — a missing-infrastructure failure wearing a guardrail's clothes.

      GATE (not a date): route exec through the sandbox, build the image, mount
      the workspace, move to rootless podman. Then probe one real auto-agent run
      INSIDE the container and confirm it works — not merely that it does not
      error. See the Phase 2 plan.

  - name: ROBOTHOR_COMPLETION_CONTRACTS_MODE
    owner: ops
    mode: observe
    planned_promotion: "2026-07-20"
    soak: >
      3 events, all email-analyst "no evidence recorded" — move to alert, fix
      the agent's evidence wiring, enforce after 7 clean days

  - name: ROBOTHOR_RIP_7_MODE
    owner: ops
    mode: enforce
    soak: >
      flipped 2026-07-13. The cleanest evidence of any flag — and the only one
      whose mechanism is positively PROVEN rather than merely silent. Its
      evidence lives in memory_facts_audit (not agent_guardrail_events): three
      pre_update_drift_detected rows, all 2026-05-28, two of which are
      deliberate tamper fixtures ("[tampered]", "[tamper2]") — the detector
      caught them. Zero live detections in the 45 days since. Enforce
      audit-snapshots and refuses a write whose content hash drifted
      underneath us.

  - name: ROBOTHOR_RIP_13_MODE
    owner: ops
    mode: observe
    planned_promotion: "2026-07-20"
    soak: symbolic short-term memory; same overdue ladder as RIP 7

  - name: ROBOTHOR_RIP_1_ENABLED
    owner: ops
    mode: "on"
    soak: accretion fork, main-only via ROBOTHOR_RIP_1_AGENTS; fleet expansion pending clean soak

  - name: ROBOTHOR_RIP_4_ENABLED
    owner: ops
    mode: "off"
    planned_promotion: "2026-07-27"
    soak: staged-soak comment in drop-in since May — run the documented soak or delete the rip

  - name: ROBOTHOR_RIP_5_ENABLED
    owner: ops
    mode: "off"
    planned_promotion: "2026-07-27"
    soak: >
      destructive LLM curator — deliberately OFF; requires proven restore
      drill + dry-run diffs before any enablement

  - name: ROBOTHOR_JUDGE_ENABLED
    owner: ops
    mode: "on"
    soak: goal-judge observe since May; compare against benchmark_pass_rate before weighting grades
