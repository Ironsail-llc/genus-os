# The last-good backup markers (scripts/backup-state.sh).
#
# On NVMe, on purpose: the disk that breaks must not be the disk that holds the
# evidence of when it last worked. A marker on the backup volume disappears
# exactly when it is needed — which is what made "when did the offsite copy
# last succeed?" unanswerable during the 2026-08-27 outage.
#
# 2775, not 0755: setgid so every marker inherits the group whatever wrote it,
# and group-writable because the writers are four different units. The nightly
# dump and the base backup run as the service user, wal-offsite ships from a
# postgres-group context, and the volume guard writes nothing here but reads
# all of it as root. A marker one of them cannot rewrite is a marker that goes
# stale and reads as an outage that is not happening.
#
# `robothor` in the user and group columns is the service-account PLACEHOLDER
# (see infra/systemd/README.md); scripts/install-units.sh renders it to
# $ROBOTHOR_SERVICE_USER via `render-unit.sh --tmpfiles`. Those columns are
# POSITIONAL, so the `User=`/`Group=` rule that covers the unit templates
# cannot see them.
#
# /var/lib/robothor is a real persistent path, not a placeholder, and is never
# substituted — unlike /run/robothor state, these markers must survive a
# reboot, because "no successful run recorded" after every boot would read as
# an outage.
d /var/lib/robothor/backup-state 2775 robothor robothor -
