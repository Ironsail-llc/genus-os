# The request directory must exist and be writable by the engine's user, and
# must NOT be writable by anyone else — the filename is the authorization.
#
# `robothor` in the user and group columns is the service-account PLACEHOLDER
# (see infra/systemd/README.md); scripts/install-units.sh renders it to
# $ROBOTHOR_SERVICE_USER via `render-unit.sh --tmpfiles`. Those columns are
# POSITIONAL, so the `User=`/`Group=` rule that covers the unit templates
# cannot see them — that is exactly why the flag exists, and why this file
# shipped once with a real operator username in it.
#
# The /run/robothor path is a real runtime path, not a placeholder, and is
# never substituted.
d /run/robothor/restart-requests 0700 robothor robothor -

# The pager's durable spool: a page that could not be delivered (DNS down at
# boot) is written here and re-sent by the next send or the next liveness tick.
#
# /var/lib, not /run: the boot window that breaks a page usually ends in a
# reboot, and a tmpfs spool would lose it exactly there.
#
# 1777 sticky, and `-` for the account columns (systemd-tmpfiles then leaves it
# root-owned) because the writers are not one account: root's units spool here
# via OnFailure=, and the operator's cron jobs spool here through
# scripts/cron-wrapper.sh. Neither can chown the other's files. World-writable
# lets both write; the sticky bit keeps each able to delete only its own, and
# the drain deletes only what it delivered. A non-world-writable directory
# would silently drop every page raised by whichever account does not own it.
d /var/lib/robothor/alert-spool 1777 - - -
