# The last-good marker for the daily guardrail watch (scripts/guardrail_watch.py
# mark_run_completed()), read by S8 in scripts/slo_probe.sh.
#
# WHY IT HAS TO SURVIVE A REBOOT
#   S8 asks systemd when robothor-guardrail-watch.service last exited. That
#   property — ExecMainExitTimestamp — is per-unit RUNTIME state, and a reboot
#   empties it. At 03:01 on 2026-09-03, hours after a boot, the hourly probe
#   read the empty property as "no completed run on this box" and paged, while
#   the 08:30 run the day before had finished cleanly. Every reboot day
#   produced that false page.
#
#   So /var/lib, not /run, exactly like the backup markers next door: the
#   evidence of when something last worked must outlive the thing that forgets
#   it. A marker on tmpfs would vanish at precisely the moment it is the only
#   thing that can answer.
#
# 2775, not 0755: setgid so the marker inherits the group whatever wrote it,
# and group-writable because the writer and the reader are not the same
# account. The daily report runs as the service user; the hourly probe runs as
# root and only reads. A marker the report cannot rewrite goes stale and reads
# as an outage that is not happening.
#
# `robothor` in the user and group columns is the service-account PLACEHOLDER
# (see infra/systemd/README.md); scripts/install-units.sh renders it to
# $ROBOTHOR_SERVICE_USER via `render-unit.sh --tmpfiles`. Those columns are
# POSITIONAL, so the `User=`/`Group=` rule that covers the unit templates
# cannot see them.
#
# /var/lib/robothor is a real persistent path, not a placeholder, and is never
# substituted.
d /var/lib/robothor/slo-state 2775 robothor robothor -
