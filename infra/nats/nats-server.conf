# NATS Server Configuration — Genus OS federation broker
#
# TRACKED. infra/systemd/robothor-nats.service points at /etc/nats/nats-server.conf,
# which was untracked until 2026-08-27 — a rebuild from the repo produced a service
# whose config file nothing in the repo created. Install with scripts/install-units.sh.

listen: 127.0.0.1:4222

jetstream {
    store_dir: /var/lib/nats/jetstream
    max_mem: 256MB
    max_file: 1GB
}

# NO leafnode listener.
#
# Until 2026-08-27 this file carried:
#
#     leafnodes { listen: 0.0.0.0:7422 }
#
# with no `authorization` block. A leafnode binding an unauthenticated listener joins
# the global $G account — the same account the engine's own client uses — which
# includes $JS.API.>, i.e. create/purge/delete on every stream in a 1GB JetStream
# store. That is an unauthenticated remote administrative interface to the message
# store, listening on every interface, on a host where Tailscale bypasses UFW
# (`-A INPUT -j ts-input` accepts tailscale0 unconditionally).
#
# Nothing ever used it: federation has never connected in either direction since the
# package landed 2026-03-09 — zero cid/lid/rid tokens in the whole server log, and
# JetStream is 8KB with no stream ever created.
#
# Federation v1 uses direct client connections into PER-CONNECTION ACCOUNTS, which
# gives the same isolation without a second nats-server on every child, and makes the
# parent/child asymmetry structural: the parent's account exports no service to a
# child's account, so a child has no subject on which to address its parent at all.
# Per-connection account blocks are generated by `robothor federation invite` into
# federation.d/ and applied with a SIGHUP reload — never hand-edited.
#
# If leafnodes return (v2, for offline-resilient children), they come back WITH an
# authorization block and their own account, never in $G.

# Per-connection accounts are included individually as they are generated --
# `include` takes a FILE, not a directory (nats-server: "read federation.d: is a
# directory"), so `robothor federation invite` appends one include line per
# connection rather than globbing. No includes exist yet: zero connections.

log_file: /var/log/nats/nats-server.log
log_size_limit: 50MB
max_traced_msg_len: 256
