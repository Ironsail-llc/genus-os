# Claude Code driver (the claude_code_* tools) on the HOST login.
#
# With no CLAUDE_CODE_OAUTH_TOKEN stored (`robothor claude-code login`), a
# coding job runs on the Claude Code login the service user already has on
# this host (ROBOTHOR_CLAUDE_CODE_AUTH=auto|host). Claude Code refreshes that
# OAuth login under ~/.claude and rewrites ~/.claude.json, and the engine's
# ProtectHome=read-only (hardening.conf) makes both read-only: the job would
# fail at its first token refresh. These two optional (`-`) entries make
# exactly those writable and nothing else in the home.
#
# Claude Code rewrites ~/.claude.json atomically (a temp file and a lock
# directory beside it in ~, then a rename), which a read-only home still
# refuses; that write is best-effort and non-fatal. Verified with CLI 2.1.289
# under bwrap with `/` read-only and only these two paths bound writable: a
# headless call authenticated and completed. The login itself (the OAuth
# credential and its refresh) lives under ~/.claude, which is fully writable.
#
# This widens nothing a job's own shell can reach: every job's Bash runs in
# Claude Code's sandbox, which denies READS of ~/.claude and ~/.claude.json
# (robothor/engine/coding/sandbox.py). Only the Claude Code parent process,
# which owns the login anyway, writes here.
#
# Absolute paths, NOT %h: in a system unit %h is /root (see zz-sandbox.conf).
# /home/robothor is the service-home placeholder scripts/render-unit.sh renders.
# `robothor doctor` (claude_code.ready) checks both are writable when the host
# login is the credential in use.
#
# ProtectKernelTunables=no and ProtectKernelLogs=no: Claude Code's Bash
# sandbox is bubblewrap in a new user AND pid namespace, which mounts a fresh
# /proc. The kernel refuses that mount in a user namespace while /proc carries
# overmounts, and these two directives (hardening.conf, the unit) are exactly
# the ones that overmount it: each alone makes `bwrap --proc /proc
# --unshare-user --unshare-pid` fail "Can't mount proc". failIfUnavailable does
# not catch it — claude starts and every Bash call errors — so a review ran
# with no git at all (2026-10-05). ProtectProc=, ProtectClock=,
# ProtectHostname=, ProtectControlGroups= and an empty CapabilityBoundingSet=
# are fine and stay on. The loss is small: the engine is non-root with no
# capabilities and NoNewPrivileges=yes, so it could not write /proc/sys or
# read the kernel log anyway. This file sorts after hardening.conf, so it
# wins. `robothor doctor` (claude_code.ready) probes the /proc mount and
# reads both properties off the engine unit.
[Service]
ReadWritePaths=-/home/robothor/.claude
ReadWritePaths=-/home/robothor/.claude.json
ProtectKernelTunables=no
ProtectKernelLogs=no
