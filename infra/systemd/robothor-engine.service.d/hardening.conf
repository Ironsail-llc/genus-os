# Containment — see infra/systemd/robothor-engine.service for full rationale.
# The engine user has passwordless sudo and agents hold unrestricted `exec`,
# so the service account IS the blast radius of a prompt injection.
#
# Template — /opt/robothor is the workspace placeholder and /home/robothor
# the service-home placeholder (infra/systemd/README.md); render through
# scripts/render-unit.sh before installing or comparing against live.
[Service]
NoNewPrivileges=yes
RestrictSUIDSGID=yes
CapabilityBoundingSet=
AmbientCapabilities=

ProtectSystem=strict
ProtectHome=read-only
ReadWritePaths=/opt/robothor
ReadWritePaths=/home/robothor/.config/robothor
ReadWritePaths=/home/robothor/.config/gws
ReadWritePaths=/home/robothor/.config/gog
ReadWritePaths=/home/robothor/.config/gogcli
ReadWritePaths=/home/robothor/.cache
ReadWritePaths=/run/robothor
ReadWritePaths=/var/run/postgresql
# Deliberately NOT mirrored from live: ReadWritePaths=/mnt/robothor-backup.
# No code under robothor/ touches that mount — the backup units
# (robothor-backup-local/offsite) run as their own systemd services — so
# granting the engine write access here has no functional upside and is
# pure blast radius: a prompt-injected agent with `exec` could delete 238GB
# of backups. The live drop-in still carries this line; its removal is
# applied by the coordinator in a controlled window after this mirror merges.

PrivateTmp=yes
BindReadOnlyPaths=/tmp/.X11-unix

ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictRealtime=yes
LockPersonality=yes
