# Rootless podman for the agent sandbox.
#
# #205 set ProtectHome=read-only, which would otherwise make podman's own state
# unwritable: Sandbox.start() would fail and (correctly, per #201) fail CLOSED,
# taking every sandboxed agent down. These are podman's graphroot, its config,
# and its runroot.
#
# Absolute paths, NOT %h: in a *system* unit %h is the service manager's home
# (/root), not User='s. Using %h here made systemd try to bind /root/.config/
# containers and the engine refused to start (status=226/NAMESPACE).
#
# Verified: rootless podman starts fine under NoNewPrivileges=yes, so #205's
# containment and the sandbox coexist.
#
# Template — /home/robothor is the service-home placeholder rendered by
# scripts/render-unit.sh at install time; this file exists precisely because
# %h broke, so absolute (rendered) paths here are deliberate, not an
# oversight. XDG_RUNTIME_DIR / /run/user/1000 assume the service user's uid
# is 1000; adjust at install if the instance's account differs.
#
# This file has never granted /mnt/robothor-backup access — that
# ReadWritePaths entry lived in hardening.conf, not here, and has been
# dropped from that mirror (see the comment there): no code under robothor/
# touches the backup mount, so granting write access to it is pure
# injected-agent blast radius with no functional upside.
[Service]
Environment=ROBOTHOR_SANDBOX_BINARY=podman
Environment=XDG_RUNTIME_DIR=/run/user/1000
ReadWritePaths=-/home/robothor/.local/share/containers
ReadWritePaths=-/home/robothor/.config/containers
ReadWritePaths=-/run/user/1000

# ProtectHostname=yes (from #205) makes the service's UTS namespace immutable,
# so the container runtime cannot sethostname() and every container dies at init
# with "OCI permission denied". The hardening was blocking the sandbox it exists
# to enable.
#
# Dropping it costs essentially nothing here: CapabilityBoundingSet= is empty, so
# the service has no CAP_SYS_ADMIN and cannot change the host's hostname anyway.
# ProtectHostname was belt-and-braces; the sandbox is the actual boundary.
ProtectHostname=no
