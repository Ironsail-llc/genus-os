[Service]
# Tier 1 upgrade rollout flags (see hermes-gap-analysis-2026-05-28).
# Add ROBOTHOR_RIP_<N>_ENABLED=1 entries here as each rip moves from
# observe → alert → enforce per the plan. Remove a flag (or set =0)
# to turn the rip off cleanly without a code change.

# Rip 7: external-drift detection for memory_facts.
# Mode: observe (default) for 7 days, then alert, then enforce.
Environment=ROBOTHOR_RIP_7_ENABLED=1
Environment=ROBOTHOR_RIP_7_MODE=observe

# Goal-judge (self-improvement Phase 1). OBSERVE mode: writes goal_achievement
# reviews nightly via evening-winddown, but no manifest goal scores the metric
# yet, so it does not move the grade — compare against benchmark_pass_rate for
# ~7 days, then flip the weights. Set =0 to disable cleanly.
Environment=ROBOTHOR_JUDGE_ENABLED=1

# Background-review fork (Rip 1) — the accretion engine ("wake up to a smarter
# agent"). SOAK on main ONLY first (ROBOTHOR_RIP_1_AGENTS) per the adversarial
# review; expand to fleet after a clean ~48h soak. The exclusion guard blocks
# benchmark/sub-agent/nested forks (no fork-spawns-fork). RIP_5 (destructive LLM
# curator) stays OFF until the soak is clean.
Environment=ROBOTHOR_RIP_1_ENABLED=1
Environment=ROBOTHOR_RIP_1_AGENTS=main

# ──────────────────────────────────────────────────────────────────────
# Phase B harness + memory + recall enablement (2026-05-30, verified pass).
# Efficiency:
Environment=ROBOTHOR_RIP_16_ENABLED=1
Environment=ROBOTHOR_RIP_17_ENABLED=1
Environment=ROBOTHOR_RIP_18_ENABLED=1
# Semantic recall (R1/R2):
Environment=MEMORY_TEMPORAL_COHERENCE=1
Environment=MEMORY_CRON_WARMUP_RECALL=1
Environment=MEMORY_NARROW_SEARCH=1
# Memory cognitive layers:
Environment=ROBOTHOR_RIP_12_ENABLED=1
Environment=ROBOTHOR_RIP_13_ENABLED=1
Environment=ROBOTHOR_RIP_13_MODE=observe
Environment=ROBOTHOR_RIP_14_ENABLED=1
Environment=ROBOTHOR_RIP_15_ENABLED=1
# Accretion lifecycle (RIP_1 already on for main; RIP_3 anti-bloat MUST precede):
Environment=ROBOTHOR_RIP_3_ENABLED=1
#STAGED-SOAK Environment=ROBOTHOR_RIP_4_ENABLED=1
# RIP_5 (destructive LLM curator) intentionally LEFT OFF pending documented soak.

# ──────────────────────────────────────────────────────────────────────
# Memory "100%" optimization (2026-05-30, branch feat/memory-100-optimization).
# Live eval 8/12 -> 12/12; migration 078 applied. All verified on prod data.
# Recall (read-path, highest leverage):
Environment=MEMORY_RERANK_WIDE=1
Environment=MEMORY_EPISODE_MERGE=1
Environment=MEMORY_WARMUP_RECALL_V2=1
# Anti-churn (write/lifecycle):
Environment=MEMORY_CONSOLIDATION_GUARD=1
Environment=MEMORY_WRITE_DEDUP=1
Environment=MEMORY_INGEST_SKIP_GENERATED=1
# Capture + cognitive populators:
Environment=MEMORY_RESOLUTION_CAPTURE=1
Environment=MEMORY_INTENT_POPULATE=1
Environment=MEMORY_VAULT_POPULATE=1

# ── Security guardrail ladders (2026-07-02). RBAC=enforce (allow-all service
# default → ~0 false positives); the rest OBSERVE until agent_guardrail_events
# shows a clean 48h, then operator flips _MODE=enforce. See guardrail-watch.
Environment=ROBOTHOR_RBAC_ENABLED=1
Environment=ROBOTHOR_RBAC_MODE=enforce
Environment=ROBOTHOR_SANDBOX_DEFAULT_ENABLED=1
Environment=ROBOTHOR_SANDBOX_DEFAULT_MODE=observe
Environment=ROBOTHOR_EXEC_ALLOWLIST_STRICT_ENABLED=1
Environment=ROBOTHOR_EXEC_ALLOWLIST_STRICT_MODE=enforce
Environment=ROBOTHOR_APPROVAL_FAILCLOSED_ENABLED=1
Environment=ROBOTHOR_APPROVAL_MODE=observe
Environment=ROBOTHOR_INJECTION_SCAN_ENABLED=1
Environment=ROBOTHOR_INJECTION_SCAN_MODE=enforce
