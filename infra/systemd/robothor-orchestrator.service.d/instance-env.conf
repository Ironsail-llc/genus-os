# Mirrors a drop-in that predates zz-rls.conf and points at the same file, with
# a leading `-` so a missing env file is not an error. It is kept only so that
# installing these templates over the live box is a no-op; zz-rls.conf supersedes
# it (same EnvironmentFile=, mandatory), and pruning this file is a follow-up
# for whoever owns the box, not something an installer should decide.
[Service]
EnvironmentFile=-/etc/robothor/robothor.env
