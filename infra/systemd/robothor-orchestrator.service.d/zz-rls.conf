# The services that never loaded the main config got neither ROBOTHOR_DB_USER
# nor ROBOTHOR_RLS_ENABLED. robothor/config.py then falls back to $USER — the
# account the unit runs as, which on a single-box instance is the operator's
# own and is typically a Postgres SUPERUSER, and a superuser bypasses RLS
# unconditionally. With app.tenant_id unset the policy goes permissive as
# well: a double bypass, in which the service could read every tenant's rows
# while the instance reported RLS "enabled".
#
# Mandatory (no leading `-`) on purpose: if the env file is missing, the unit
# must fail to start rather than come up silently bypassing tenant isolation.
[Service]
EnvironmentFile=/etc/robothor/robothor.env
