# 2026-08-27: the orchestrator bound 0.0.0.0:9099 with NO authentication.
# Verified reachable from a tailnet address: HTTP 200 on /docs, serving a
# "Hybrid RAG pipeline with memory search" to 62 tailscale peers (39 offline,
# one last seen 211 days ago). The engine and bridge both return 401 on the
# same path; this did not.
#
# Tailscale bypasses UFW entirely -- `-A INPUT -j ts-input` is the first jump
# and accepts tailscale0 unconditionally (2.1M packets through that rule), so
# the UFW rules below it never evaluate for tailnet traffic. The tailnet ACL
# was the only thing in front of this.
#
# Safe to bind loopback: cloudflared reaches it at http://localhost:9099 and
# robothor/vision/service.py defaults to http://localhost:9099. The Cloudflare
# Access-protected public hostname is unaffected.
#
# robothor-orchestrator.service now carries the same --host 127.0.0.1 in its
# own ExecStart, so this drop-in is belt-and-braces; it is mirrored because it
# is live on the box, and removing it is a decision for the box's owner.
[Service]
ExecStart=
ExecStart=/opt/robothor/venv/bin/python -m uvicorn robothor.api.orchestrator:app --host 127.0.0.1 --port 9099
