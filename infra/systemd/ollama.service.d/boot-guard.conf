# Do not start inference when the crash-loop breaker has inhibited it.
# See infra/systemd/robothor-boot-guard.service: this box is remote-only, and a
# reboot loop costs administrative access, so a looping box is left idle and
# reachable rather than restarted into the same wall.
[Unit]
ConditionPathExists=!/run/robothor/INHIBIT_INFERENCE
