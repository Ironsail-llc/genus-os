# Model RESIDENCY, separated from thermal containment.
#
# 2026-08-26: thermal-limits.conf set OLLAMA_MAX_LOADED_MODELS=2 alongside the
# CPU quota and NUM_PARALLEL cap. Those bound concurrent INFERENCE, which is
# what generates heat. MAX_LOADED_MODELS bounds RESIDENCY, which costs memory
# and no compute — a loaded-but-idle model produces no heat.
#
# Bundling them cost 15x on memory search. With the OpenRouter key capped the
# fleet fell back to the local 27B, which permanently occupies one of the two
# slots; the reranker took the other; so the embedder had none and was evicted
# and reloaded on EVERY search. Measured: first embed 2.92s (cold load),
# second and third 0.055s (warm). Memory searches ran 2.9-6.6s against a
# 353ms baseline.
#
# All four models resident total 20.9 GB, against 64 GB available. NUM_PARALLEL
# stays at 2, so inference concurrency — and therefore the thermal envelope —
# is unchanged. Revert by deleting this file if package temps rise.
[Service]
Environment=OLLAMA_MAX_LOADED_MODELS=4
