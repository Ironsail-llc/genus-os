# Thermal containment (2026-08-19): ollama was thrashing the shared GB10
# package (87C acpitz, three prior thermal hard-cuts on this box).
# CPUQuota bounds the CPU-side work; GPU inference is paced by the freq cap
# and the ingest cadence. CPUWeight keeps the engine responsive under load.
[Service]
CPUQuota=500%
CPUWeight=60
Nice=10

[Service]
# 2026-08-28: NUM_PARALLEL 2 -> 1, reverting the 2026-08-24 latency change.
#
# That change reasoned the thermal exposure was "bounded because the thermal
# guard throttles at 85C, pages at 90C and clean-reboots at 94C". It was: the
# guard rebooted the box three times on 2026-08-28.
#
# Measured that day (docs/runbooks/THERMAL.md): package temperature tracks GPU
# power at ~0.65 C/W. ONE 27B stream draws ~62W and plateaus near 85C. TWO
# reach ~74W and 91-96C — past WARN_C, into the reboot. There is no pacing
# policy that makes a second concurrent slot safe on this package, because the
# heat is generated by the streams already running, not by the ones refused.
#
# Reranker latency regresses with =1. That is the trade: this instance is
# administered remotely, and a slower memory search is recoverable where a
# reboot loop is not. Raise it only with new measurements showing headroom.
Environment=OLLAMA_NUM_PARALLEL=1

# MAX_LOADED_MODELS is deliberately NOT set here — residency is a memory
# decision, not a thermal one, and it lives in zz-model-residency.conf. Setting
# it in both files made the effective value an accident of filename ordering.
