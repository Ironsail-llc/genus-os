# Thermal containment (2026-08-19): ollama was thrashing the shared GB10
# package (87C acpitz, three prior thermal hard-cuts on this box).
# CPUQuota bounds the CPU-side work; GPU inference is paced by the freq cap
# and the ingest cadence. CPUWeight keeps the engine responsive under load.
[Service]
CPUQuota=500%
CPUWeight=60
Nice=10

[Service]
# 2026-08-24: NUM_PARALLEL 1 -> 2. The =1 cap serialized every request — which
# made the 0.6B reranker score memory-search candidates one at a time and put
# 1.2s of latency on every memory read (97% of search_facts p50). Two parallel
# slots halve that burst; the thermal exposure is bounded because the thermal
# guard (robothor-thermal-guard.timer) now throttles at 85C, pages at 90C and
# clean-reboots at 94C autonomously — protection the =1 cap predates.
Environment=OLLAMA_NUM_PARALLEL=2
Environment=OLLAMA_MAX_LOADED_MODELS=2
