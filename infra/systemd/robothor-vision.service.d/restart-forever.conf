# The vision service restarts forever. systemd's default start limit (5 starts per
# 10s interval) turns a crash loop into a permanently stopped vision service that
# nothing restarts — the failure mode is silence, and the box is administered
# remotely. Rate limiting belongs in the pager (robothor-alert@.service, which
# dedups per unit) and in robothor-boot-guard.service, not here.
# See docs/runbooks/PAGING.md.
[Unit]
StartLimitIntervalSec=0
