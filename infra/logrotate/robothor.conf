# Log rotation for a Genus OS instance.
#
# Installed to /etc/logrotate.d/robothor by scripts/install-host-scripts.sh,
# which renders this template through scripts/render-unit.sh — /opt/robothor is
# the canonical workspace placeholder (infra/systemd/README.md), never a real
# path, because the workspace differs per instance.
#
# Why this file exists: the box carried /etc/logrotate.d/robothor with NO
# source in the repo, covering exactly one glob (/var/log/robothor/*.log).
# Everything the cron jobs write went to brain/memory_system/logs/, which had
# grown to 205 MB with nothing ever rotating it. A rebuilt box would have
# inherited neither the policy nor the knowledge that it was needed.
#
# copytruncate is load-bearing, not a default: every writer here is a plain
# `>>` shell redirect held open by a long-lived process, so a RENAMED file goes
# on being written at the same inode and rotation frees nothing at all. The
# cost is a small window where lines can be lost between the copy and the
# truncate; for append-only job output that is the right trade, and the
# alternative — teaching every cron job to reopen its log — is not one policy
# but thirty.

/var/log/robothor/*.log {
    weekly
    rotate 8
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}

/opt/robothor/brain/memory_system/logs/*.log
/opt/robothor/brain/memory_system/logs/*.jsonl {
    weekly
    rotate 8
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
