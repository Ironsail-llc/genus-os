# Application services (engine, bridge, orchestrator, dashboard).
# Layered on top of docker-compose.yml.
#
# Usage:
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.apps.yml up -d --build
#
# Secrets and instance-specific settings live in infra/.env. Container DNS,
# bind addresses, and workspace paths are explicit here so a host-oriented
# .env cannot silently point a container back at itself.

services:
  engine:
    build:
      context: ..
      dockerfile: Dockerfile.python
      target: dev
    image: genusos/python:dev
    container_name: robothor-engine
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    env_file:
      - path: .env
        required: false
    environment:
      ROBOTHOR_ENGINE_HOST: 0.0.0.0
      ROBOTHOR_WORKSPACE: /workspace
      ROBOTHOR_MANIFEST_DIR: /workspace/docs/agents
      ROBOTHOR_ALLOW_EMPTY_FLEET: "false"
      ROBOTHOR_MIN_AGENT_COUNT: "1"
      ROBOTHOR_REQUIRED_AGENT_IDS: main
      ROBOTHOR_DB_HOST: postgres
      ROBOTHOR_DB_SSLMODE: prefer
      ROBOTHOR_REDIS_HOST: redis
      ROBOTHOR_OLLAMA_HOST: ollama
      BRIDGE_URL: http://bridge:9100
      ORCHESTRATOR_URL: http://orchestrator:9099
    # NOTE: HEAD's robothor.engine.daemon instantiates TelegramBot
    # unconditionally (aiogram crashes on empty token). To run without
    # Telegram, comment out ROBOTHOR_TELEGRAM_BOT_TOKEN in infra/.env or
    # apply the daemon guard from this session's stash.
    ports:
      - "127.0.0.1:18800:18800"
    volumes:
      - ../robothor:/app/robothor
      - ../crm:/app/crm
      - robothor_workspace:/workspace
      - ../brain:/workspace/brain
      - ../docs:/workspace/docs
      - ../agents:/workspace/agents:ro
      - robothor_logs:/var/log/robothor
      - ${USERPROFILE:-${HOME}}/.robothor:/root/.robothor:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:18800/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  bridge:
    image: genusos/python:dev
    container_name: robothor-bridge
    restart: always
    depends_on:
      engine:
        condition: service_started
      orchestrator:
        condition: service_healthy
    working_dir: /app/crm/bridge
    command: ["python", "bridge_service.py"]
    env_file:
      - path: .env
        required: false
    environment:
      ROBOTHOR_BRIDGE_HOST: 0.0.0.0
      ROBOTHOR_WORKSPACE: /workspace
      ROBOTHOR_MANIFEST_DIR: /workspace/docs/agents
      ROBOTHOR_DB_HOST: postgres
      ROBOTHOR_DB_SSLMODE: prefer
      ROBOTHOR_REDIS_HOST: redis
      MEMORY_URL: http://orchestrator:9099
    ports:
      - "127.0.0.1:9100:9100"
    volumes:
      - ../robothor:/app/robothor
      - ../crm:/app/crm
      - robothor_workspace:/workspace
      - ../brain:/workspace/brain
      - ../docs:/workspace/docs
      - ../agents:/workspace/agents:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9100/ready"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 60s

  orchestrator:
    image: genusos/python:dev
    container_name: robothor-orchestrator
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    command: ["uvicorn", "robothor.api.orchestrator:app", "--host", "0.0.0.0", "--port", "9099"]
    env_file:
      - path: .env
        required: false
    environment:
      ROBOTHOR_DB_HOST: postgres
      ROBOTHOR_DB_SSLMODE: prefer
      ROBOTHOR_OLLAMA_HOST: ollama
    ports:
      - "127.0.0.1:9099:9099"
    volumes:
      - ../robothor:/app/robothor
      - ../crm:/app/crm
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9099/ready"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 60s

  dashboard:
    build:
      context: ..
      dockerfile: Dockerfile.app
      target: dev
    image: genusos/dashboard:dev
    container_name: robothor-dashboard
    restart: always
    depends_on:
      bridge:
        condition: service_healthy
      orchestrator:
        condition: service_healthy
      engine:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      BRIDGE_URL: http://bridge:9100
      ORCHESTRATOR_URL: http://orchestrator:9099
      ROBOTHOR_ENGINE_URL: http://engine:18800
      # Browser traffic stays same-origin and is forwarded by the dashboard.
      NEXT_PUBLIC_BRIDGE_URL: /api/bridge
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ../app:/app
      # NOTE: node_modules and .next are intentionally NOT persistent
      # volumes. Both Turbopack's incremental cache and pnpm's installed
      # tree drifted out of sync with the freshly built image across
      # restarts — symptoms were stale 404s on existing routes and
      # "Next.js package not found" Turbopack panics. Each container
      # start now does a clean install + recompile (~30s slower) but
      # is always correct.
      - /app/node_modules
      - /app/.next
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/ready >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

volumes:
  robothor_workspace:
    driver: local
  robothor_logs:
    driver: local
  dashboard_node_modules:
    driver: local
